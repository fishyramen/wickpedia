<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wickpedia — The Trading Encyclopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --line:#1e2635; --line2:#2a3550;
  --tx:#e8edf5; --mut:#9aa7ba; --dim:#5f6b7d;
  --up:#16c784; --down:#ea3943; --gold:#e8b64c; --blue:#5aa2ff;
  --upbg:rgba(22,199,132,.12); --downbg:rgba(234,57,67,.12); --goldbg:rgba(232,182,76,.12); --bluebg:rgba(90,162,255,.12);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",monospace}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c40;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#12203a,#0f1626);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:none;color:var(--mut);font-size:.9rem;font-weight:500;padding:7px 12px;border-radius:8px;transition:.15s}
.nav button:hover{color:var(--tx);background:var(--panel2)}
.nav button.active{color:var(--tx);background:var(--panel2)}
.spacer{flex:1}
.lang-pick{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.lang-pick button{background:none;border:none;color:var(--dim);font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:6px}
.lang-pick button.on{background:var(--panel2);color:var(--tx)}
.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--mut);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{color:var(--tx);border-color:var(--line2)}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.view{padding:34px 0 80px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1.page{font-family:"Space Grotesk";font-size:2.1rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--mut);max-width:640px}

/* home hero */
.hero{padding:52px 0 8px}
.hero h1{font-family:"Space Grotesk";font-size:clamp(2.2rem,4.5vw,3.4rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;max-width:760px}
.hero .sub{margin-top:14px;font-size:1.05rem}
.searchbar{margin-top:26px;position:relative;max-width:640px}
.searchbar input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:14px;color:var(--tx);font-size:1rem;padding:15px 18px 15px 48px;outline:none;transition:.15s;font-family:inherit}
.searchbar input:focus{border-color:var(--up);box-shadow:0 0 0 3px rgba(22,199,132,.14)}
.searchbar .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim)}
.hstats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hstat b{font-family:"Space Grotesk";font-size:1.5rem;font-weight:700;display:block}
.hstat span{color:var(--dim);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}

/* section labels */
.seclabel{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:44px 0 16px;display:flex;align-items:center;gap:12px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--panel2)}
.cat .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:1.1rem}
.cat h3{font-size:.95rem;font-weight:600;margin-bottom:2px}
.cat p{color:var(--dim);font-size:.78rem}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:8px}
.acard:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--panel2)}
.acard .tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acard h3{font-size:1.02rem;font-weight:600;line-height:1.3}
.acard p{color:var(--mut);font-size:.86rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.acard .meta{display:flex;gap:10px;color:var(--dim);font-size:.74rem;font-family:"IBM Plex Mono";margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;font-family:"IBM Plex Mono";letter-spacing:.03em}
.chip.bull{color:var(--up);background:var(--upbg)}
.chip.bear{color:var(--down);background:var(--downbg)}
.chip.neu{color:var(--gold);background:var(--goldbg)}
.chip.cat{color:var(--blue);background:var(--bluebg)}
.chip.lvl-b{color:var(--up);background:var(--upbg)}
.chip.lvl-i{color:var(--gold);background:var(--goldbg)}
.chip.lvl-a{color:var(--blue);background:var(--bluebg)}
.freq{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--dim);font-family:"IBM Plex Mono"}
.freq i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.freq.c i{background:var(--up)} .freq.o i{background:var(--gold)} .freq.r i{background:var(--blue)}

/* article */
.article{max-width:780px;margin:0 auto}
.article .head{margin-bottom:8px}
.article h1{font-family:"Space Grotesk";font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:8px 0 10px}
.defbox{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin:18px 0;font-size:1.02rem}
.defbox .lbl{font-family:"IBM Plex Mono";font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.article .body h2{font-family:"Space Grotesk";font-size:1.3rem;font-weight:600;margin:28px 0 10px;letter-spacing:-.01em}
.article .body p{margin:12px 0;color:#c7d0dd}
.article .body ul{margin:12px 0 12px 4px;display:flex;flex-direction:column;gap:8px}
.article .body li{padding-left:20px;position:relative;color:#c7d0dd}
.article .body li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--up)}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:18px 0}
.chartbox svg{width:100%;height:auto;display:block}
.chartcap{color:var(--dim);font-size:.8rem;text-align:center;margin-top:10px;font-family:"IBM Plex Mono"}
.note{border-radius:10px;padding:14px 16px;margin:16px 0;font-size:.92rem;display:flex;gap:12px}
.note.tip{background:var(--upbg);border:1px solid rgba(22,199,132,.25)}
.note.warn{background:var(--goldbg);border:1px solid rgba(232,182,76,.25)}
.note .nic{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;margin-top:1px}
.note.tip .nic{background:rgba(22,199,132,.2);color:var(--up)}
.note.warn .nic{background:rgba(232,182,76,.2);color:var(--gold)}
.backbtn{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:.88rem;margin-bottom:18px;background:none;border:none;padding:6px 10px;border-radius:8px;transition:.15s}
.backbtn:hover{color:var(--tx);background:var(--panel2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.kv .kvbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv .kvbox .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-family:"IBM Plex Mono"}
.kv .kvbox .v{font-weight:600;margin-top:3px;font-size:.95rem}

/* filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.fbtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:99px;font-size:.84rem;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.fbtn:hover{color:var(--tx);border-color:var(--line2)}
.fbtn.on{background:var(--upbg);border-color:rgba(22,199,132,.4);color:var(--up)}
.fbtn .dot{width:7px;height:7px;border-radius:50%}
.count{color:var(--dim);font-size:.85rem;margin:6px 2px 14px;font-family:"IBM Plex Mono"}

/* practice game */
.game-shell{max-width:900px;margin:0 auto}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.game-top h2{font-family:"Space Grotesk";font-size:1.5rem;font-weight:700}
.scorebox{display:flex;gap:10px}
.scorebox .sb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;min-width:74px}
.scorebox .sb b{font-family:"Space Grotesk";font-size:1.2rem;display:block}
.scorebox .sb span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.game-chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.game-chart svg{width:100%;height:auto;display:block}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.pickbtn{padding:16px;border-radius:12px;border:1px solid;font-family:"Space Grotesk";font-weight:700;font-size:1.05rem;transition:.18s;display:flex;align-items:center;justify-content:center;gap:10px}
.pickbtn:disabled{opacity:.5;cursor:default}
.pickbtn.up{background:var(--upbg);border-color:rgba(22,199,132,.4);color:var(--up)}
.pickbtn.up:hover:not(:disabled){background:rgba(22,199,132,.22)}
.pickbtn.dn{background:var(--downbg);border-color:rgba(234,57,67,.4);color:var(--down)}
.pickbtn.dn:hover:not(:disabled){background:rgba(234,57,67,.22)}
.result{text-align:center;margin-top:16px;padding:16px;border-radius:12px;font-size:1rem;animation:fadeUp .3s ease both}
.result.win{background:var(--upbg);border:1px solid rgba(22,199,132,.3);color:var(--up)}
.result.lose{background:var(--downbg);border:1px solid rgba(234,57,67,.3);color:var(--down)}
.result .big{font-family:"Space Grotesk";font-size:1.4rem;font-weight:700}
.nextbtn{margin:16px auto 0;display:block;background:var(--up);color:#04120b;font-weight:700;border:none;padding:12px 28px;border-radius:10px;font-size:.95rem;transition:.15s}
.nextbtn:hover{filter:brightness(1.1)}
.gload{text-align:center;color:var(--mut);padding:60px 0}

/* trading desk */
.desk{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.desk-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
.desk-bar .sym{font-family:"Space Grotesk";font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.desk-bar .price{font-family:"IBM Plex Mono";font-weight:600}
.tfs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap}
.tfs button{background:none;border:none;color:var(--dim);font-size:.74rem;font-family:"IBM Plex Mono";padding:4px 8px;border-radius:6px;transition:.12s}
.tfs button:hover{color:var(--tx)}
.tfs button.on{background:var(--panel2);color:var(--up)}
.desk-body{display:grid;grid-template-columns:1fr 300px;min-height:440px}
.desk-chart{padding:14px;border-right:1px solid var(--line);min-width:0}
.desk-chart svg{width:100%;height:auto;display:block}
.desk-side{padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.desk-side h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-family:"IBM Plex Mono"}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-btns button{padding:12px;border-radius:9px;border:none;font-weight:700;font-family:"Space Grotesk";font-size:.95rem;transition:.15s}
.side-btns .buy{background:var(--up);color:#04120b}
.side-btns .sell{background:var(--down);color:#fff}
.side-btns button:hover{filter:brightness(1.1)}
.desk-side input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--tx);padding:10px 12px;font-family:"IBM Plex Mono";font-size:.9rem;outline:none}
.pos{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.82rem;font-family:"IBM Plex Mono"}
.pos .close{background:var(--downbg);color:var(--down);border:none;border-radius:6px;padding:4px 9px;font-size:.72rem;font-weight:600}
.acct-line{display:flex;justify-content:space-between;font-size:.86rem;padding:4px 0;font-family:"IBM Plex Mono"}
.acct-line span:first-child{color:var(--dim)}
.empty-note{color:var(--dim);font-size:.82rem;text-align:center;padding:14px 0}

/* onboarding */
.ob-overlay{position:fixed;inset:0;background:rgba(5,8,14,.8);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .3s ease both}
.ob-card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:480px;width:100%;padding:30px;animation:fadeUp .4s ease both}
.ob-card h2{font-family:"Space Grotesk";font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.ob-card .sub{margin-bottom:22px}
.ob-step{font-family:"IBM Plex Mono";font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:13px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.15s;text-align:left;color:var(--tx);width:100%}
.opt:hover{border-color:var(--line2);transform:translateX(3px)}
.opt .flag{font-size:1.4rem}
.opt b{display:block;font-weight:600}
.opt span{color:var(--mut);font-size:.82rem}
.ob-start{width:100%;margin-top:22px;background:var(--up);color:#04120b;font-weight:700;border:none;padding:13px;border-radius:10px;font-size:1rem;transition:.15s}
.ob-start:hover{filter:brightness(1.08)}
.ob-start:disabled{opacity:.5;cursor:default}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:11px 20px;border-radius:10px;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--dim);font-size:.8rem;margin-top:40px}
@media(max-width:860px){.desk-body{grid-template-columns:1fr}.desk-chart{border-right:none;border-bottom:1px solid var(--line)}}
@media(max-width:640px){.nav{display:none}}
</style>
</head>

var ARTICLES=[
{id:"what-is-candlestick",cat:"basics",lvl:"b",title:"What is a candlestick?",al:["candle","candlestick","ohlc"],def:"A candlestick shows one period of price as four numbers — open, high, low, close — drawn as a body plus two wicks.",
 b:[["p","A candlestick compresses an entire battle between buyers and sellers into one shape. The thick part is the <b>body</b> (open to close). The thin lines are the <b>wicks</b> (how far price reached before being pushed back)."],
 ["chart",{c:[[35,82,28,74],[74,78,26,30]],cap:"Green candle (buyers won) vs red candle (sellers won)"}],
 ["h","Why it matters"],
 ["p","Unlike a line chart, a candle tells you who won, by how much, and where the extremes were. That extra information is the foundation of every pattern in this encyclopedia."],
 ["tip","Body = conviction. Wicks = rejection. Learn to read those two things and you can read any chart."]]},
{id:"candle-anatomy",cat:"basics",lvl:"b",title:"Candle anatomy: body & wicks",al:["body","wick","shadow"],def:"The body shows how far price moved and held; the wicks show where price was rejected.",
 b:[["charts",[{c:[[35,80,30,74]],cap:"Bullish — close at the top"},{c:[[74,78,28,34]],cap:"Bearish — close at the bottom"}]],
 ["p","A long body means one side dominated. A long wick means the market tried to go somewhere and got pushed back. A long lower wick after a downtrend is buyers stepping in; a long upper wick after a rally is sellers stepping in."],
 ["tip","When you see a long wick, ask: which side got rejected, and where?"],
 ["keep",["what-is-candlestick","what-wicks-mean"]]]},
{id:"what-wicks-mean",cat:"basics",lvl:"b",title:"What wicks tell you",al:["wick rejection","shadows"],def:"Wicks are footprints of rejection — price visited a level and was pushed back.",
 b:[["chart",{c:[[58,62,46,60],[56,60,44,58],[54,58,20,56],[52,86,50,54]],cap:"Long lower wick = dips bought · long upper wick = rallies sold"}],
 ["p","Wicks are the market's memory of failed attempts. A long lower wick at support shows buyers defending. A long upper wick at resistance shows sellers defending. Traders use wicks to time entries and place stops."],
 ["tip","The longer the wick relative to the body, the stronger the rejection."]]},
{id:"timeframes",cat:"basics",lvl:"b",title:"Timeframes, explained",al:["timeframe","1h","daily","multi timeframe"],def:"A timeframe is how much time one candle represents. Higher timeframes dominate lower ones.",
 b:[["p","A 1-hour candle summarizes one hour; a daily candle summarizes a day. The same market can look bullish on the daily and bearish on the 5-minute. Always know which timeframe you're reading."],
 ["h","The golden rule"],
 ["p","Decide direction on the higher timeframe, find your entry on the lower one. A lower-timeframe signal against the higher timeframe is low-probability."],
 ["tip","Pick one execution timeframe and always check one or two above it before entering."]]},
{id:"volume",cat:"basics",lvl:"b",title:"Volume: the candle's lie detector",al:["volume","relative volume","rvol"],def:"Volume is how much actually traded. Big moves on big volume are real; big moves on tiny volume are suspect.",
 b:[["p","Volume confirms. A breakout on huge volume is participation; a breakout on tiny volume is often a trap. Compare current volume to its recent average (relative volume) to judge conviction."],
 ["tip","Price tells you what happened. Volume tells you how many people agree."]]},
{id:"market-structure",cat:"structure",lvl:"i",title:"Market structure: the map of every chart",al:["structure","hh hl","trend","higher highs","lower lows"],def:"Higher highs + higher lows = uptrend. Lower highs + lower lows = downtrend. Structure is the skeleton of every chart.",
 b:[["chart",{c:[[20,34,18,32],[30,40,28,38],[34,48,32,46],[42,52,40,44],[46,60,44,58],[54,64,52,56],[58,74,56,72],[66,76,62,68]],cap:"An uptrend: a staircase of higher highs and higher lows"}],
 ["p","Every chart is a staircase of swing points. If each high and low is higher than the last, you're in an uptrend — buy pullbacks. If each is lower, sell bounces. When the staircase breaks, the trend may be changing."],
 ["h","How trends break"],
 ["p","An uptrend breaks when price closes below the last higher low. A downtrend breaks when price closes above the last lower high. That break is called a <b>Break of Structure</b>."],
 ["tip","Trade with the staircase, not against it."]]},
{id:"support-resistance",cat:"structure",lvl:"b",title:"Support & resistance",al:["support","resistance","s/r","key level"],def:"Support is where buying repeatedly appears (a floor). Resistance is where selling appears (a ceiling).",
 b:[["chart",{c:[[50,56,42,46],[44,52,38,42],[40,50,38,48],[46,54,40,44],[42,52,38,50],[48,56,44,52],[50,60,46,58],[56,64,52,56]],zones:[[0,7,37,41,"grn","SUPPORT"],[0,7,53,57,"red","RESISTANCE"]],cap:"Price bouncing between a floor and a ceiling"}],
 ["p","Levels work because orders cluster there. Draw them as zones, not lines. They get stronger with more touches and on higher timeframes, and broken levels often flip roles."],
 ["tip","The middle of a range is no-man's-land. Only the edges pay."]]},
{id:"liquidity",cat:"smc",lvl:"i",title:"Liquidity: where the stops live",al:["liquidity","stops","stop hunt","smart money"],def:"Liquidity is where resting orders cluster — especially stop losses. Big players hunt these pools to fill large orders.",
 b:[["chart",{c:[[40,52,36,48],[46,58,42,54],[50,64,46,60],[56,66,52,58],[54,66,50,56],[58,66,54,57],[60,66,52,56],[62,67,40,44],[46,50,30,32],[34,40,26,28]],zones:[[1,6.7,66.5,71,"red","LIQUIDITY (stops)"]],cap:"Stops above equal highs get swept, then price drops"}],
 ["p","Stops cluster above obvious highs and below obvious lows. Big players who need to buy a lot need sellers — and triggered stops become sellers. So price often raids these pools before reversing."],
 ["h","How traders use it"],
 ["ul",["Mark obvious highs/lows where stops cluster.","Wait for price to sweep the pool (wick through, then reject).","Enter on the rejection, stop beyond the sweep wick.","Target the liquidity on the opposite side."]],
 ["warn","If you keep getting stopped out right before the move goes your way, you're standing where everyone stands."],
 ["keep",["sweeps","equal-highs","market-structure"]]]},
{id:"sweeps",cat:"smc",lvl:"i",title:"Liquidity sweeps (stop hunts)",al:["sweep","stop hunt","liquidity grab"],def:"A sweep is a quick raid beyond an obvious level that grabs stops, then reverses.",
 b:[["chart",{c:[[60,66,54,58],[56,66,50,56],[58,66,54,57],[62,70,56,60],[64,74,44,44],[50,54,42,46],[48,62,46,60]],cap:"Price swept the highs (long wick) then reversed"}],
 ["p","A sweep looks like a breakout for one candle, then reverses. The giveaway is the long wick beyond the level with a close back inside. Sweeps grab the stops resting beyond the level, then the move goes the other way."],
 ["tip","A breakout that immediately fails is often a sweep. Wait for the close back inside before calling it a real break."]]},
{id:"equal-highs",cat:"smc",lvl:"i",title:"Equal highs & equal lows",al:["equal highs","equal lows","eqh","eql"],def:"Two or more highs (or lows) at the same level. Stops cluster just beyond them, making them magnets for sweeps.",
 b:[["p","Equal highs look like a double top and attract shorts who place stops above. That cluster of stops is liquidity. Price often sweeps above the equal highs to grab those stops before reversing down (and vice versa for equal lows)."],
 ["tip","Equal highs/lows are not just patterns — they're targets. Mark them and watch for the sweep."]]},
{id:"fvg",cat:"smc",lvl:"i",title:"Fair Value Gaps (FVG)",al:["fvg","fair value gap","imbalance"],def:"An FVG is a 3-candle imbalance where price moved so fast it left an empty zone. Price often returns to fill it.",
 b:[["chart",{c:[[36,44,32,40],[42,66,40,64],[62,72,58,70]],zones:[[0,2,44,58,"grn","FVG"]],cap:"The gap between candle 1's high and candle 3's low"}],
 ["p","Look at three candles in a row. If candle 1's high and candle 3's low don't overlap, the empty space in the middle is a Fair Value Gap. It marks an imbalance where price moved too fast for both sides to trade."],
 ["h","How traders use it"],
 ["ul",["Mark FVGs created by strong moves (displacement).","Wait for price to return to the gap.","Enter on the touch or the midpoint, stop beyond the far side.","FVGs with the higher-timeframe trend are higher probability."]],
 ["tip","An FVG is a zone price may revisit, not a guarantee. Combine with structure."]]},
{id:"order-blocks",cat:"smc",lvl:"i",title:"Order blocks",al:["order block","ob"],def:"An order block is the last opposite-colored candle before a strong move. Price often returns to it.",
 b:[["chart",{c:[[62,66,54,58],[58,62,50,54],[54,58,46,50],[48,70,46,68],[64,78,62,76],[72,80,68,74]],zones:[[1,2.6,46,58,"grn","ORDER BLOCK"]],cap:"The last red candle before a strong rally"}],
 ["p","Before a strong move up, the last red candle is a bullish order block — where buying interest was absorbed. When price returns to that zone, it often reacts. The reverse applies for bearish order blocks."],
 ["h","What makes a good order block"],
 ["ul",["It launched a move that broke structure.","It left an FVG right after (shows urgency).","It sits in a discount zone (for buys) or premium (for sells).","It's fresh — untested blocks react better."]],
 ["tip","Use order blocks with structure, not alone. Ten traders mark ten different blocks."]]},
{id:"breaker-block",cat:"smc",lvl:"a",title:"Breaker blocks",al:["breaker"],def:"A breaker is a failed order block. When an order block fails, it flips and acts in the opposite direction.",
 b:[["p","If a bullish order block fails (price breaks below it), it becomes a bearish breaker. When price returns to it, it acts as resistance. Breakers combine two reliable ideas: a failed level and trapped traders exiting."],
 ["tip","Breakers are advanced. Master order blocks first."]]},
{id:"premium-discount",cat:"smc",lvl:"i",title:"Premium & discount zones",al:["premium","discount","equilibrium"],def:"Split a swing in half. Above 50% is premium (look to sell); below 50% is discount (look to buy).",
 b:[["chart",{c:[[46,54,42,50],[50,58,46,52],[48,56,40,42],[44,50,34,36],[38,46,30,32],[34,44,32,42],[40,52,38,50],[48,60,46,58],[56,68,54,66]],zones:[[0,8,55,70,"red","PREMIUM"],[0,8,28,43,"grn","DISCOUNT"]],lines:[[49,"gold","50% equilibrium"]],cap:"Buy in the lower half, sell in the upper half"}],
 ["p","Take the current swing from low to high and split it at 50%. Above that line, price is expensive (premium) — look to sell. Below it, price is cheap (discount) — look to buy. This one filter removes a huge number of bad trades."],
 ["tip","Never buy at the top of a range or sell at the bottom. That's donating your edge."]]},
{id:"bos",cat:"smc",lvl:"i",title:"Break of Structure (BOS)",al:["bos","break of structure"],def:"A BOS is when price breaks the last swing point in the trend direction and closes beyond it — the trend continuing.",
 b:[["p","In an uptrend, a BOS happens when price closes above the last higher high. In a downtrend, when it closes below the last lower low. It confirms the trend is continuing."],
 ["tip","Require a body close beyond the level, not just a wick. Wicks are sweeps, not breaks."]]},
{id:"choch",cat:"smc",lvl:"i",title:"Change of Character (CHoCH)",al:["choch","change of character"],def:"A CHoCH is the first break of structure against the trend — the earliest sign the trend may flip.",
 b:[["p","In an uptrend, a CHoCH happens when price breaks below the last higher low. That's the first objective sign the trend may be reversing. CHoCH warns; it doesn't confirm on its own."],
 ["tip","A single CHoCH on a tiny timeframe doesn't kill a higher-timeframe trend. Always check the timeframe."]]},
{id:"displacement",cat:"smc",lvl:"i",title:"Displacement",al:["displacement","impulse"],def:"Displacement is a sudden, energetic move — big candles, small wicks, speed — showing real intent.",
 b:[["p","Displacement is the fingerprint of real participation. It leaves FVGs behind and breaks structure. Only trust order blocks and breakouts that were launched by displacement."],
 ["tip","A slow grind through a level is suspect. Three full-bodied candles through it is a statement."]]},
{id:"inducement",cat:"smc",lvl:"a",title:"Inducement",al:["inducement","idm"],def:"Inducement is a fake early level that lures premature entries before the real move.",
 b:[["p","Before the real move, the market often creates a tempting early level to lure traders in, then sweeps them before continuing. Recognizing inducement stops you from being early liquidity."],
 ["tip","If a setup looks too obvious and early, ask: who am I being induced to be?"]]},
{id:"wyckoff",cat:"smc",lvl:"a",title:"Wyckoff: accumulation & distribution",al:["wyckoff","accumulation","distribution"],def:"Wyckoff describes how markets cycle between accumulation (buying), markup, distribution (selling), and markdown.",
 b:[["chart",{c:[[30,38,26,34],[32,40,28,36],[28,36,24,30],[30,40,26,36],[34,42,30,38],[36,46,32,42],[40,52,36,48],[46,60,42,56],[54,70,50,66],[64,80,60,76],[74,88,70,84],[82,92,76,82]],zones:[[0,4.6,24,42,"grn","ACCUMULATION"],[8,11.5,70,92,"red","DISTRIBUTION"]],cap:"Flat accumulation → markup → flat distribution → markdown"}],
 ["p","Markets alternate between ranging (accumulation/distribution) and trending (markup/markdown). Accumulation is quiet buying before a markup; distribution is quiet selling before a markdown. Knowing which phase you're in tells you whether to trade ranges or trends."],
 ["tip","Identify the phase first, then pick the playbook."]]},
{id:"killzones",cat:"smc",lvl:"i",title:"Killzones & session liquidity",al:["killzone","london open","ny open","sessions"],def:"Killzones are the high-volume windows (London/NY opens) where the day's real moves happen.",
 b:[["p","Volume concentrates at the London open (~07–10 UTC) and New York open (~12:30–15 UTC). These windows often sweep the earlier range, then start the day's real move. Trading outside these windows is lower-probability."],
 ["tip","Mark the earlier session's range, then watch the open sweep it before entering."]]},
{id:"risk-management",cat:"risk",lvl:"b",title:"Risk management: the math that keeps you alive",al:["risk","risk management"],def:"Risk management is sizing so a losing streak can't wipe you out. It's the only thing you fully control.",
 b:[["h","The 1% rule"],
 ["p","Never risk more than 1% of your account on one trade. At 1%, ten straight losses cost ~10% (survivable). At 10%, the same streak costs ~65%."],

/* ============ candle renderer ============ */
function renderCandles(el,candles,opts){
 opts=opts||{};
 var w=opts.w||240,h=opts.h||110,pad=opts.pad||10;
 var n=candles.length,lo=1e9,hi=-1e9,i;
 for(i=0;i<n;i++){if(candles[i][2]<lo)lo=candles[i][2];if(candles[i][1]>hi)hi=candles[i][1];}
 var span=(hi-lo)||1;lo-=span*0.08;hi+=span*0.08;span=(hi-lo)||1;
 function Y(v){return pad+(hi-v)/span*(h-2*pad);}
 var slot=(w-2*pad)/n,bw=Math.max(2,Math.min(20,slot*0.62));
 var svg='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
 for(var g=1;g<=3;g++){var gy=pad+(h-2*pad)*g/4;svg+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" stroke="rgba(148,170,200,.08)"/>';}
 if(opts.zones){opts.zones.forEach(function(z){
   var x1=pad+slot*z[0],x2=pad+slot*(z[1]+1),y1=Y(z[3]),y2=Y(z[2]);
   var col=z[4]==="grn"?"#16c784":z[4]==="red"?"#ea3943":z[4]==="gold"?"#e8b64c":"#5aa2ff";
   svg+='<rect x="'+x1+'" y="'+Math.min(y1,y2)+'" width="'+(x2-x1)+'" height="'+Math.abs(y2-y1)+'" rx="3" fill="'+col+'" opacity=".13"/>';
   svg+='<rect x="'+x1+'" y="'+Math.min(y1,y2)+'" width="'+(x2-x1)+'" height="'+Math.abs(y2-y1)+'" rx="3" fill="none" stroke="'+col+'" stroke-dasharray="4 3" opacity=".5"/>';
   if(z[5])svg+='<text x="'+(x1+5)+'" y="'+(Math.min(y1,y2)+12)+'" font-family="IBM Plex Mono,monospace" font-size="8" fill="'+col+'">'+z[5]+'</text>';
 });}
 if(opts.lines){opts.lines.forEach(function(l){
   var yy=Y(l[0]);var col=l[1]==="grn"?"#16c784":l[1]==="red"?"#ea3943":l[1]==="gold"?"#e8b64c":"#5aa2ff";
   svg+='<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+col+'" stroke-dasharray="4 4" opacity=".7"/>';
   if(l[2])svg+='<text x="'+(w-pad-3)+'" y="'+(yy-3)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="8" fill="'+col+'">'+l[2]+'</text>';
 });}
 if(opts.paths){opts.paths.forEach(function(pt){
   var pts=pt[0].map(function(pp){return (pad+slot*pp[0])+","+(Y(pp[1]));}).join(" ");
   var col=pt[1]==="gold"?"#e8b64c":pt[1]==="grn"?"#16c784":"#5aa2ff";
   svg+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" opacity=".9"/>';
 });}
 for(i=0;i<n;i++){
  var c=candles[i],o=c[0],hi2=c[1],lo2=c[2],cl=c[3],x=pad+slot*i+slot/2;
  var up=cl>=o,doji=Math.abs(cl-o)<span*0.02;
  var col=doji?"#e8b64c":(up?"#16c784":"#ea3943");
  var focus=opts.focus?(i>=n-opts.focus):true;
  var op=focus?1:0.32;
  svg+='<g opacity="'+op+'">';
  svg+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(hi2)+'" y2="'+Y(lo2)+'" stroke="'+col+'" stroke-width="1.6"/>';
  var yTop=Y(Math.max(o,cl)),yBot=Y(Math.min(o,cl)),bh=Math.max(2,yBot-yTop);
  if(doji){svg+='<rect x="'+(x-bw/2)+'" y="'+(yTop-1)+'" width="'+bw+'" height="2" fill="'+col+'"/>';}
  else{svg+='<rect x="'+(x-bw/2)+'" y="'+yTop+'" width="'+bw+'" height="'+bh+'" rx="1" fill="'+col+'"/>';}
  svg+='</g>';
 }
 svg+='</svg>';
 el.innerHTML=svg;
}

  }
 });

  try{var cfg=JSON.parse(el.getAttribute("data-chart").replace(/&#39;/g,"'"));renderCandles(el,cfg.c,cfg);}catch(e){}
 });

}

/* ============ practice game ============ */
var G={series:[],vis:18,total:30,picked:null,revealed:false,score:0,streak:0,best:0,src:"sim",idx:0};
try{var _g=localStorage.getItem("wp_game");if(_g){var gg=JSON.parse(_g);G.score=gg.s||0;G.streak=gg.st||0;G.best=gg.b||0;}}catch(e){}
function saveGame(){try{localStorage.setItem("wp_game",JSON.stringify({s:G.score,st:G.streak,b:G.best}));}catch(e){}}
function genSeries(n){
 var out=[],price=100+Math.random()*60,trend=(Math.random()-0.5)*0.9,i;
 for(i=0;i<n;i++){
  if(Math.random()<0.07)trend=(Math.random()-0.5)*1.8;
  var o=price,vol=price*0.006*(0.6+Math.random());
  var c=o+trend+(Math.random()-0.5)*vol*2;
  var hi=Math.max(o,c)+Math.random()*vol*0.7;
  var lo=Math.min(o,c)-Math.random()*vol*0.7;
  out.push([o,hi,lo,c]);price=c;
 }
 return out;
}
function loadRealData(){
 return fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=120")
  .then(function(r){if(!r.ok)throw new Error("bad");return r.json();})
  .then(function(d){return d.map(function(k){return[parseFloat(k[1]),parseFloat(k[2]),parseFloat(k[3]),parseFloat(k[4])];});});
}
function newRound(){
 G.picked=null;G.revealed=false;
 G.idx=Math.floor(Math.random()*Math.max(1,G.series.length-G.total));
 drawGame();
}
function drawGame(){
 var shown=G.revealed?G.total:G.vis;
 var seg=G.series.slice(G.idx,G.idx+shown);
 var h='<div class="view"><div class="game-shell">';
 h+='<div class="game-top"><h2>'+t("g_title")+'</h2><div class="scorebox">';
 h+='<div class="sb"><b>'+G.score+'</b><span>'+t("g_score")+'</span></div>';
 h+='<div class="sb"><b>'+G.streak+'</b><span>'+t("g_streak")+'</span></div>';
 h+='<div class="sb"><b>'+G.best+'</b><span>'+t("g_best")+'</span></div>';
 h+='</div></div>';
 h+='<p class="sub" style="margin-bottom:14px">'+t("g_sub")+' <span class="mono" style="color:var(--dim);font-size:.8rem">· '+(G.src==="live"?t("g_src_live"):t("g_src_sim"))+'</span></p>';
 h+='<div class="game-chart" id="gchart"></div>';
 if(!G.revealed){
  h+='<div class="pickrow"><button class="pickbtn up" id="pickUp">'+t("g_up")+'</button><button class="pickbtn dn" id="pickDn">'+t("g_dn")+'</button></div>';
 }else{
  var base=G.series[G.idx+G.vis-1][3],fin=G.series[G.idx+G.total-1][3];
  var up=fin>=base,win=(G.picked==="up")===up;
  var pct=((fin-base)/base*100).toFixed(2);
  h+='<div class="result '+(win?"win":"lose")+'"><div class="big">'+(win?t("g_win"):t("g_lose"))+'</div>';
  h+=t("g_move")+' <b>'+(up?"+":"")+pct+'%</b>';
  h+='<button class="nextbtn" id="nextBtn">'+t("g_next")+'</button></div>';
 }
 h+='</div></div>';
 app.innerHTML=h;
 renderCandles(document.getElementById("gchart"),seg,{w:820,h:340,pad:16,focus:G.revealed?0:G.vis});
 if(!G.revealed){
  document.getElementById("pickUp").addEventListener("click",function(){G.picked="up";reveal();});
  document.getElementById("pickDn").addEventListener("click",function(){G.picked="down";reveal();});
 }else{
  document.getElementById("nextBtn").addEventListener("click",function(){newRound();});
 }
}
function reveal(){
 G.revealed=true;
 var base=G.series[G.idx+G.vis-1][3],fin=G.series[G.idx+G.total-1][3];
 var win=(fin>=base)===(G.picked==="up");
 if(win){G.score++;G.streak++;if(G.streak>G.best)G.best=G.streak;}
 else{G.streak=0;}
 saveGame();drawGame();
}
function renderPractice(){
 if(G.series.length===0){
  app.innerHTML='<div class="view"><div class="game-shell"><div class="gload">'+t("g_load")+'</div></div></div>';
  loadRealData().then(function(d){G.series=d;G.src="live";newRound();}).catch(function(){G.series=genSeries(300);G.src="sim";newRound();});
 }else{newRound();}
}

/* ============ trading desk ============ */
var DESK={bal:10000,pos:[],tf:60000,data:[],timer:null};
try{var _d=localStorage.getItem("wp_desk");if(_d){var dd=JSON.parse(_d);DESK.bal=dd.bal!=null?dd.bal:10000;DESK.pos=dd.pos||[];}}catch(e){}
function saveDesk(){try{localStorage.setItem("wp_desk",JSON.stringify({bal:DESK.bal,pos:DESK.pos}));}catch(e){}}
function deskSeries(){
 var n=80;
 if(G.series.length>=n){return G.series.slice(G.series.length-n);}
 return genSeries(n);
}
function renderDesk(){
 if(DESK.data.length===0)DESK.data=deskSeries();
 var last=DESK.data[DESK.data.length-1],prev=DESK.data[DESK.data.length-2];
 var price=last[3],chg=((price-prev[3])/prev[3]*100).toFixed(2);
 var openPL=0;
 DESK.pos.forEach(function(p){openPL+=(price-p.entry)*p.qty*(p.side==="buy"?1:-1);});
 var equity=DESK.bal+openPL;
 var h='<div class="view"><div class="eyebrow">'+t("nav_trade")+'</div><h1 class="page">'+t("t_title")+'</h1><p class="sub">'+t("t_sub")+'</p><div style="height:16px"></div>';
 h+='<div class="desk">';
 h+='<div class="desk-bar"><div class="sym"><span style="width:8px;height:8px;border-radius:50%;background:'+(G.src==="live"?"var(--up)":"var(--gold)")+'"></span>BTC/USDT <span class="price" style="color:'+(chg>=0?"var(--up)":"var(--down)")+'">'+price.toFixed(2)+' ('+(chg>=0?"+":"")+chg+'%)</span></div>';
 h+='<div class="spacer"></div><div class="tfs" id="tfsel">';
 [15,60,240,1440].forEach(function(tf){h+='<button data-tf="'+tf+'"'+(tf===DESK.tf?" class=\"on\"":"")+'>'+tf+"m"+"</button>";});
 h+='</div></div>';
 h+='<div class="desk-body"><div class="desk-chart" id="deskchart"></div>';
 h+='<div class="desk-side">';
 h+='<div><h4>'+t("t_bal")+'</h4><div class="acct-line"><span>'+t("t_bal")+'</span><span>$'+DESK.bal.toLocaleString()+'</span></div>';
 h+='<div class="acct-line"><span>'+t("t_equity")+'</span><span>$'+equity.toFixed(2)+'</span></div>';
 h+='<div class="acct-line"><span>'+t("t_open")+'</span><span style="color:'+(openPL>=0?"var(--up)":"var(--down)")+'">$'+openPL.toFixed(2)+'</span></div></div>';
 h+='<div><h4>'+t("t_amount")+'</h4><input id="amt" type="number" value="1000" min="1"></div>';
 h+='<div class="side-btns"><button class="buy" id="buyBtn">'+t("t_buy")+'</button><button class="sell" id="sellBtn">'+t("t_sell")+'</button></div>';
 h+='<div><h4>'+t("t_pos")+'</h4><div id="poslist">';
 if(DESK.pos.length===0){h+='<div class="empty-note">'+t("t_none")+'</div>';}
 else{
  DESK.pos.forEach(function(p,i){
   var pl=(price-p.entry)*p.qty*(p.side==="buy"?1:-1);
   h+='<div class="pos"><span>'+(p.side==="buy"?"▲":"▼")+' '+p.qty.toFixed(4)+' @ '+p.entry.toFixed(2)+'</span><span style="color:'+(pl>=0?"var(--up)":"var(--down)")+'">$'+pl.toFixed(2)+'</span><button class="close" data-i="'+i+'">'+t("t_close")+'</button></div>';
  });
 }
 h+='</div></div>';
 h+='<button class="fbtn" id="resetDesk" style="width:100%;justify-content:center">'+t("t_reset")+'</button>';
 h+='</div></div></div></div>';
 app.innerHTML=h;
 renderCandles(document.getElementById("deskchart"),DESK.data,{w:800,h:380,pad:16});
 document.getElementById("buyBtn").addEventListener("click",function(){openPos("buy");});
 document.getElementById("sellBtn").addEventListener("click",function(){openPos("sell");});
 document.querySelectorAll("#poslist .close").forEach(function(b){
  b.addEventListener("click",function(){closePos(parseInt(b.dataset.i));});
 });
 document.getElementById("resetDesk").addEventListener("click",function(){
  DESK.bal=10000;DESK.pos=[];saveDesk();renderDesk();toast("Account reset to $10,000");
 });
 document.querySelectorAll("#tfsel button").forEach(function(b){
  b.addEventListener("click",function(){DESK.tf=parseInt(b.dataset.tf);renderDesk();});
 });
 clearInterval(DESK.timer);
 DESK.timer=setInterval(function(){
  if(location.hash!=="#/trade"){clearInterval(DESK.timer);return;}
  tickDesk();
 },1500);
}
function tickDesk(){
 var last=DESK.data[DESK.data.length-1];
 var o=last[3],vol=o*0.0015;
 var c=o+(Math.random()-0.5)*vol*2;
 var hi=Math.max(o,c)+Math.random()*vol*0.5,lo=Math.min(o,c)-Math.random()*vol*0.5;
 last[1]=Math.max(last[1],hi);last[2]=Math.min(last[2],lo);last[3]=c;
 if(Math.random()<0.2){DESK.data.push([c,c+(Math.random()-0.5)*vol,c-(Math.random()-0.5)*vol,c]);if(DESK.data.length>100)DESK.data.shift();}
 var el=document.getElementById("deskchart");
 if(el)renderCandles(el,DESK.data,{w:800,h:380,pad:16});
 var price=c,openPL=0;
 DESK.pos.forEach(function(p){openPL+=(price-p.entry)*p.qty*(p.side==="buy"?1:-1);});
 var eqEl=document.querySelectorAll(".acct-line span");
 if(eqEl.length>=6){eqEl[1].textContent="$"+DESK.bal.toLocaleString();eqEl[3].textContent="$"+(DESK.bal+openPL).toFixed(2);eqEl[5].textContent="$"+openPL.toFixed(2);eqEl[5].style.color=openPL>=0?"var(--up)":"var(--down)";}
}
function openPos(side){
 var amtEl=document.getElementById("amt"),amt=parseFloat(amtEl?amtEl.value:0)||0;
 if(amt<=0){toast("Enter an amount first.");return;}
 if(amt>DESK.bal){toast("Not enough balance.");return;}
 var price=DESK.data[DESK.data.length-1][3];
 var qty=amt/price;
 DESK.pos.push({side:side,qty:qty,entry:price});
 saveDesk();renderDesk();toast((side==="buy"?"Long":"Short")+" opened: "+qty.toFixed(4)+" @ "+price.toFixed(2));
}
function closePos(i){
 var p=DESK.pos[i];if(!p)return;
 var price=DESK.data[DESK.data.length-1][3];
 var pl=(price-p.entry)*p.qty*(p.side==="buy"?1:-1);
 DESK.bal+=pl;
 DESK.pos.splice(i,1);
 saveDesk();renderDesk();toast("Closed · P/L $"+pl.toFixed(2));
}

/* ============ router ============ */
function go(v){location.hash="#/"+v;}
function route(){

 function setNav(k){var b=document.querySelector('#mainnav [data-nav="'+k+'"]');if(b)b.classList.add("active");}

 else if(h.indexOf("#/search/")===0){setNav("home");renderSearch(decodeURIComponent(h.slice(9)));}
 else if(h.indexOf("#/cat/")===0){setNav("home");renderCategory(h.slice(6));}
 else if(h.indexOf("#/a/")===0){setNav("home");renderArticle(h.slice(4));}
 else if(h==="#/dictionary"){setNav("dictionary");renderDictionary();}
 else if(h==="#/practice"){setNav("practice");renderPractice();}

 else{setNav("home");renderHome();}
}

});

/* boot */

applyI18nStatic();
if(!localStorage.getItem("wp_onboarded")){showOnboarding();}
route();
