<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wickpedia — The Trading Encyclopedia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0d12'/><line x1='10' y1='6' x2='10' y2='26' stroke='%2334d399' stroke-width='2'/><rect x='7' y='11' width='6' height='10' rx='1' fill='%2334d399'/><line x1='22' y1='5' x2='22' y2='24' stroke='%23f87171' stroke-width='2'/><rect x='19' y='8' width='6' height='9' rx='1' fill='%23f87171'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d12;--s1:#10151d;--s2:#141a24;--s3:#1a2130;--bd:#1e2735;--bd2:#2b3648;
--tx:#e9eef5;--mut:#9aa7ba;--dim:#5f6b7d;--grn:#34d399;--red:#f87171;--gold:#e8b64c;--blue:#74a8ff;
--disp:"Space Grotesk",sans-serif;--body:"Inter",sans-serif;--mono:"IBM Plex Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.65}
::selection{background:rgba(52,211,153,.25)}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(10,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hwrap{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:9px;color:var(--tx);text-decoration:none;flex:none}
.logo b{font-family:var(--disp);font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.logo b span{color:var(--grn)}
.logo svg rect.flame{animation:flick 3.2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.55}}
.searchbox{flex:1;max-width:520px;position:relative;margin:0 auto}
.searchbox input{width:100%;background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:12.5px;padding:9px 13px 9px 34px;border-radius:9px;transition:border-color .2s,box-shadow .2s}
.searchbox input:focus{outline:none;border-color:var(--grn);box-shadow:0 0 0 3px rgba(52,211,153,.12)}
.searchbox input::placeholder{color:var(--dim)}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.sdrop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;overflow:hidden;box-shadow:0 24px 60px -12px rgba(0,0,0,.75);display:none;animation:dropIn .18s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sdrop.open{display:block}
.sres{display:block;padding:10px 14px;color:var(--tx);text-decoration:none;border-bottom:1px solid var(--bd);transition:background .15s}
.sres:last-child{border-bottom:none}
.sres:hover{background:var(--s3)}
.sres .t{font-weight:500;font-size:.9rem}
.sres .d{font-size:.78rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.sres .c{float:right;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-left:10px}
.snone{padding:14px;color:var(--mut);font-size:.88rem}
.sall{display:block;text-align:center;padding:10px;font-family:var(--mono);font-size:11px;color:var(--grn);background:var(--s1);border-top:1px solid var(--bd)}
.hbtn{flex:none;display:flex;align-items:center;gap:7px;background:var(--s1);border:1px solid var(--bd);color:var(--mut);font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:8px 13px;border-radius:9px;text-decoration:none;transition:.2s}
.hbtn:hover{color:var(--tx);border-color:var(--bd2);transform:translateY(-1px)}
.hbtn.hot{color:#06251a;background:var(--grn);border-color:var(--grn);font-weight:500}
.hbtn.hot:hover{filter:brightness(1.08)}
select.lang{flex:none;background:var(--s1);border:1px solid var(--bd);color:var(--mut);font-family:var(--mono);font-size:11px;padding:8px 9px;border-radius:9px;cursor:pointer}
.icobtn{flex:none;background:var(--s1);border:1px solid var(--bd);color:var(--mut);width:36px;height:36px;border-radius:9px;font-size:14px;transition:.2s}
.icobtn:hover{color:var(--tx);border-color:var(--bd2)}

/* ---------- layout ---------- */
#app{max-width:1200px;margin:0 auto;padding:26px 20px 70px;min-height:calc(100vh - 112px)}
.view{animation:vin .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{border-top:1px solid var(--bd);padding:16px 20px;text-align:center;color:var(--dim);font-size:.78rem}
.sec-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:30px 0 14px;display:flex;align-items:center;gap:12px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--bd)}

/* ---------- home ---------- */
.home-open{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:stretch;margin-top:6px}
.ho-left{display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.ho-left h1{font-family:var(--disp);font-weight:700;font-size:clamp(1.9rem,3.6vw,2.9rem);letter-spacing:-.02em;line-height:1.12;margin:12px 0 12px}
.ho-left h1 em{font-style:normal;color:var(--grn)}
.ho-left p{color:var(--mut);max-width:52ch}
.bigsearch{position:relative;margin-top:20px;max-width:520px}
.bigsearch input{width:100%;background:var(--s1);border:1px solid var(--bd2);color:var(--tx);font-family:var(--mono);font-size:14px;padding:14px 16px 14px 42px;border-radius:12px;transition:.2s}
.bigsearch input:focus{outline:none;border-color:var(--grn);box-shadow:0 0 0 4px rgba(52,211,153,.12)}
.bigsearch .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim)}
.stats{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--disp);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat.g b{color:var(--grn)}.stat.y b{color:var(--gold)}.stat.b b{color:var(--blue)}
.feat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .25s;text-decoration:none;color:var(--tx)}
.feat:hover{border-color:var(--bd2);transform:translateY(-3px)}
.feat .fchart{background:radial-gradient(ellipse at 50% 0%,rgba(116,168,255,.06),transparent 70%),var(--s2);border-bottom:1px solid var(--bd);padding:8px}
.feat .fchart svg{width:100%;height:auto;display:block}
.feat .fbody{padding:16px 18px;flex:1;display:flex;flex-direction:column}
.feat .fk{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.feat h3{font-family:var(--disp);font-size:1.15rem;font-weight:600;line-height:1.3;margin-bottom:6px}
.feat p{font-size:.83rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.feat .fm{margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--grn)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cat-tile{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:13px 14px;color:var(--tx);text-decoration:none;transition:.22s}
.cat-tile:hover{transform:translateY(-3px);border-color:var(--bd2);background:var(--s2)}
.cat-tile .ck{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;background:var(--s3);color:var(--grn);border:1px solid var(--bd2)}
.cat-tile .cn{font-family:var(--disp);font-weight:600;font-size:.9rem;line-height:1.2}
.cat-tile .cc{font-family:var(--mono);font-size:10px;color:var(--dim)}

.banners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--bd2);border-radius:14px;padding:20px;color:var(--tx);text-decoration:none;transition:.25s;position:relative;overflow:hidden}
.banner:hover{transform:translateY(-3px);border-color:var(--grn)}
.banner.game:hover{border-color:var(--gold)}
.banner .bi{width:54px;height:54px;border-radius:12px;background:var(--s3);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex:none}
.banner h3{font-family:var(--disp);font-size:1.1rem;font-weight:600}
.banner p{font-size:.82rem;color:var(--mut)}
.banner .go{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--grn);flex:none}
.banner.game .go{color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px 16px 13px;color:var(--tx);text-decoration:none;transition:transform .22s,border-color .22s,background .22s;content-visibility:auto;contain-intrinsic-size:160px}
.card:hover{transform:translateY(-3px);border-color:var(--bd2);background:var(--s2)}
.card .cc{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.card h3{font-family:var(--disp);font-size:1rem;font-weight:600;line-height:1.3;margin-bottom:6px}
.card p{font-size:.82rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card .cm{display:flex;gap:10px;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--dim);align-items:center}
.lv{padding:1px 7px;border-radius:4px;font-family:var(--mono);font-size:9.5px}
.lv-b{color:var(--grn);background:rgba(52,211,153,.09)}
.lv-i{color:var(--gold);background:rgba(232,182,76,.09)}
.lv-a{color:var(--blue);background:rgba(116,168,254,.09)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--s1);border:1px solid var(--bd);padding:6px 13px;border-radius:999px;transition:.18s}
.chip:hover{color:var(--tx);border-color:var(--bd2);transform:translateY(-1px)}
.chip.on{color:#06251a;background:var(--grn);border-color:var(--grn);font-weight:500}

/* ---------- article ---------- */
.crumb{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.crumb a{color:var(--mut)}
.crumb a:hover{color:var(--tx)}
.post{max-width:760px}
.post-head h1{font-family:var(--disp);font-weight:700;font-size:clamp(1.65rem,3.2vw,2.3rem);letter-spacing:-.02em;line-height:1.15;margin:6px 0 8px}
.post-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:22px}
.aka{font-size:.8rem;color:var(--dim);font-style:italic;margin-bottom:16px}
.defbox{border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(232,182,76,.08),rgba(232,182,76,.02));border-radius:0 11px 11px 0;padding:16px 20px;margin-bottom:28px;animation:vin .5s .1s both}
.defbox .dl{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.defbox p{font-size:1.02rem;color:var(--tx)}
.post-body h2{font-family:var(--disp);font-size:1.26rem;font-weight:600;margin:32px 0 10px;letter-spacing:-.01em;scroll-margin-top:80px}
.post-body p{color:#c6cfdd;margin-bottom:14px}
.post-body p b,.post-body li b{color:var(--tx)}
.post-body ul{margin:0 0 16px 20px;color:#c6cfdd}
.post-body li{margin-bottom:6px}
.post-body a{color:var(--grn)}
.post-body a:hover{text-decoration:underline}
.notebox{border-radius:10px;padding:13px 16px;font-size:.9rem;margin:18px 0;display:flex;gap:11px}
.nb-tip{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.22);color:#bfe9d6}
.nb-warn{background:rgba(232,182,76,.06);border:1px solid rgba(232,182,76,.25);color:#eedcb2}
.chartbox{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:20px 0}
.chartbox svg{width:100%;height:auto;display:block}
.chartcap{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:.88rem}
.kv td{padding:8px 4px;border-bottom:1px solid var(--bd)}
.kv td:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);width:40%}
.toc{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:15px 18px;margin-bottom:26px}
.toc .tt{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.toc a{display:block;color:var(--mut);font-size:.87rem;padding:3px 0}
.toc a:hover{color:var(--grn)}
.related{margin-top:44px;border-top:1px solid var(--bd);padding-top:8px}
.cw{transform-box:fill-box;transform-origin:50% 100%;animation:pop .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:scaleY(.08)}to{opacity:1;transform:none}}

/* ---------- dictionary page ---------- */
.dict-head p{color:var(--mut);max-width:70ch;margin-top:8px}
.pcard{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:13px;color:var(--tx);text-decoration:none;transition:.22s;content-visibility:auto;contain-intrinsic-size:230px}
.pcard:hover{transform:translateY(-4px);border-color:var(--bd2);background:var(--s2)}
.pcard .pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pbadge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.pb-bull{color:var(--grn);background:rgba(52,211,153,.1)}
.pb-bear{color:var(--red);background:rgba(248,113,113,.1)}
.pb-neu{color:var(--gold);background:rgba(232,182,76,.1)}
.prel{font-family:var(--mono);font-size:11px;font-weight:500}
.pcard .pchart{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:2px}
.pcard .pchart svg{width:100%;height:auto;display:block}
.pcard h3{font-family:var(--disp);font-size:.95rem;font-weight:600;margin-top:9px;line-height:1.25}
.pcard .pm{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px}

/* ---------- game ---------- */
.game-wrap{max-width:860px;margin:0 auto}
.game-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.game-top h2{font-family:var(--disp);font-size:1.4rem;font-weight:700;margin-right:auto}
.gstat{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--s1);border:1px solid var(--bd);padding:6px 12px;border-radius:8px}
.gstat b{color:var(--tx)}
.gsrc{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--mut);background:var(--s1);border:1px solid var(--bd);padding:6px 12px;border-radius:8px}
.gsrc i{width:7px;height:7px;border-radius:50%;flex:none}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.howto div{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--mut)}
.howto b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--grn);margin-bottom:4px}
.gchart{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:16px;margin-bottom:16px;min-height:280px}
.gchart svg{width:100%;height:auto;display:block}
.gprompt{text-align:center;color:var(--mut);font-size:.95rem;margin-bottom:14px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.gbtn{padding:16px;border-radius:11px;font-family:var(--disp);font-weight:600;font-size:1.05rem;border:1px solid;transition:.2s;background:var(--s1)}
.gbtn:disabled{opacity:.45;cursor:default}
.gbtn.up{color:var(--grn);border-color:rgba(52,211,153,.4)}
.gbtn.up:hover:not(:disabled){background:rgba(52,211,153,.1);transform:translateY(-2px)}
.gbtn.dn{color:var(--red);border-color:rgba(248,113,113,.4)}
.gbtn.dn:hover:not(:disabled){background:rgba(248,113,113,.1);transform:translateY(-2px)}
.gresult{max-width:520px;margin:0 auto;text-align:center;border-radius:11px;padding:15px 18px;font-size:.95rem;animation:vin .4s both}
.gresult.win{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);color:#c4eed9}
.gresult.lose{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#f5c9c9}
.gresult.push{background:var(--s2);border:1px solid var(--bd2);color:var(--mut)}
.gnext{display:block;margin:14px auto 0;background:var(--grn);color:#06251a;border:none;font-family:var(--disp);font-weight:600;padding:11px 26px;border-radius:9px;font-size:.95rem;transition:.2s}
.gnext:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* ---------- search results page ---------- */
.sr-item{display:block;background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:15px 17px;margin-bottom:10px;color:var(--tx);text-decoration:none;transition:.2s}
.sr-item:hover{border-color:var(--bd2);background:var(--s2);transform:translateX(4px)}
.sr-item h3{font-family:var(--disp);font-size:1rem;font-weight:600}
.sr-item p{font-size:.83rem;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-item .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:8px}

/* ---------- onboarding ---------- */
.ob{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.ob.show{opacity:1;pointer-events:auto}
.ob-card{background:var(--s2);border:1px solid var(--bd2);border-radius:16px;max-width:520px;width:100%;padding:34px 32px;transform:translateY(16px) scale(.98);transition:transform .35s cubic-bezier(.2,.9,.3,1.05)}
.ob.show .ob-card{transform:none}
.ob-card h2{font-family:var(--disp);font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.ob-card .sub{color:var(--mut);font-size:.9rem;margin-bottom:24px}
.ob-step{display:none}.ob-step.on{display:block;animation:vin .3s both}
.ob-opts{display:grid;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:15px 17px;color:var(--tx);transition:.2s}
.ob-opt:hover{border-color:var(--grn);transform:translateX(3px)}
.ob-opt .oi{font-size:1.4rem;flex:none;width:34px;text-align:center}
.ob-opt b{display:block;font-family:var(--disp);font-weight:600}
.ob-opt span{font-size:.8rem;color:var(--mut)}
.ob-step-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}

/* ============================ CHART ENGINE ============================ */
var CC={grn:"#34d399",red:"#f87171",gold:"#e8b64c",blue:"#74a8ff",mut:"#5f6b7d"};
function chartSVG(o){
 var c=o.c,W=o.w||680,H=o.h||300,pad=o.pad||26,s="";
 var lo=1e9,hi=-1e9,i;
 for(i=0;i<c.length;i++){lo=Math.min(lo,c[i][2]);hi=Math.max(hi,c[i][1]);}
 if(o.lines)for(i=0;i<o.lines.length;i++){lo=Math.min(lo,o.lines[i][0]);hi=Math.max(hi,o.lines[i][0]);}
 if(o.zones)for(i=0;i<o.zones.length;i++){lo=Math.min(lo,o.zones[i][2]);hi=Math.max(hi,o.zones[i][3]);}
 if(o.paths)for(i=0;i<o.paths.length;i++)for(var j=0;j<o.paths[i][0].length;j++){lo=Math.min(lo,o.paths[i][0][j][1]);hi=Math.max(hi,o.paths[i][0][j][1]);}
 var span=(hi-lo)||1;lo-=span*.08;hi+=span*.08;
 function Y(v){return pad+(hi-v)/(hi-lo)*(H-pad*2);}
 var n=c.length,slot=(W-pad*2)/n,bw=Math.min(o.bw||26,slot*.6);
 function X(k){return pad+slot*(k+0.5);}
 s+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#8a97ab"/></marker></defs>';
 for(var g=1;g<=3;g++){var gy=pad+(H-2*pad)*g/4;s+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+gy+'" y2="'+gy+'" stroke="rgba(150,170,200,.08)" stroke-dasharray="3 6"/>';}
 if(o.zones)for(i=0;i<o.zones.length;i++){var z=o.zones[i];
  var x1=X(z[0]-0.45),x2=X(z[1]+0.45),y1=Y(z[3]),y2=Y(z[2]),col=CC[z[4]]||z[4];
  s+='<rect x="'+x1+'" y="'+y1+'" width="'+Math.max(2,x2-x1)+'" height="'+Math.max(2,y2-y1)+'" rx="4" fill="'+col+'" opacity=".12"/>';
  s+='<rect x="'+x1+'" y="'+y1+'" width="'+Math.max(2,x2-x1)+'" height="'+Math.max(2,y2-y1)+'" rx="4" fill="none" stroke="'+col+'" opacity=".45" stroke-dasharray="4 4"/>';
  if(z[5])s+='<text x="'+(x1+6)+'" y="'+(y1+13)+'" font-family="IBM Plex Mono" font-size="9.5" fill="'+col+'">'+z[5]+'</text>';}
 if(o.lines)for(i=0;i<o.lines.length;i++){var l=o.lines[i],ly=Y(l[0]),lc=CC[l[1]]||l[1]||"#5f6b7d";
  s+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+ly+'" y2="'+ly+'" stroke="'+lc+'" stroke-width="1" stroke-dasharray="5 5" opacity=".8"/>';
  if(l[2])s+='<text x="'+(W-pad-4)+'" y="'+(ly-5)+'" text-anchor="end" font-family="IBM Plex Mono" font-size="9.5" fill="'+lc+'">'+l[2]+'</text>';}
 if(o.paths)for(i=0;i<o.paths.length;i++){var pp=o.paths[i],pts="";
  for(j=0;j<pp[0].length;j++)pts+=X(pp[0][j][0])+","+Y(pp[0][j][1])+" ";
  s+='<polyline points="'+pts+'" fill="none" stroke="'+(CC[pp[1]]||pp[1])+'" stroke-width="2" opacity=".9"/>';}
 if(o.arrows)for(i=0;i<o.arrows.length;i++){var a=o.arrows[i];
  s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(a[2])+'" y2="'+Y(a[3])+'" stroke="'+(CC[a[4]]||"#8a97ab")+'" stroke-width="1.6" marker-end="url(#ah)"/>';}
 for(i=0;i<c.length;i++){
  var k=c[i],ope=k[0],hig=k[1],low=k[2],clo=k[3],x=X(i);
  var isDoji=Math.abs(clo-ope)<=span*.02;
  var col2=isDoji?CC.gold:(clo>=ope?CC.grn:CC.red);
  var focused=o.focus?o.focus.indexOf(i)>-1:true;
  if(o.focus&&focused)s+='<rect x="'+(x-slot/2+2)+'" y="5" width="'+Math.max(2,slot-4)+'" height="'+(H-10)+'" rx="7" fill="'+col2+'" opacity=".07"/>';
  var anim=o.animate?' class="cw" style="--d:'+(i*55)+'ms"':'';
  s+='<g'+anim+' opacity="'+(focused?1:.38)+'">';
  s+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(hig)+'" y2="'+Y(low)+'" stroke="'+col2+'" stroke-width="2" stroke-linecap="round"/>';
  var yT=Y(Math.max(ope,clo)),yB=Y(Math.min(ope,clo)),bh=Math.max(2.5,yB-yT);
  if(isDoji)s+='<rect x="'+(x-bw/2)+'" y="'+(yT-1.4)+'" width="'+bw+'" height="2.8" rx="1" fill="'+col2+'"/>';
  else s+='<rect x="'+(x-bw/2)+'" y="'+yT+'" width="'+bw+'" height="'+bh+'" rx="2" fill="'+col2+'"/>';
  s+='</g>';}
 if(o.texts)for(i=0;i<o.texts.length;i++){var tx=o.texts[i];
  s+='<text x="'+X(tx[0])+'" y="'+Y(tx[1])+'" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="'+(CC[tx[3]]||"#9aa7ba")+'">'+tx[2]+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">'+s+'</svg>';
}

A({id:"what-is-candlestick",cat:"basics",title:"What is a candlestick?",al:["candle","candlestick","japanese candle","vela","bougie"],lvl:"b",
def:"A candlestick is a way of drawing one time period of price (one minute, hour, or day) as a single shape. It shows four facts at once: where price opened, its highest point, its lowest point, and where it closed.",
b:[["p","The thick part is the <b>real body</b>: the distance between open and close. If price closed above the open, the body is green (buyers won that period). If it closed below, the body is red (sellers won). The thin lines sticking out are the <b>wicks</b>: they show how far price traveled before being pushed back."],
["chart",{c:[[30,84,24,76]],lines:[[84,"mut","HIGH"],[24,"mut","LOW"]],cap:"One candle = one full battle between buyers and sellers"}],
["p","Candlesticks were invented by Japanese rice trader <b>Munehisa Homma</b> in the 1700s. His insight still holds: prices move on emotion, and the shape of a candle records that emotion. Next steps: [[candle-anatomy|candle anatomy]], then [[how-to-read-charts|how to read a chart]]."],
["tip","Every candle answers four questions: Who opened the fight? How far did each side push? Who won by the close? And how badly did the loser lose?"]]});
A({id:"candle-anatomy",cat:"basics",title:"Candle anatomy: body & wicks",al:["body","wick","shadow","real body","upper wick","lower wick"],lvl:"b",
def:"A candle has two parts. The body (rectangle) measures conviction — how far price moved and held. The wicks (thin lines) measure rejection — where price went but could not stay.",
b:[["charts",[{c:[[35,80,30,74]],cap:"Bullish: close at the TOP of the body"},{c:[[74,78,28,34]],cap:"Bearish: close at the BOTTOM of the body"}]],
["p","A <b>long upper wick</b> means buyers pushed price up and sellers slammed it back down — a rejected rally. A <b>long lower wick</b> means sellers pushed down and buyers absorbed it — a rejected drop. The longer the wick relative to the body, the stronger the rejection."],
["p","A big body with tiny wicks means one side controlled the entire session. A small body with big wicks on both sides means a draw. That single comparison — body vs wicks — is the foundation of reading every pattern, from the [[doji-family|doji]] to the [[hammer|hammer]]."],
["tip","Rule of thumb: body = who WON. Wicks = what got REJECTED."]]});
A({id:"ohlc",cat:"basics",title:"Open, High, Low, Close (OHLC)",al:["ohlc","open","high","low","close"],lvl:"b",
def:"The four prices behind every candle: the Open (first trade), the High (highest trade), the Low (lowest trade), and the Close (last trade). Every indicator and pattern is built from these four numbers.",
b:[["p","The <b>close</b> is the most important of the four — it is the price both sides agreed on when time ran out. Traders often say a move that happens mid-session but is not confirmed by the close simply does not count."],
["tip","Waiting for the candle to close before deciding avoids most fake signals. A candle can look like a breakout at minute 50 and close as a rejection wick."]]});
A({id:"bull-vs-bear",cat:"basics",title:"Bullish vs bearish candles",al:["green candle","red candle","bullish candle","bearish candle"],lvl:"b",

b:[["charts",[{c:[[32,78,28,72]],cap:"Bullish — price rose over the period"},{c:[[72,76,26,30]],cap:"Bearish — price fell over the period"}]],
["p","One candle tells you almost nothing by itself. What matters is the <b>sequence</b>: a green candle after ten red ones means something very different from a green candle inside a strong rally. This is why [[candle-context|context]] is the most underrated skill in candle reading."]]});
A({id:"what-wicks-mean",cat:"basics",title:"What wicks (shadows) tell you",al:["wick rejection","long wick","tail","pin bar"],lvl:"b",

b:[["chart",{c:[[58,62,46,60],[56,60,44,58],[54,58,20,56],[52,86,50,54]],texts:[[2.5,14,"lower wick = dips bought","grn"],[3.5,92,"upper wick = rallies sold","red"]],cap:"Rejections at the end of a move are the strongest"}],
["p","Wicks matter most at <b>key levels</b> — [[support-resistance|support and resistance]], old highs and lows. A long wick rejecting a level the market has respected before is one of the cleanest signals in trading. Whole concepts like [[sweeps|liquidity sweeps]] are built on reading wicks."]]});
A({id:"candle-context",cat:"basics",title:"Context: why location changes everything",al:["location","trend context"],lvl:"i",
def:"The same candle shape means opposite things in different places. Context — the trend and the level where a candle appears — matters more than the shape itself.",
b:[["p","A hammer-shaped candle at the bottom of a downtrend is a [[hammer|bullish reversal signal]]. The exact same shape at the top of an uptrend is a [[hanging-man|hanging man]] — a bearish warning. <b>The shape does not tell the story; the location does.</b>"],
["p","Before reading any candle, ask three questions: What is the trend? Where are the nearest [[support-resistance|support and resistance]] levels? Is this candle at an extreme or in the middle of nowhere? Only then does the candle itself matter."],
["warn","A common beginner mistake is memorizing patterns and trading them everywhere. A shooting star in choppy mid-range noise is nothing. A shooting star at a three-month high after a vertical rally is a signal."]]});
A({id:"timeframes",cat:"basics",title:"Timeframes, explained",al:["1m","5m","15m","1h","4h","daily","weekly","htf","ltf"],lvl:"b",
def:"A timeframe is how much time one candle represents — 1 minute, 1 hour, 1 day. The same market can be rising on one timeframe and falling on another. Higher timeframes dominate lower ones.",
b:[["ul",["<b>Scalpers</b> execute on 1m–5m charts.","<b>Day traders</b> usually work on 5m–1h.","<b>Swing traders</b> use 1h–daily.","<b>Position traders</b> look at daily–weekly."]],
["p","The golden rule is <b>top-down analysis</b>: decide direction on the higher timeframe, find the area on the middle one, enter on the lower one. See [[multi-tf|multi-timeframe analysis]]."],
["tip","Pick your execution timeframe, then always check one or two timeframes above it before entering. Trade WITH the higher timeframe, not against it."]]});
A({id:"volume",cat:"basics",title:"Volume: the candle's lie detector",al:["volume analysis","relative volume","rvol"],lvl:"i",
def:"Volume is how much actually traded during a candle. Big moves on big volume are real participation; big moves on tiny volume can be traps.",
b:[["p","A big green candle on huge volume means commitment — real orders, often institutions. A big green candle on tiny volume can be a trick: price moved because nobody was there, not because buyers were strong."],
["p","Traders compare current volume to its recent average (<b>relative volume</b>, RVOL). Breakouts on 3× average volume deserve attention; breakouts on half-average volume fail disproportionately often. See [[breakouts|breakouts & fakeouts]]."],
["tip","Price tells you WHAT happened. Volume tells you how many people agree."]]});
A({id:"gaps",cat:"basics",title:"Gaps (windows) in price",al:["gap up","gap down","window","mado"],lvl:"i",
def:"A gap is when price opens away from the previous close, leaving an empty area on the chart. Gaps show sudden repricing (news, panic, earnings). The Japanese call them windows.",
b:[["p","Gaps are common in stocks (which close overnight) and rare in crypto (which never closes). Common lore: <b>gaps often get filled</b> — price returns to the empty zone — especially small ones, but strong breakaway gaps can stay open a long time and act as support or resistance."],
["p","Pattern names built on gaps: [[rising-window|rising window]], [[abandoned-baby-bullish|abandoned baby]], [[bullish-kicking|kicking]]."]]});
A({id:"doji-family",cat:"basics",title:"The doji family, explained",al:["doji","cross","long-legged doji","dragonfly","gravestone"],lvl:"b",
def:"A doji is a candle whose open and close are (almost) the same price — the body becomes a line. It means the session ended exactly where it started: a draw. Dojis signal that conviction has disappeared.",
b:[["chart",{c:[[46,72,22,46.5],[48,90,10,48.4],[68,70,22,68.4],[30,78,28,30.4]],texts:[[0,78,"doji","mut"],[1,96,"long-legged","mut"],[2,76,"dragonfly","grn"],[3,84,"gravestone","red"]],cap:"Standard · long-legged · dragonfly · gravestone"}],
["ul",["<b>Standard doji</b> — small wicks both ways: simple indecision.","<b>Long-legged doji</b> — huge wicks: a violent draw.","<b>Dragonfly doji</b> — long lower wick: sellers rejected (bullish at lows).","<b>Gravestone doji</b> — long upper wick: buyers rejected (bearish at highs)."]],
["p","The power of a doji comes from where it appears: after a long trend, it warns the trend is tired. The [[morning-star|morning star]] is literally built around a doji middle candle."]]});
A({id:"marubozu-family",cat:"basics",title:"Marubozu candles, explained",al:["marubozu","full body","no wicks"],lvl:"i",
def:"A marubozu is the opposite of a doji: a full body with no wicks at all. One side won every minute of the session.",
b:[["charts",[{c:[[24,78,24,78]],cap:"Bullish marubozu: buyers owned the whole session"},{c:[[76,76,22,22]],cap:"Bearish marubozu: sellers owned the whole session"}]],
["p","Marubozus often start strong moves and appear inside patterns like [[bullish-kicking|kicking]]. Variants keep one wick: opening marubozu (wick at the close end) and closing marubozu (wick at the open end) — the closing version is considered stronger because it shows who controlled the finish."]]});
A({id:"chart-types",cat:"basics",title:"Candle vs bar vs line charts",al:["line chart","bar chart","heikin ashi"],lvl:"b",
def:"Three ways to draw price: line charts (closing prices only), bar charts (OHLC as ticks), and candlesticks (OHLC as bodies — the easiest to read). Heikin-Ashi is a smoothed variant.",
b:[["p","Line charts are clean but hide everything inside the period. Candlesticks show the same data as bars but the body is easier to read at a glance — which is why they won."],
["p","You may also meet <b>Heikin-Ashi</b>: averaged candles that make trends look smoother but distort real prices. Great for seeing the trend, dangerous for placing exact entries."]]});
A({id:"how-to-read-charts",cat:"basics",title:"How to read a candlestick chart",al:["reading charts","candle reading","chart reading"],lvl:"b",
def:"Reading a chart is a skill of layers: you read the candle, then its size, then its location, then the sequence, then the higher timeframe — in that order.",
b:[["h","Step 1 — Read the single candle"],
["p","Compare body to wicks. Big body, small wicks = conviction. Small body, big wicks = rejection or indecision. Green close above open; red close below. See [[candle-anatomy|candle anatomy]]."],
["h","Step 2 — Read the size"],
["p","Is this candle taller or shorter than the last ten? Sudden size = sudden interest. A candle twice the average height at a key level is a message; average-sized candles are chatter. See [[volume|volume]]."],
["h","Step 3 — Read the location"],
["p","At the top of a rally, at the bottom of a decline, at a level, or in the middle of nowhere? The same shape means different things in different places — [[candle-context|context is everything]]."],
["h","Step 4 — Read the sequence"],
["p","Candles form sentences. Red-red-red then a giant green candle that swallows them is a [[bullish-engulfing|bullish engulfing]]. A rally, a tiny pause, then a plunge is an [[evening-star|evening star]]. Browse the [[dictionary|candlestick dictionary]] for the full vocabulary."],
["h","Step 5 — Zoom out"],
["p","Check the higher [[timeframes|timeframe]]. If the daily chart is at resistance, a bullish 5-minute signal is a counter-trend trade. Higher timeframes dominate."],
["tip","Practice drill: pick ten random candles on any chart and answer for each — who won, by how much, and where did it happen? Ten minutes a day builds real fluency."]]});

/* ---------- Market Structure ---------- */
A({id:"market-structure",cat:"structure",title:"Market structure: the complete guide",al:["structure","trend structure","hh hl lh ll","bos"],lvl:"i",
def:"Market structure is the skeleton of the chart: the sequence of swing highs and swing lows. Higher highs + higher lows = uptrend. Lower highs + lower lows = downtrend. Everything else in technical analysis is decoration on top of this.",
b:[["h","The four building blocks"],
["p","Price moves in waves, and each wave makes a turning point. If the turning points are making <b>higher highs (HH)</b> and <b>higher lows (HL)</b>, the market is in an <b>uptrend</b>. If it is making <b>lower highs (LH)</b> and <b>lower lows (LL)</b>, it is in a <b>downtrend</b>. Neither? It is a [[ranges|range]]."],
["chart",{c:[[20,34,18,32],[30,40,28,38],[34,48,32,46],[42,52,40,44],[46,60,44,58],[54,64,52,56],[58,74,56,72],[66,76,62,68]],texts:[[1.5,43,"HL","grn"],[3.5,55,"HL","grn"],[2,51,"HH","grn"],[6,78,"HH","grn"]],cap:"Uptrend = a staircase of higher highs and higher lows"}],
["h","Breaks of structure"],
["p","An uptrend stays an uptrend until a significant <b>higher low fails</b> — price breaks below the last HL. That break is called a <b>Break of Structure</b> ([[bos|BOS]]) and it is the first objective sign the trend may be changing. If it breaks against the trend, that is a [[choch|CHoCH]]."],
["h","How to use it"],
["ul",["In an uptrend, look for buys at higher lows (pullbacks), not sells at highs.","In a downtrend, look for sells at lower highs.","Only flip your bias after structure actually breaks — not after one scary candle.","Always check structure on the higher [[timeframes|timeframe]] first."]],
["tip","The trend is your edge because it tells you which side has the higher probability. Trading against structure is betting on the exception."]]});
A({id:"hh-hl",cat:"structure",title:"Higher highs & lower lows",al:["higher high","higher low","lower high","lower low"],lvl:"b",
def:"The alphabet of trends. Uptrends print higher highs and higher lows (each dip holds above the last). Downtrends print lower highs and lower lows (each bounce fails below the last).",
b:[["p","This sounds trivial but it is the most reliable filter in trading: most losing trades are trades taken against the staircase. Before any entry, name the staircase out loud: higher highs, higher lows — I only buy here. See [[market-structure|market structure]]."]]});
A({id:"support-resistance",cat:"structure",title:"Support & resistance",al:["s/r","support level","resistance level","key level","floor","ceiling"],lvl:"b",
def:"Support is a price area where buying repeatedly appears — a floor. Resistance is where selling repeatedly appears — a ceiling. They form because orders cluster at memorable prices.",
b:[["chart",{c:[[50,56,42,46],[44,52,38,42],[40,50,38,48],[46,54,40,44],[42,52,38,50],[48,56,44,52],[50,60,46,58],[56,64,52,56],[54,64,50,62],[60,68,56,62]],zones:[[0,9,36,41,"grn","SUPPORT"],[0,9,59,64,"red","RESISTANCE"]],cap:"Price bouncing between a floor and a ceiling"}],
["p","Three rules make them usable: they are <b>zones, not lines</b> (price is messy); they get <b>stronger with more touches</b> and on higher [[timeframes|timeframes]]; and once broken they tend to <b>flip roles</b> — broken resistance often becomes support (see [[sr-flip|role flip]])."],
["tip","Draw levels from the higher timeframe, then drop to your trading timeframe to execute around them."]]});
A({id:"sr-flip",cat:"structure",title:"Role flip: broken levels change sides",al:["flip","resistance becomes support","level flip"],lvl:"i",
def:"When resistance breaks, it often becomes support; when support breaks, it often becomes resistance. Trapped traders defending their breakeven make the flip happen.",
b:[["p","Everyone who bought the old ceiling and got stopped out is waiting to get back in at breakeven — their buy orders defend the level on the return. This is why the [[retest|retest]] entry exists: instead of chasing the breakout, wait for price to come back to the broken level and hold it. See [[breakouts|breakouts]]."]]});
A({id:"supply-demand",cat:"structure",title:"Supply & demand zones",al:["supply zone","demand zone","s&d"],lvl:"i",
def:"A demand zone is the area where a strong rally started; a supply zone is where a strong drop started. The logic: unfilled orders may still be waiting there, so price returning to the zone often reacts.",
b:[["p","These are the institutional version of [[support-resistance|support and resistance]]. The strongest zones are the ones that launched a move which broke structure ([[bos|BOS]]) with speed ([[displacement|displacement]]). In SMC language, the last opposite candle before such a move is an [[order-blocks|order block]]."]]});
A({id:"trendlines",cat:"structure",title:"Trendlines & channels",al:["trendline","channel","diagonal support"],lvl:"b",
def:"A trendline connects swing lows in an uptrend (or swing highs in a downtrend) — diagonal support or resistance. Two touches draw it; the third touch tests it.",
b:[["p","A <b>channel</b> adds a parallel line on the other side of the swings. Honest caveats: trendlines are subjective — two traders draw them differently — and they get broken constantly. Treat a trendline break as <b>a clue, not a trigger</b>: combine it with a horizontal level or a structure break before acting."]]});
A({id:"ranges",cat:"structure",title:"Ranges & consolidation",al:["range","chop","consolidation","sideways market"],lvl:"b",
def:"A range is when price oscillates between support and resistance without making progress. Markets range roughly two-thirds of the time, and range trading needs a different playbook than trend trading.",
b:[["p","Two ways to trade ranges: buy support and sell resistance (<b>mean reversion</b>), or wait for the range to break and trade the [[breakouts|breakout]]. What kills accounts is doing trend-following entries in the middle of a range. First identify the regime, then pick the playbook."],
["warn","The middle of a range is the worst place to enter. Edges only."]]});
A({id:"breakouts",cat:"structure",title:"Breakouts & fakeouts",al:["breakout","fakeout","false breakout","break"],lvl:"i",
def:"A breakout is price leaving a range or level with force. A fakeout is a false breakout — price pokes through, traps the chasers, and reverses. Most breakouts fail, which is why filters matter.",
b:[["p","Filters that improve breakout quality: a strong [[displacement|displacement]] candle closing clearly beyond the level (not just wicking through), high [[volume|volume]], and alignment with the higher-timeframe trend. Or skip the entry entirely and wait for the [[retest|retest]] of the broken level."],
["p","Fakeouts are not accidents — they happen because stops and breakout orders cluster beyond obvious levels. That mechanism is [[liquidity|liquidity]], and trading the fakeout is covered in [[sweeps|liquidity sweeps]]."]]});
A({id:"retest",cat:"structure",title:"The retest",al:["retest entry","pullback to level"],lvl:"i",
def:"A retest is when price breaks a level, then comes back to touch it from the other side. If the level holds in its new role, the retest gives a calmer entry with a tighter stop than chasing.",
b:[["p","The retest is patience monetized: you accept a worse price (the breakout already moved) in exchange for confirmation that the level actually flipped ([[sr-flip|role flip]]). Combine with [[risk-reward|risk/reward]] thinking — retests usually offer much better R than the chase."]]});
A({id:"swing-points",cat:"structure",title:"Swing highs & swing lows",al:["swing high","swing low","pivot"],lvl:"b",
def:"A swing high is a local peak — a candle whose high is higher than the candles around it. A swing low is a local valley. These pivots are the raw material of trends, stops, and structure breaks.",
b:[["p","Trends are defined by swings ([[hh-hl|HH/HL]]), stops hide beyond them ([[liquidity|liquidity]]), and structure breaks are measured against them ([[bos|BOS]])."],
["tip","Practical definition: a candle with a lower high on its left AND right is a swing high. Mark the last 3–5 swings on your chart before every session."]]});
A({id:"multi-tf",cat:"structure",title:"Multi-timeframe (top-down) analysis",al:["top-down analysis","htf","alignment"],lvl:"i",
def:"Decide direction on the higher timeframe, find the level on the middle one, execute on the lower one. Higher timeframes dominate lower ones.",
b:[["ul",["<b>Higher (daily/4h)</b> — what is the trend and where are the key levels?","<b>Middle (1h)</b> — where in the structure are we? Pullback or extension?","<b>Lower (15m/5m)</b> — the actual entry trigger with a tight stop."]],
["warn","Never let a lower-timeframe signal override a higher-timeframe level. The 5-minute chart is the employee; the daily is the boss."]]});

/* ---------- Smart Money Concepts ---------- */
A({id:"liquidity",cat:"smc",title:"Liquidity: where the stops live",al:["liquidity","bsl","ssl","stop hunt","liquidity pool","where stops are"],lvl:"i",
def:"In trading, liquidity means two things: (1) how easily something can be bought or sold, and (2) pools of resting orders — especially stop losses — sitting at obvious price levels. Big players need those orders to fill big positions, so price is drawn to them.",
b:[["h","Where liquidity lives"],
["p","Think about where the crowd puts its stop losses: just <b>above old highs</b> (stops of short sellers), just <b>below old lows</b> (stops of buyers), beyond [[equal-highs|equal highs and lows]], beyond trendlines and round numbers. Those clusters of stops are, mechanically, clusters of orders — and whoever needs to fill huge positions needs exactly those orders as counterparties."],
["chart",{c:[[40,52,36,48],[46,58,42,54],[50,64,46,60],[56,66,52,58],[54,66,50,56],[58,66,54,57],[60,66,52,56],[62,67,40,44],[46,50,30,32],[34,40,26,28]],zones:[[1,6.7,66.5,71,"red","LIQUIDITY (buy stops)"]],arrows:[[7,44,7.4,36,"red"]],cap:"Stops above equal highs get swept — then price reverses"}],
["h","The sweep"],
["p","A <b>liquidity sweep</b> (or stop hunt) is when price briefly pokes beyond one of these levels — triggering the stops — and then reverses hard. The wick beyond the level is the fingerprint. Full guide: [[sweeps|liquidity sweeps]]."],
["h","How traders use it"],
["ul",["Mark the obvious highs/lows — the more obvious, the more liquidity behind them.","Don't place YOUR stop at the obvious spot; give it room or wait.","After a sweep + a [[choch|change of character]], the reversal setup has a natural stop: beyond the sweep wick.","Targets are usually the liquidity on the opposite side of the range."]],
["warn","Smart money is a model, not a conspiracy. Markets sweep levels because orders cluster there — you don't need a villain for the pattern to be real and tradable."]]});
A({id:"bsl-ssl",cat:"smc",title:"Buy-side vs sell-side liquidity",al:["buy side liquidity","sell side liquidity","bsl","ssl"],lvl:"i",
def:"Buy-side liquidity (BSL) sits above highs: short-sellers' protective buy-stops plus breakout buyers. Sell-side liquidity (SSL) sits below lows: buyers' protective sell-stops plus breakdown sellers. Price is attracted to both.",
b:[["p","The practical read: price runs to these pools the way water runs downhill. In an uptrend, dips into sell-side liquidity below recent lows are often swept and bought ([[sweeps|sweeps]]); the move then targets the buy-side liquidity above the highs. Naming where the liquidity is tells you where price is likely to travel next."]]});
A({id:"sweeps",cat:"smc",title:"Liquidity sweeps (stop hunts)",al:["stop hunt","sweep","liquidity grab","turtle soup"],lvl:"i",
def:"A sweep is a quick raid beyond an obvious high or low that immediately reverses. It looks like a breakout for one candle — then the wick tells the truth. Sweeps happen because that is where the orders are.",
b:[["chart",{c:[[52,60,48,56],[56,64,52,60],[60,68,56,64],[63,72,58,62],[60,74,44,46],[48,52,36,38]],arrows:[[4.5,75,4.5,69,"red"]],texts:[[4.9,78,"sweep wick","red"]],cap:"Price spiked above the highs, grabbed the stops, collapsed"}],
["p","<b>The setup:</b> (1) mark the obvious high/low, (2) wait for price to break it <i>with a wick, not a body</i>, (3) look for a [[choch|CHoCH]] or strong rejection candle, (4) enter on the pullback with a stop beyond the sweep wick, (5) target the liquidity on the other side."],
["tip","The best sweeps happen into higher-timeframe levels or during high-volume [[killzones|session windows]]. A sweep of a nobody-level means nothing."]]});
A({id:"equal-highs",cat:"smc",title:"Equal highs & equal lows",al:["equal highs","equal lows","eqh","eql","double top","double bottom"],lvl:"i",
def:"Two or more highs (or lows) at almost the same level. Classic books call it a double top/bottom; the market sees a neat pool of stops resting just beyond it — a magnet.",
b:[["p","Very often the equal highs get swept first — see [[sweeps|liquidity sweeps]] — before the real move happens. If you trade double tops and bottoms, wait for the sweep instead of placing your stop at the obvious place."]]});
A({id:"fvg",cat:"smc",title:"Fair Value Gaps (FVG)",al:["fvg","fair value gap","imbalance gap","three candle gap","consequent encroachment"],lvl:"i",
def:"A Fair Value Gap is a three-candle imbalance: candle 1's high and candle 3's low don't overlap, leaving an empty space inside the big middle candle. It marks a move so fast that price often returns to fill it.",
b:[["chart",{c:[[36,44,32,40],[42,66,40,64],[62,72,58,70]],zones:[[0,2,44,58,"grn","FVG"]],cap:"The gap between candle 1's high and candle 3's low"}],
["p","<b>Bullish FVG:</b> gap between candle 1's high and candle 3's low in an up-move — price often dips back into it and bounces. <b>Bearish FVG:</b> the mirror image on the way down. The midpoint of the gap is sometimes called <b>consequent encroachment</b> and is often the reaction point."],
["h","How traders use FVGs"],
["ul",["Only FVGs created by real [[displacement|displacement]] (strong impulsive candles) are worth marking.","An FVG + an [[order-blocks|order block]] + a [[premium-discount|discount zone]] = high-quality point of interest.","Enter on the touch or the midpoint; stop beyond the far side of the gap.","FVGs against the higher-timeframe trend tend to get filled and forgotten."]],
["warn","An FVG is not a magic trampoline. It is a zone where price MAY react. Combine it with structure and context or it is just a rectangle."]]});
A({id:"imbalance",cat:"smc",title:"Imbalance",al:["inefficiency","price imbalance"],lvl:"i",
def:"Imbalance means price moved so fast in one direction that the other side never got filled efficiently. Markets tend to revisit imbalanced areas later to complete the auction — the idea behind FVGs.",
b:[["p","In practice: big, one-sided candles leave footprints. When you see a vertical move, expect a future pullback into at least part of it. That pullback is the entry traders are waiting for. See [[fvg|Fair Value Gaps]]."]]});
A({id:"order-blocks",cat:"smc",title:"Order blocks",al:["order block","ob","bullish ob","bearish ob"],lvl:"i",
def:"An order block is the last opposite-colored candle before a strong impulsive move: the last red candle before a rally (bullish OB), or the last green candle before a drop (bearish OB). The theory: big players accumulated there and defend it on the return.",
b:[["chart",{c:[[62,66,54,58],[58,62,50,54],[54,58,46,50],[48,70,46,68],[64,78,62,76],[72,80,68,74]],zones:[[1,2.6,46,58,"grn","BULLISH ORDER BLOCK"]],cap:"Last red candle before the displacement rally — price returned and bounced"}],
["h","What makes an OB high-quality"],
["ul",["The move it launched broke structure ([[bos|BOS]]) with [[displacement|displacement]].","It left an [[fvg|FVG]] right after — showing urgency.","It sits in a [[premium-discount|discount]] (for buys) or premium (for sells) zone.","It is fresh — untested OBs react better than retested ones."]],
["p","Entry styles: at the OB's edge, at its midpoint, or on a lower-timeframe confirmation ([[choch|CHoCH]]) inside it. Stop goes beyond the OB."],
["warn","OBs are subjective — ten traders mark ten different blocks. Use them as zones of interest inside a bigger structure story, never as standalone signals."]]});
A({id:"breaker",cat:"smc",title:"Breaker blocks",al:["breaker","breaker block"],lvl:"a",
def:"A breaker is a failed order block — and the failure is what makes it powerful. When price smashes through an order block breaking structure, that zone flips: on the return it acts in the opposite direction.",
b:[["p","Bull example: price makes a high, pulls back to a bullish order block, the block <b>fails</b> (price smashes through it, breaking structure down). That broken zone flips: when price returns to it from below, it acts as resistance."],
["p","The psychology is clean: everyone who bought at that block is trapped and exits at breakeven on the return, adding pressure. Breakers combine two reliable ideas — [[sr-flip|role flip]] and trapped traders."]]});
A({id:"mitigation",cat:"smc",title:"Mitigation blocks",al:["mitigation block","mitigation"],lvl:"a",
def:"A mitigation block is the gentler cousin of the breaker: a failed order block where price did NOT make a new extreme before failing. The return to the block is used to close losing positions at breakeven — and that closing flow causes the reaction.",
b:[["p","Practically you trade it like a [[breaker|breaker]] with slightly less conviction. These are advanced, discretionary zones — if you are newer, master [[order-blocks|order blocks]] and [[fvg|FVGs]] first."]]});
A({id:"premium-discount",cat:"smc",title:"Premium & discount zones",al:["premium","discount","equilibrium","50% level"],lvl:"i",
def:"Split any swing (low to high) in half. Above 50% is premium — expensive, look to sell. Below 50% is discount — cheap, look to buy. The 50% line is equilibrium.",
b:[["chart",{c:[[46,54,42,50],[50,58,46,52],[48,56,40,42],[44,50,34,36],[38,46,30,32],[34,44,32,42],[40,52,38,50],[48,60,46,58],[56,68,54,66]],zones:[[0,8,55,70,"red","PREMIUM — look to sell"],[0,8,28,43,"grn","DISCOUNT — look to buy"]],lines:[[49,"gold","equilibrium 50%"]],cap:"Measure the whole swing; trade buys only in the lower half"}],
["p","This one filter removes a huge number of bad trades: buying at the top of a range (premium) and selling at the bottom (discount) is donating your [[risk-reward|edge]] to the other side. Big-picture rule: <b>buy in discount during uptrends, sell in premium during downtrends.</b>"]]});
A({id:"bos",cat:"smc",title:"Break of Structure (BOS)",al:["bos","break of structure","structure break"],lvl:"i",
def:"A Break of Structure is when price breaks beyond the last swing point in the direction of the current trend and closes there — the trend announcing it continues.",
b:[["chart",{c:[[30,42,26,38],[34,46,32,44],[40,54,38,52],[46,58,44,48],[50,66,48,64]],lines:[[54,"grn","BOS — old high broken"]],arrows:[[4,50,4,62,"grn"]],cap:"Each BOS confirms the uptrend is alive"}],
["p","Rules that keep it clean: require a <b>body close</b> beyond the level (wicks are [[sweeps|sweeps]], not breaks); use the higher timeframe's structure as the boss; and expect pullbacks after BOS into [[fvg|FVGs]] or [[order-blocks|order blocks]] — that is where entries live. When structure breaks <b>against</b> the trend, that is a [[choch|CHoCH]]."]]});
A({id:"choch",cat:"smc",title:"Change of Character (CHoCH)",al:["choch","change of character","trend change"],lvl:"i",
def:"A Change of Character is the first break of structure against the prevailing trend — for example, an uptrend failing to make a higher high and then breaking its last higher low. It is the earliest objective sign the trend may be flipping.",
b:[["p","The classic reversal recipe: (1) price sweeps [[liquidity|liquidity]] at an extreme, (2) CHoCH on the lower timeframe, (3) pullback into the [[fvg|FVG]] or [[order-blocks|order block]] created by the CHoCH move, (4) entry with a stop beyond the sweep. CHoCH without a sweep before it fails far more often."],
["warn","One CHoCH on the 1-minute chart doesn't kill a daily uptrend. Always ask WHICH timeframe just changed character."]]});
A({id:"inducement",cat:"smc",title:"Inducement",al:["idm","trap","early buyers"],lvl:"a",
def:"Inducement is a minor pullback or small level that tempts early entries before the real point of interest is reached. The market fills impatient traders, breaks them out, then taps the deeper zone and reverses.",
b:[["p","The lesson: if your entry looks obvious and early, ask what you are being induced into. Waiting for the deeper [[order-blocks|order block]] or [[fvg|FVG]] usually buys a better price and a cleaner stop."]]});
A({id:"displacement",cat:"smc",title:"Displacement",al:["impulse","momentum candle","energetic move"],lvl:"i",
def:"Displacement is a sudden, energetic move — big candles, small wicks, speed — that reveals real intent. It usually leaves FVGs behind and breaks structure.",
b:[["p","Use it as a filter: only trust [[order-blocks|order blocks]] and [[breakouts|breakouts]] that were launched by displacement. A slow grind through a level is suspect; three full-bodied candles through it is a statement."]]});
A({id:"killzones",cat:"smc",title:"Killzones & session liquidity",al:["killzone","london open","ny open","session liquidity","opening range"],lvl:"i",
def:"Killzones are the high-volume windows where the real moves of the day tend to happen — roughly the London open and the New York open. Volume and volatility concentrate there because that is when the big desks trade.",
b:[["p","The typical script: the session open <b>sweeps</b> the liquidity resting around the earlier range highs/lows ([[sweeps|sweeps]]), then the true directional move of the day begins. Trading the same setup at dead hours with no volume is why good ideas perform badly at the wrong time. See [[sessions|market sessions]]."]]});

/* ---------- Trading Fundamentals ---------- */
A({id:"how-to-trade",cat:"fund",title:"How to trade: the complete beginner-to-real guide",al:["how to trade","start trading","learn trading","trading guide","beginner guide","como operar","comment trader"],lvl:"b",
def:"Trading means buying and selling financial instruments — stocks, forex, crypto, futures — to profit from price changes. It is a learnable skill, but most people lose because they skip risk management and discipline. This guide is the honest roadmap.",
b:[["h","1. Understand what trading actually is"],
["p","You can profit in both directions: [[long-vs-short|going long]] if you expect price to rise, short if you expect it to fall. Your counterparty is everyone else, and most participants lose. Your edge comes from preparation, not prediction."],
["h","2. Learn the language first"],
["p","Before touching money: [[what-is-candlestick|candlesticks]], [[market-structure|market structure]], [[support-resistance|support & resistance]], [[order-types|order types]], and [[risk-management|risk management]]. Two weeks of focused study here saves months of expensive confusion."],
["h","3. Pick your market and style"],
["p","One market, one style, to start. Compare [[markets|stocks vs forex vs crypto]], and [[trading-styles|scalping vs day vs swing trading]]. Beginners usually do best with swing trading on a liquid market — slower pace, cleaner signals, less screen time."],
["h","4. Demo trade like it's real"],
["p","Open a [[demo|demo account]]. Rules: at least 30 sessions, risk the same percentage you would with real money, and [[journal|journal]] every trade. If you can't be disciplined with fake money, real money will not fix you."],
["h","5. Build a written plan"],
["p","A trade plan answers, in writing: What setup am I allowed to take? Where exactly do I enter? Where is my stop? Where is my target? What is my max risk per trade? See [[trading-plan|building a trading plan]]. An unwritten plan is a wish."],
["h","6. Risk rules before profit goals"],
["p","The math that decides careers: risk [[one-percent|1% or less per trade]], aim for at least [[risk-reward|1:2 risk/reward]], and know the [[drawdown|drawdown math]]. At 1% risk you need to be spectacularly bad to blow up; at 10% risk you need one bad week."],
["h","7. Go live small"],
["p","Fund a small account you can afford to lose entirely. Your goal in month one of live trading is not profit — it is executing your plan perfectly under real emotion ([[trading-psychology|psychology]]). Increase size slowly, only after consistent process."],
["h","8. Review, journal, repeat"],
["p","Weekly review: grade your process, not your P&L. Which setups paid? Which did you force? Trading improves in the review, not in the clicking."],
["h","The realistic timeline"],
["ul",["<b>Months 1–2:</b> education + demo. Goal: fluency.","<b>Months 3–6:</b> demo → small live. Goal: consistency of process.","<b>Months 6–12+:</b> small live. Goal: positive expectancy over hundreds of trades.","Anyone promising weeks instead of months is selling something."]],
["warn","Most traders lose money, mostly from oversized risk and no plan ([[why-traders-lose|why most traders lose]]). The entire edge of this roadmap is that it attacks those two causes first."]]});
A({id:"trading-styles",cat:"fund",title:"Scalping, day trading, swing trading, position trading",al:["scalping","day trading","swing trading","position trading"],lvl:"b",
def:"Styles differ by how long you hold a trade: seconds (scalping), one day (day trading), days to weeks (swing), weeks to months (position). The style changes screen time, stress, costs, and which skills matter.",
b:[["ul",["<b>Scalping</b> — seconds to minutes, dozens of trades/day. Needs speed, low fees, iron discipline. Hardest for beginners.","<b>Day trading</b> — opened and closed the same day. A few focused hours, no overnight risk.","<b>Swing trading</b> — days to weeks. Best fit for most learners: real signals, manageable screen time.","<b>Position trading</b> — weeks to months, closer to investing."]],
["tip","Choose by your life, not your ambition: job + family → swing. Full-time screens → day. Impatient and undercapitalized does not automatically mean scalping — scalping is where impatience gets taxed the most."]]});
A({id:"long-vs-short",cat:"fund",title:"Long vs short explained",al:["long","short","shorting","buy","sell"],lvl:"b",
def:"Going long = buying first, selling later: you profit if price rises. Going short = selling first (borrowed from the broker), buying back later: you profit if price falls. Shorting is what makes markets two-way.",
b:[["p","Asymmetry to respect: a long position can lose 100% but gain unlimited; a short can gain up to 100% but lose unlimited if price rips higher. Shorts get squeezed violently — see [[stop-losses|stop losses]] and [[leverage-margin|leverage]]."]]});
A({id:"order-types",cat:"fund",title:"Market, limit & stop orders",al:["market order","limit order","stop order","stop limit"],lvl:"b",
def:"Market order: execute NOW at whatever price is available. Limit order: execute only at your price or better. Stop order: becomes a market order when price reaches your trigger — used for stop losses and breakout entries.",
b:[["p","Practical default: limits to enter (you choose your price), stops to protect (the market chooses urgency when you are wrong). See [[market-vs-limit-exec|how orders actually execute]] and [[slippage|slippage]]."]]});
A({id:"bid-ask-spread",cat:"fund",title:"Bid, ask & spread",al:["bid","ask","spread","bid ask"],lvl:"b",
def:"The bid is what buyers will pay; the ask is what sellers demand; the spread is the gap between them — your cost of crossing from one side to the other. Every round-trip trade starts one spread in the hole.",
b:[["p","Liquid instruments (major forex pairs, big stocks, BTC) have tiny spreads; illiquid ones charge you heavily. Spreads widen at news and at the daily close. Related: [[slippage|slippage]], [[fees|fees]]."]]});
A({id:"leverage-margin",cat:"fund",title:"Leverage & margin (and liquidation)",al:["leverage","margin","margin call","liquidation","100x"],lvl:"b",
def:"Leverage lets you control a big position with a small deposit (margin). It multiplies gains AND losses identically — it is a risk amplifier, not a profit tool.",
b:[["p","Two ugly mechanics: a <b>margin call</b> demands more funds when your position weakens; <b>liquidation</b> is the exchange force-closing you when margin runs out — common in crypto at high leverage."],
["warn","High leverage is the fastest way to convert a good analysis into a loss: at 50×, a routine 2% wiggle liquidates you. New traders: little or no leverage until consistently profitable."]]});
A({id:"pips-points-ticks",cat:"fund",title:"Pips, points & ticks",al:["pip","point","tick","pipette"],lvl:"b",
def:"Different markets measure moves differently: forex uses pips (0.0001 on most pairs), stocks and indexes move in points, futures move in ticks. The skill is converting the move into money using your position size.",
b:[["p","Whatever the unit, the only number that matters is the money risked if your stop is hit — that is [[position-sizing|position sizing]]."]]});
A({id:"lots",cat:"fund",title:"Lots & position size units",al:["lot size","micro lot","mini lot","contract size"],lvl:"b",
def:"In forex a standard lot = 100,000 units of currency; a mini lot = 10,000; a micro lot = 1,000 (about $0.10 per pip on USD pairs). Futures use contracts with defined values per point.",
b:[["p","Whatever the unit, convert everything into one language: money at risk if the stop is hit. See [[position-sizing|position sizing]]."]]});
A({id:"sessions",cat:"fund",title:"Market sessions: Asia, London, New York",al:["sessions","asia session","london session","new york session","overlap"],lvl:"b",
def:"The 24-hour market has personalities by hour: Asia is quiet and range-building, London brings volume and breaks, New York brings peak news and US flows. The London–NY overlap is the highest-volume window of the day.",
b:[["p","Why it matters: setups that work at the open fail in the dead hours, and the day's extremes often form in the first hours of London or NY. SMC traders formalize this as [[killzones|killzones]]. Crypto trades 24/7 but still follows these volume rhythms."]]});
A({id:"markets",cat:"fund",title:"Stocks vs forex vs crypto vs futures",al:["which market","forex or crypto","market choice"],lvl:"b",
def:"Four main arenas: stocks (regulated, company-driven), forex (24/5, ultra-liquid majors), crypto (24/7, most volatile), futures (centralized, transparent volume). Pick ONE to learn on — skill transfers, context doesn't.",
b:[["ul",["<b>Stocks</b> — gaps overnight, huge selection, great for learning structure and news reactions.","<b>Forex</b> — small moves amplified by [[leverage-margin|leverage]], macro-sensitive.","<b>Crypto</b> — gaps rare, wicks savage; ideal lab for [[liquidity|liquidity]] concepts.","<b>Futures</b> — real volume data, leveraged, fixed expiry."]],
["tip","Mastering BTC's personality while trading gold because a friend does is two learning curves at once. Choose one."]]});
A({id:"broker",cat:"fund",title:"Choosing a broker safely",al:["broker","regulation","platform"],lvl:"b",
def:"Your broker holds your money, so regulation is the feature: licensed authority, segregated client funds, transparent fees, reliable execution, and a proven withdrawal process.",
b:[["warn","Red flags: bonuses tied to volume requirements, guaranteed returns, pressure to deposit more, unregulated offshore entities. The best trade you will ever make is avoiding a bad broker."]]});
A({id:"demo",cat:"fund",title:"Demo trading: your first 30 days",al:["demo account","paper trading","practice account"],lvl:"b",
def:"A demo account trades real charts with fake money. Its only job: let you build process before pressure. Treat every demo trade as if it were real money.",
b:[["p","The known flaw: demo hides emotions. That is why graduation criteria should be process-based (30 sessions, 90% plan-adherence) rather than profit-based. Then go live small — see [[how-to-trade|the roadmap]]."]]});
A({id:"trading-plan",cat:"fund",title:"Building a trading plan",al:["trading plan","strategy","playbook","setup"],lvl:"i",
def:"A trading plan turns I think it goes up into an executable system: setup, entry trigger, stop, target, risk, and journal rules — all decided in writing, before emotions get a vote.",
b:[["ul",["<b>Markets & hours</b> — what you trade and when.","<b>Setup definition</b> — the exact, repeatable pattern (e.g. sweep + [[choch|CHoCH]] + [[fvg|FVG]] entry).","<b>Entry trigger</b> — the precise candle/level that fires the trade.","<b>Stop loss</b> — where you are proven wrong ([[stop-losses|stops]]).","<b>Target</b> — where you take profit, and your minimum [[risk-reward|R:R]].","<b>Risk</b> — % per trade and max daily loss ([[one-percent|1% rule]]).","<b>Journal rules</b> — what you record and when you review ([[journal|journal]])."]],
["p","Then the meta-rules: no setup = no trade; max X trades per day; stop after N consecutive losses; weekly review day."],
["tip","Test the plan before trusting it: [[backtesting|backtest]] 50–100 historical occurrences of your setup. You are not predicting the future; you are measuring your [[edge|edge]]."]]});
A({id:"journal",cat:"fund",title:"The trading journal",al:["journal","review","track trades"],lvl:"b",
def:"The journal is the only tool that converts experience into improvement. Minimum per trade: date, instrument, direction, setup name, entry/stop/target, size, result, screenshot, emotional state.",
b:[["p","The weekly review is where the money is: filter your journal by setup and you will discover that most of your losses usually come from one or two behaviors (chasing, revenge trades, oversized size). Fix the leak, keep the rest. See [[trading-psychology|psychology]] — the journal is its measurement device."]]});
A({id:"what-moves-price",cat:"fund",title:"What actually moves price",al:["price discovery","why price moves","order flow"],lvl:"b",
def:"Strip away every indicator and price moves for one reason: aggressive orders consuming resting orders. More urgent buying than selling at a level pushes price up; the reverse pushes it down. Everything else works BY creating those orders.",
b:[["p","This is why [[liquidity|liquidity]] matters (resting orders cluster at obvious levels), why [[volume|volume]] confirms moves (participation), and why [[news|news]] causes spikes (it changes many people's urgency at once). The [[order-book|order book]] is the microscope for this."]]});
A({id:"backtesting",cat:"fund",title:"Backtesting",al:["backtest","historical testing"],lvl:"i",
def:"Backtesting = replaying history against your rules: for each time your setup appeared, what would have happened with your exact entry, stop and target? From 50–100 samples you get your real win rate, average R, and worst streak.",
b:[["p","Honesty rules: test in order (no cherry-picking), include every rule (no this one obviously doesn't count), and account for [[fees|fees]] and [[slippage|slippage]]. Then [[expectancy|expectancy]] tells you the truth."]]});
A({id:"edge",cat:"fund",title:"What is an edge?",al:["trading edge","statistical edge","positive expectancy"],lvl:"i",
def:"An edge is any repeatable condition that makes one outcome more likely than the market's price implies — measured over many trades, never one. A 55% win rate at 1:2 risk/reward is an edge. A lucky winning trade is not.",
b:[["p","Edges decay and get crowded. That is why professionals talk about process: you cannot control any single outcome, only whether your bets have positive [[expectancy|expectancy]] and whether you can afford the losing streaks ([[risk-of-ruin|risk of ruin]])."]]});
A({id:"expectancy",cat:"fund",title:"Expectancy: the number that decides everything",al:["expected value","ev","expectancy formula"],lvl:"i",
def:"Expectancy = (win rate × average win) − (loss rate × average loss), expressed in R. Example: 40% wins averaging +2R, 60% losses averaging −1R → expectancy = 0.4×2 − 0.6×1 = +0.2R per trade. A system that loses more often than it wins, yet prints money.",
b:[["p","This is the unlock behind [[winrate|win rate vs R:R]]: most beginners optimize the wrong column. Compute your expectancy from your [[journal|journal]] every month — it is the only honest scoreboard."]]});
A({id:"winrate",cat:"fund",title:"Win rate vs risk/reward",al:["win rate","strike rate","hit rate"],lvl:"b",
def:"Win rate alone means nothing. A 90% win-rate system that wins $1 and loses $10 is a disaster; a 35% win-rate system that wins 3× its losses is a business. The pairing that matters is expectancy.",
b:[["p","Rule of thumb table: at 1:1 R:R you need >50% wins; at 1:2 you need >33%; at 1:3 you need >25%. Pick the pairing your psychology can survive — low win rates hurt feelings even when they pay. See [[expectancy|expectancy]]."]]});
A({id:"breakeven",cat:"fund",title:"Moving stop to breakeven",al:["be","breakeven stop"],lvl:"i",
def:"Moving your stop to entry once price moves in your favor removes risk from the trade — but moving too early gets you stopped out of winners constantly, because normal pullbacks touch entry all the time.",
b:[["p","Defensible rules: move to breakeven only after price has taken a meaningful step (e.g. 1R in your favor, or a [[bos|structure break]]), or at a planned partial take-profit. Whatever the rule, write it in the [[trading-plan|plan]] — breakeven decisions made by fear leak money."]]});
A({id:"scaling",cat:"fund",title:"Scaling in & out",al:["scale out","partial take profit","pyramiding"],lvl:"i",
def:"Scaling out = taking profit in pieces (half at 1.5R, stop to breakeven, let the rest run). Scaling in = building a position in planned layers with a total-risk cap. Averaging down without a plan is just slow self-sabotage.",
b:[["p","Scaling out smooths the equity curve and finances patience. Whatever you choose, pre-plan it in the [[trading-plan|plan]] — improvised exits are emotional exits."]]});
A({id:"round-numbers",cat:"fund",title:"Round numbers & psychological levels",al:["psychological levels","00 levels","whole numbers"],lvl:"b",
def:"Humans place orders at memorable prices: 100, 1.1000, 50,000. So round numbers genuinely accumulate orders — reactions, sweeps and extra chop happen there. Don't put your own stops exactly on them.",
b:[["p","The obvious spot is the hunted spot — see [[liquidity|liquidity]] and [[sweeps|sweeps]] for why."]]});
A({id:"pullbacks",cat:"fund",title:"Pullbacks & retracements",al:["pullback","retracement","dip"],lvl:"b",
def:"A pullback is a temporary move against the trend — the market breathing. In an uptrend, pullbacks toward support, FVGs or moving averages are where trend traders enter at a discount instead of chasing the highs.",
b:[["p","The practical question is never will it pull back but where would I want to own it? — see [[premium-discount|premium & discount]] and [[retest|retests]]."]]});

/* ---------- Risk Management ---------- */
A({id:"risk-management",cat:"risk",title:"Risk management: the only thing you control",al:["risk management","risk","capital protection"],lvl:"b",
def:"You cannot control whether a trade wins. You can control four things: which trades you take, how much you risk, where you exit when wrong, and when you stop for the day. That is the entire discipline of risk management.",
b:[["h","The three rules that do 90% of the work"],
["ul",["<b>Risk a fixed small % per trade</b> — 1% is the standard ([[one-percent|the 1% rule]]).","<b>Always know your exit before entry</b> — the stop is decided while you are calm ([[stop-losses|stop losses]]).","<b>Cap daily/weekly loss</b> — e.g. stop at −3% for the day; the market will be there tomorrow."]],
["h","The math that makes it work"],
["p","Risk is multiplied by [[risk-reward|reward]]: at 1% risk and 1:2 R:R, a winner returns 2%. Lose four in a row (−4%) and one winner claws back half. At 10% risk the same streak is −40% — now look at the [[drawdown|recovery math]]."],
["chart",{c:[[100,104,96,99],[99,101,94,95],[95,99,90,93],[93,97,88,91],[91,95,84,87],[87,93,82,90],[90,96,86,94],[94,102,92,100],[100,110,98,108]],cap:"Small losses, patient gains: what survivable variance looks like"}],
["h","Position sizing is the bridge"],
["p","Risk % becomes real money through [[position-sizing|position sizing]]: size = (account × risk%) ÷ stop distance. This one formula is what makes a stop loss actually mean something."],
["warn","Every blown account has the same autopsy: oversized positions + moving stops + [[revenge-trading|revenge trading]]. None of the three is a knowledge problem. All three are discipline problems — which is why they are rules, not suggestions."]]});
A({id:"one-percent",cat:"risk",title:"The 1% rule",al:["1% rule","risk per trade","risk percent"],lvl:"b",
def:"Never risk more than 1% of your account on a single trade. Risk means the money lost if the stop is hit — not the position size. At 1%, even a brutal losing streak barely dents the account.",
b:[["p","Conservative funds run 0.25–0.5%. Aggressive educators run 2%. Above that you are not trading a system, you are betting a streak — see [[risk-of-ruin|risk of ruin]]. If 1% feels too small to matter, your account is too small for your patience — and that tension is exactly what blows accounts."]]});
A({id:"position-sizing",cat:"risk",title:"Position sizing: the formula",al:["position size","sizing","how much to buy"],lvl:"b",
def:"The most important formula in trading: Size = (Account × Risk%) ÷ Stop distance. The stop distance sets the size — never the other way around.",
b:[["p","Example (stocks): €10,000 account, 1% risk = €100. Entry €50, stop €48 → risk per share = €2. Shares = €100 ÷ €2 = <b>50 shares</b>. Tight stop → bigger size; wide stop → smaller size; same €100 at risk."],
["tip","Size from the stop, not from conviction. I am very sure is not a variable in the formula — feelings change, math doesn't."]]});
A({id:"risk-reward",cat:"risk",title:"Risk/reward ratio (R:R)",al:["r multiple","rr","risk reward"],lvl:"b",
def:"Risk/reward compares what you risk to what you target, in R units. Risk €100 to make €200 = 1:2. R is the universal currency of trading: wins and losses become comparable across instruments and months.",
b:[["p","The pairing table: 1:1 needs >50% [[winrate|win rate]]; 1:2 needs >33%; 1:3 needs >25%. Most systematic traders refuse entries below ~1:2 — not because every trade reaches target, but because the ratio survives real-world degradation (early exits, [[slippage|slippage]], [[fees|fees]])."]]});
A({id:"stop-losses",cat:"risk",title:"Stop losses: types & placement",al:["stop loss","stop","hard stop","mental stop"],lvl:"b",
def:"A stop loss is your pre-decided exit when you are wrong. It must exist before entry, it must be a real order in the market, and it belongs where your idea is invalidated — not at a round amount of money.",
b:[["ul",["<b>Structure stops</b> — beyond the swing or [[order-blocks|order block]] that anchors the trade.","<b>ATR stops</b> — distance = k × [[atr|ATR]], adapting to volatility.","<b>Time stops</b> — exit if nothing happens in N candles; dead trades cost attention.","<b>Trailing stops</b> — follow structure ([[breakeven|breakeven]] and beyond) once in profit."]],
["warn","Moving a stop further away to give it room is the single most expensive sentence in trading. If the stop is too close, the answer is smaller size — not a wider stop."]]});
A({id:"take-profit",cat:"risk",title:"Take profit strategies",al:["take profit","tp","target","exit strategy"],lvl:"b",
def:"Three honest exit styles: fixed target at a planned level; scaled exits (part early, trail the rest); or trailing structure (exit only when structure breaks against you). Whatever you choose, write it in the plan.",
b:[["p","Targets should sit <b>before</b> the level everyone else is targeting, not exactly on it — front-run the obvious exit. Exit decisions made mid-trade are emotional decisions. See [[scaling|scaling out]] and [[risk-reward|R:R]]."]]});
A({id:"drawdown",cat:"risk",title:"Drawdown: the math of recovery",al:["drawdown","recovery","losing streak"],lvl:"b",
