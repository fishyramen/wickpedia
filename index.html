{n:"Bearish Harami Cross",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"o",vn:"forex",rel:60,chart:[[34,68,32,64],[53,61,46,53.4]],d:"A doji nested inside the previous large green body.",p:"The rally has gone quiet in the worst possible place — inside the last bull candle.",t:"Watch the doji's high; a break below the mother's midpoint confirms the turn."},
{n:"Piercing Line",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"b",fq:"c",vn:"any",rel:76,chart:[[64,68,38,42],[32,64,30,60]],d:"A green candle opens below the prior low, then closes above the red body's midpoint.",p:"Gap-down despair gets bought instantly — buyers reclaim more than half the damage.",t:"The deeper the close into day one, the stronger. Midpoint penetration is the minimum."},
{n:"Dark Cloud Cover",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"c",vn:"any",rel:76,chart:[[36,62,34,58],[64,66,38,40]],d:"A red candle opens above the prior high, then closes deep inside the green body.",p:"A bull trap at the open followed by heavy, deliberate distribution.",t:"Must finish below the midpoint — the deeper the cut, the heavier the warning."},
{n:"Tweezer Tops",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"o",vn:"any",rel:64,chart:[[44,70,42,66],[66,70,46,48]],d:"Two candles — green then red — sharing virtually the same high.",p:"Price tested the same ceiling twice and was rejected twice. Resistance confirmed.",t:"That shared high becomes the line in the sand; stop goes just above the tweezers."},
{n:"Tweezer Bottoms",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"b",fq:"o",vn:"any",rel:64,chart:[[56,58,30,34],[34,54,30,52]],d:"Two candles — red then green — bottoming at virtually the same low.",p:"Sellers swung at the same floor twice and moved it nowhere.",t:"The shared low is the level to defend; a hold here often starts the bounce."},
{n:"Matching Lows",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"r",vn:"any",rel:55,chart:[[62,66,42,46],[52,54,42,46]],d:"Two red candles closing at exactly the same level, the second opening inside the first.",p:"A door that keeps slamming shut at the same price — every bounce sold at parity.",t:"Usually continuation: expect the downtrend to resume, not reverse."},
{n:"Counterattack (Bullish)",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"r",vn:"any",rel:62,chart:[[64,68,46,50],[38,58,36,50]],d:"A green candle gaps below the prior low, then rallies to close level with day one.",p:"The breakdown low is rejected instantly — the sellers' final push fails.",t:"Equal closes mark the battleground; the next candle decides the trend."},
{n:"Counterattack (Bearish)",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"r",vn:"any",rel:62,chart:[[36,56,34,50],[58,64,48,50]],d:"A red candle gaps above the prior high, then falls to close level with day one.",p:"The breakout high is sold instantly — bulls' final push fails at the same price.",t:"The shared close is the line both sides fight over."},
{n:"Meeting Lines (Bullish)",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"r",vn:"any",rel:58,chart:[[66,68,50,54],[44,60,42,54]],d:"A red candle and a green candle that close at precisely the same price.",p:"A dead-even standoff at one level — the downtrend's momentum has run out of edge.",t:"Rare; treat it as a pause signal until the next candle breaks the tie."},
{n:"Meeting Lines (Bearish)",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"r",vn:"any",rel:58,chart:[[34,50,32,46],[52,58,44,46]],d:"A green candle, then a red one that opens higher and closes at exactly the same price.",p:"The rally reaches for more and lands exactly where it started — buyers spent.",t:"The shared close becomes short-term resistance."},
{n:"In-Neck",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"any",rel:45,chart:[[64,68,44,48],[40,56,38,51]],d:"A green candle opens below the prior low and barely nicks into the red body.",p:"The bounce is a reflex, not a reversal — buyers can't even reach the midpoint.",t:"A continuation pattern in disguise; rallies like this tend to get sold."},
{n:"On-Neck",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"any",rel:43,chart:[[64,68,44,48],[38,54,36,48]],d:"Opens below the prior low and closes exactly at the red candle's close.",p:"Even weaker than in-neck — the counter-rally dies at precisely the old level.",t:"Marks the maximum the bounce could achieve; the downtrend usually continues."},
{n:"Thrusting Line",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"any",rel:48,chart:[[64,68,42,46],[36,58,34,52]],d:"A green candle closing into the lower half — but only the lower half — of the red body.",p:"Some buying interest appears, yet not nearly enough to change the regime.",t:"The weakest of the neck family; the decline usually resumes."},
{n:"Homing Pigeon",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"r",vn:"any",rel:60,chart:[[68,72,36,40],[58,62,54,56]],d:"A small red candle nesting entirely inside the body of the previous big red candle.",p:"Selling pressure is visibly shrinking — bears running out of ammunition.",t:"A subtle bottoming clue; confirm with a break above the large candle's open."},
{n:"Bullish Kicking",type:"bull",nc:2,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"o",vn:"stocks",rel:84,chart:[[56,60,38,42],[50,78,48,76]],d:"A red marubozu followed by a green marubozu gapping fully above it.",p:"Sentiment flips 180 degrees overnight — a gap, and no look back.",t:"Among the strongest two-candle reversals; the gap itself becomes support."},
{n:"Bearish Kicking",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"o",vn:"stocks",rel:84,chart:[[40,58,40,58],[30,32,10,12]],d:"A green marubozu followed by a red marubozu gapping fully below it.",p:"A total overnight change of heart, toward the exits.",t:"The gap is the ceiling now — rallies back into it tend to fail."},
{n:"Last Engulfing Bottom",type:"bull",nc:2,cat:"Reversal",trend:"After a long downtrend",lvl:"a",fq:"r",vn:"any",rel:78,chart:[[70,72,56,58],[54,56,42,44],[38,64,36,62]],d:"After a long decline, a small red candle is engulfed by a large green one.",p:"The last engulf before the turn — the bears' final candle gets swallowed whole.",t:"Requires a genuine downtrend before it; at real support it's elite."},
{n:"Last Engulfing Top",type:"bear",nc:2,cat:"Reversal",trend:"After a long uptrend",lvl:"a",fq:"r",vn:"any",rel:78,chart:[[28,42,26,40],[44,46,54,56],[60,62,34,36]],d:"After a long advance, a small green candle is engulfed by a large red one.",p:"The final bull candle of the uptrend, swallowed in a single session.",t:"Best at extended, exhausted highs."},
{n:"Separating Lines (Bullish)",type:"bull",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"r",vn:"any",rel:62,chart:[[62,66,46,50],[62,78,60,76]],d:"A green candle opens at exactly the prior red candle's open, then rallies away.",p:"Same starting price, completely different finish — momentum flips on its own turf.",t:"The shared open becomes support."},
{n:"Separating Lines (Bearish)",type:"bear",nc:2,cat:"Continuation",trend:"In an uptrend",lvl:"i",fq:"r",vn:"any",rel:62,chart:[[38,54,36,52],[38,40,22,24]],d:"A red candle opens at exactly the prior green candle's open, then sells off.",p:"The bulls' own starting price is used against them.",t:"The shared open caps rallies."},
{n:"Descending Hawk",type:"bear",nc:2,cat:"Reversal",trend:"After an uptrend",lvl:"a",fq:"r",vn:"any",rel:56,chart:[[38,64,36,62],[48,58,46,52]],d:"Two green candles, the second smaller, opening inside the first's body.",p:"Strength quietly decaying — even the green candles are shrinking.",t:"Bearish despite both candles being green; that's precisely the trap it describes."},
{n:"Long Black Gapping Candle",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"stocks",rel:68,chart:[[48,58,44,52],[40,42,14,16]],d:"A tall red candle gapping below the previous candle's low.",p:"The gap shows urgency; the tall body shows follow-through.",t:"A downtrend accelerator — the gap becomes resistance on any bounce."},
{n:"Rising Window",jp:"窓 · mado",type:"bull",nc:2,cat:"Continuation",trend:"In an uptrend",lvl:"b",fq:"c",vn:"stocks",rel:70,chart:[[34,52,32,50],[56,74,54,72]],d:"Two bullish candles separated by a gap — the Japanese window.",p:"Windows act as support: pullbacks into the gap tend to attract buyers.",t:"A window that gets fully closed loses its power; holds keep the trend alive."},
{n:"Falling Window",jp:"窓 · mado",type:"bear",nc:2,cat:"Continuation",trend:"In a downtrend",lvl:"b",fq:"c",vn:"stocks",rel:70,chart:[[66,68,48,50],[44,46,26,28]],d:"Two bearish candles separated by a gap.",p:"The window acts as resistance — bounces into the gap tend to get sold.",t:"An unfilled window keeps pressure on."},
{n:"Morning Star",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"b",fq:"c",vn:"any",rel:88,chart:[[70,74,48,52],[42,48,40,44],[34,68,32,64]],d:"A long red candle, a small-bodied star gapping lower, then a strong green thrust.",p:"A three-act turnaround: panic, indecision, then conviction arriving in force.",t:"The textbook bottom. The deeper day three closes into day one, the better."},
{n:"Evening Star",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"c",vn:"any",rel:88,chart:[[26,52,24,48],[54,60,52,56],[54,56,30,34]],d:"A long green candle, a star gapping higher, then a red candle cutting into day one.",p:"Euphoria, hesitation, distribution — the classic top told in three sessions.",t:"Day three must reach below the first body's midpoint to complete the pattern."},
{n:"Morning Doji Star",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"o",vn:"any",rel:89,chart:[[70,74,48,52],[40,45,38,41],[34,66,32,62]],d:"A morning star whose middle candle is a doji — indecision made visible.",p:"The doji middle means the pause was a genuine dead stop, not a slow drift.",t:"Considered the stronger variant of the morning star when all gaps hold."},
{n:"Evening Doji Star",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"o",vn:"any",rel:89,chart:[[26,50,24,46],[53,58,50,54],[52,54,28,32]],d:"An evening star whose middle candle is a doji gapped above the first body.",p:"The rally doesn't just slow — it freezes in mid-air before falling.",t:"The heavier variant of the evening star; the doji gap is the fingerprint."},
{n:"Three White Soldiers",jp:"赤三兵 · akasanbei",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend or base",lvl:"b",fq:"c",vn:"any",rel:85,chart:[[28,50,26,48],[40,62,38,60],[52,74,50,72]],d:"Three advancing green candles, each opening inside the prior body and closing near its high.",p:"Steady, methodical accumulation — the trend changing hands brick by brick.",t:"Best when bodies hold their size; lengthening wicks degrade it toward an advance block."},
{n:"Three Black Crows",jp:"三羽烏 · sanbon-garasu",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"c",vn:"any",rel:85,chart:[[72,74,52,54],[60,62,40,42],[48,50,28,30]],d:"Three descending red candles, each opening inside the prior body and closing near its low.",p:"Coordinated, unhurried selling — the uptrend being dismantled piece by piece.",t:"Strongest near extended highs; watch the third candle's low as resistance."},
{n:"Advance Block",type:"bear",nc:3,cat:"Reversal",trend:"Late in an uptrend",lvl:"i",fq:"o",vn:"any",rel:60,chart:[[32,54,30,52],[46,66,44,56],[52,78,50,60]],d:"Three rising green candles with shrinking bodies and lengthening upper shadows.",p:"Each advance is being sold harder than the last — momentum choking on supply.",t:"An early fatigue warning; don't wait for a full reversal to start trimming."},
{n:"Stalled Pattern",type:"bear",nc:3,cat:"Reversal",trend:"Late in an uptrend",lvl:"i",fq:"o",vn:"any",rel:52,chart:[[32,56,30,54],[50,60,48,56],[55,62,53,57]],d:"Three advancing candles whose bodies shrink sharply with each step.",p:"Every step up costs more and gains less — the advance is stalling out.",t:"A softer cousin of the advance block; tighten stops, don't panic sell."},
{n:"Deliberation",type:"bear",nc:3,cat:"Reversal",trend:"Late in an uptrend",lvl:"i",fq:"o",vn:"any",rel:56,chart:[[32,56,30,54],[48,70,46,68],[66,76,62,66]],d:"Two strong green candles, then a small hesitant third — often with a long upper wick.",p:"The rally pauses to deliberate, and deliberations at highs usually end badly.",t:"Reduce exposure or tighten stops; the pattern rarely resolves upward."},
{n:"Three Inside Up",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"b",fq:"o",vn:"any",rel:80,chart:[[64,68,38,42],[46,52,44,50],[48,68,46,66]],d:"A bullish harami followed by a green candle closing above the first candle's open.",p:"The quiet harami gets its confirmation in a single decisive stroke.",t:"A complete, self-confirming pattern — no extra candle needed."},
{n:"Three Inside Down",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"o",vn:"any",rel:80,chart:[[34,64,32,60],[52,56,44,46],[50,52,30,32]],d:"A bearish harami followed by a red candle closing below the first candle's open.",p:"The stalled rally resolves downward — hesitation turns into commitment.",t:"Anchor stops above the first candle's high."},
{n:"Three Outside Up",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"b",fq:"o",vn:"any",rel:82,chart:[[56,60,44,46],[38,66,36,64],[62,80,60,78]],d:"A bullish engulfing followed by a third green candle pressing to a fresh close.",p:"Reversal with proof attached — day three shows the new buyers aren't leaving.",t:"One of the most dependable bullish trios."},
{n:"Three Outside Down",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"b",fq:"o",vn:"any",rel:82,chart:[[44,58,42,56],[60,62,34,36],[38,40,20,22]],d:"A bearish engulfing followed by a third red candle pressing to a fresh close.",p:"The engulf wasn't a one-day accident — sellers keep coming on day three.",t:"The engulfing high is the invalidation line."},
{n:"Abandoned Baby (Bullish)",jp:"捨て子 · sutego",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"a",fq:"r",vn:"stocks",rel:86,chart:[[72,76,52,56],[41,46,38,42],[50,70,48,66]],d:"Red candle, a doji gapped entirely below it, then a green candle gapped above the doji.",p:"Two gaps in opposite directions — sentiment snapping like a rubber band.",t:"Rare and powerful. The gap zone is often respected for weeks."},
{n:"Abandoned Baby (Bearish)",jp:"捨て子 · sutego",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"a",fq:"r",vn:"stocks",rel:86,chart:[[24,48,22,44],[54,62,50,55],[48,50,28,32]],d:"Green candle, a doji gapped entirely above it, then a red candle gapped below the doji.",p:"The top forms an island, then the bridge burns.",t:"The abandoned doji becomes the key resistance zone."},
{n:"Tri-Star (Bottom)",type:"bull",nc:3,cat:"Reversal",trend:"After a long downtrend",lvl:"a",fq:"r",vn:"any",rel:82,chart:[[56,66,46,56],[33,38,30,35],[50,58,46,53]],d:"Three consecutive dojis at the bottom, the middle one gapping lowest of all.",p:"Pure, concentrated indecision at the lows.",t:"Extremely rare; historically one of the most reliable reversal footprints."},
{n:"Tri-Star (Top)",type:"bear",nc:3,cat:"Reversal",trend:"After a long uptrend",lvl:"a",fq:"r",vn:"any",rel:82,chart:[[44,52,36,45],[62,68,58,63],[48,56,42,49]],d:"Three consecutive dojis at the top, the middle one gapping highest of all.",p:"Indecision at the summit — three sessions nobody dared to finish.",t:"The elevated doji marks the ceiling."},
{n:"Stick Sandwich",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"r",vn:"any",rel:65,chart:[[64,68,50,52],[46,60,44,58],[60,64,50,52]],d:"Two red candles sandwiching a green one, both reds closing at the same price.",p:"Sellers shove twice and land on the exact same floor — a base is being poured.",t:"A break above the middle candle confirms the base."},
{n:"Unique Three River Bottom",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"a",fq:"r",vn:"any",rel:60,chart:[[72,76,44,48],[50,54,28,32],[28,40,26,38]],d:"A long red candle, a hammer-like candle making a new low, then a small green inside the range.",p:"The deep wick absorbs the last sellers; the little green is the first sprout.",t:"Slow-motion bottoming — wait for a break above the first candle."},
{n:"Identical Three Crows",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"a",fq:"r",vn:"any",rel:58,chart:[[68,72,52,56],[60,62,52,56],[57,60,52,56]],d:"Three red candles closing at identical levels, each opening inside the previous body.",p:"Every intraday bounce is sold to the same close — methodical distribution.",t:"Treat it as distribution until disproven."},
{n:"Upside Gap Two Crows",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"a",fq:"r",vn:"stocks",rel:55,chart:[[28,56,26,54],[60,66,58,62],[67,69,54,56]],d:"A green advance, then two red candles gapped above it — the second engulfing the first.",p:"Strength being sold from above; the gap up is turning into a trap.",t:"Bears win if the gap to day one fills."},
{n:"Two Crows Gapping",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"a",fq:"r",vn:"stocks",rel:52,chart:[[30,52,28,50],[58,62,54,56],[57,59,50,52]],d:"Two consecutive red candles gapping above the prior uptrend close.",p:"New highs are being immediately unloaded — distribution at altitude.",t:"Needs a close back below the pre-gap close to confirm."},
{n:"Upside Tasuki Gap",jp:"襷掛け · tasuki-gake",type:"bull",nc:3,cat:"Continuation",trend:"In an uptrend",lvl:"i",fq:"o",vn:"stocks",rel:68,chart:[[34,54,32,52],[58,70,56,68],[66,70,50,54]],d:"Two greens separated by a gap, then a red candle pulling back into the gap without closing it.",p:"The pullback dips into the gap — and the gap catches it like a net.",t:"Continuation stands as long as the gap doesn't fully fill."},
{n:"Downside Tasuki Gap",jp:"襷掛け · tasuki-gape",type:"bear",nc:3,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"stocks",rel:68,chart:[[68,70,48,50],[44,46,32,34],[36,46,34,42]],d:"Two reds separated by a gap, then a green bounce into the gap that can't close it.",p:"The relief rally runs straight into the gap ceiling and stops dead.",t:"The unfilled gap keeps pressure on."},
{n:"Three Stars in the South",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"a",fq:"r",vn:"any",rel:56,chart:[[74,76,30,38],[46,50,32,38],[40,44,38,42]],d:"Long red with a deep lower shadow, a hammer-like red making a higher low, a small white inside.",p:"The sellers' reach keeps shrinking; the small white is the first sprout.",t:"Deep-lore bottoming pattern; wait for a close above the small white's high."},
{n:"Upside-Gap Side-by-Side White Lines",type:"bull",nc:3,cat:"Continuation",trend:"In an uptrend",lvl:"a",fq:"r",vn:"stocks",rel:66,chart:[[30,52,28,50],[56,72,54,70],[56,74,54,72]],d:"An uptrend candle, then two similar-sized whites gapped up, trading side by side.",p:"Consolidation above the gap — strength being held, not sold.",t:"Bullish as long as the gap holds."},
{n:"Downside-Gap Side-by-Side White Lines",type:"bear",nc:3,cat:"Continuation",trend:"In a downtrend",lvl:"a",fq:"r",vn:"stocks",rel:60,chart:[[70,74,52,54],[30,46,28,44],[30,48,28,46]],d:"A downtrend candle, then two whites gapped down, sitting side by side.",p:"Even the green candles are stranded below the gap — bounces stay capped.",t:"Counterintuitively bearish; failure to close the gap keeps the downtrend alive."},
{n:"Top Island Reversal",type:"bear",nc:3,cat:"Reversal",trend:"After an uptrend",lvl:"i",fq:"r",vn:"stocks",rel:80,chart:[[30,48,28,46],[54,62,52,60],[48,50,26,28]],d:"A cluster of candles trapped between an exhaustion gap up and a breakout gap down.",p:"Buyers stranded on the island; both gaps become resistance overhead.",t:"The longer the island, the heavier the top."},
{n:"Bottom Island Reversal",type:"bull",nc:3,cat:"Reversal",trend:"After a downtrend",lvl:"i",fq:"r",vn:"stocks",rel:80,chart:[[70,72,52,54],[38,48,36,44],[52,74,50,72]],d:"A cluster trapped between a gap down and a breakout gap up.",p:"Sellers stranded below; both gaps stack up as support underneath.",t:"Volume on the escape gap sets the conviction."},
{n:"Concealing Baby Swallow",type:"bull",nc:4,cat:"Reversal",trend:"After a downtrend",lvl:"a",fq:"r",vn:"any",rel:62,chart:[[74,78,58,60],[54,58,40,42],[38,44,26,28],[40,42,24,26]],d:"Four red candles descending; the fourth fully engulfs the third.",p:"The baby candle gets swallowed — selling is eating itself, which is how bottoms start.",t:"All four candles red is the rule; the engulf on day four is the trigger."},
{n:"Rising Three Methods",jp:"三法 · sanpō",type:"bull",nc:5,cat:"Continuation",trend:"In an uptrend",lvl:"i",fq:"o",vn:"any",rel:79,chart:[[24,56,22,54],[46,52,42,46],[42,48,38,42],[38,44,34,40],[40,78,38,76]],d:"A long green candle, three small red pullbacks staying inside its range, then a breakout green.",p:"A rest stop, not an exit — profit-taking that steady demand quietly absorbs.",t:"The continuation classic; the fifth candle's new high is the entry signal."},
{n:"Falling Three Methods",jp:"三法 · sanpō",type:"bear",nc:5,cat:"Continuation",trend:"In a downtrend",lvl:"i",fq:"o",vn:"any",rel:79,chart:[[76,78,44,46],[48,54,46,50],[44,50,40,44],[40,46,36,42],[52,54,22,24]],d:"A long red candle, three small green bounces inside its range, then a breakdown red.",p:"Every relief rally gets sold — bears reloading during the pause.",t:"The fifth candle's new low resumes the trend."},
{n:"Mat Hold",type:"bull",nc:5,cat:"Continuation",trend:"In an uptrend",lvl:"a",fq:"r",vn:"any",rel:78,chart:[[26,48,24,46],[50,56,44,48],[46,52,42,46],[42,48,38,42],[44,66,42,64]],d:"A green candle, a gap up, three small candles drifting inside the range, then a breakout.",p:"A bull flag drawn in candlesticks — holders refuse to sell at a discount.",t:"The breakout candle is the signal."},
{n:"Bullish Breakaway",type:"bull",nc:4,cat:"Reversal",trend:"After a downtrend",lvl:"a",fq:"r",vn:"stocks",rel:82,chart:[[74,78,58,62],[52,56,46,48],[42,46,38,42],[34,66,32,64]],d:"Red candle, gap-down continuation, drift, then a huge green reclaiming nearly everything.",p:"An exhaustion arc — sellers gap away, drift, then get steamrolled.",t:"The long green candle is the tell; volume surge raises conviction."},

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.06});

function cardHTML(a,i){

function blockHTML(bl){

 if(bl[0]==="p")return "<p>"+linkify(bl[1])+"</p>";
 if(bl[0]==="ul")return "<ul>"+bl[1].map(function(x){return "<li>"+linkify(x)+"</li>";}).join("")+"</ul>";

 if(bl[0]==="warn")return '<div class="notebox nb-warn"><span>▲</span><div><b style="font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase">'+t("warn")+'</b><div style="margin-top:3px">'+linkify(bl[1])+'</div></div></div>';
 if(bl[0]==="chart"){
  var cfg=bl[1];var f=null;

  var cap=cfg.cap?'<div class="chartcap">'+linkify(cfg.cap)+'</div>':"";
  return '<div class="chartbox">'+chartSVG({c:cfg.c,focus:f,zones:cfg.zones,lines:cfg.lines,paths:cfg.paths,arrows:cfg.arrows,texts:cfg.texts,animate:true})+cap+'</div>';
 }
 if(bl[0]==="charts"){

 }
 return "";
}

 if(!res.length)h+='<div class="empty">'+t("no_results")+'</div>';
 else h+=res.slice(0,60).map(function(r){var a=r[1];
  return '<a class="sr-item rv" href="#/a/'+a.id+'"><h3>'+a.title+'</h3><p>'+excerpt(a)+'</p><div class="m">'+catName(a.cat)+' · '+readMin(a)+' '+t("min_read")+'</div></a>';
 }).join("");
 h+='</div>';app.innerHTML=h;observeRv();window.scrollTo({top:0});
}

/* ============================ GAME ============================ */
var G={data:null,src:null,round:0,vis:16,hid:8,pick:null,revealed:0,phase:"pick",win:0};
var SCORE={w:0,l:0,streak:0,best:0};
try{var _s=localStorage.getItem("wp_score");if(_s)SCORE=JSON.parse(_s);}catch(e){}
function saveScore(){try{localStorage.setItem("wp_score",JSON.stringify(SCORE));}catch(e){}}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function synthSeries(n){
 var price=90+Math.random()*60,out=[],trend=0,vol=1.1,i;
 for(i=0;i<n;i++){
  if(Math.random()<0.05)trend=(Math.random()-0.5)*2.4;
  if(Math.random()<0.09)vol=0.6+Math.random()*2.1;
  trend*=0.985;
  var o=price,shock=Math.random()<0.012?(Math.random()<.5?-1:1)*vol*5:0;
  var c=o+trend*0.4+randn()*vol+shock;
  var hi=Math.max(o,c)+Math.abs(randn())*vol*0.85;
  var lo=Math.min(o,c)-Math.abs(randn())*vol*0.85;
  price=c;out.push([o,hi,lo,c]);
 }
 return out;
}
function loadGameData(){
 gameShell();document.getElementById("gsrc").innerHTML='<i style="background:var(--dim)"></i>'+t("g_loading");
 var ctl=new AbortController();var to=setTimeout(function(){ctl.abort();},7000);
 fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1000",{signal:ctl.signal})
 .then(function(r){if(!r.ok)throw 0;return r.json();})
 .then(function(d){clearTimeout(to);G.data=d.map(function(k){return[+k[1],+k[2],+k[3],+k[4]];});G.src="real";renderGame();})
 .catch(function(){clearTimeout(to);G.data=synthSeries(1000);G.src="sim";renderGame();});
}
function newRound(){G.round++;G.pick=null;G.revealed=0;G.phase="pick";G.win=20+Math.floor(Math.random()*Math.max(1,G.data.length-60));}
function gameShell(){
 app.innerHTML='<div class="view game-wrap"><div class="game-top"><h2>'+t("game_banner_t")+'</h2><span class="gsrc" id="gsrc"></span><span class="gstat">'+t("g_score")+' <b id="gsc">0–0</b></span><span class="gstat">'+t("g_streak")+' <b id="gst">0</b></span><span class="gstat">'+t("g_best")+' <b id="gbs">0</b></span></div><div class="howto"><div><b>01</b>'+t("g_how1")+'</div><div><b>02</b>'+t("g_how2")+'</div><div><b>03</b>'+t("g_how3")+'</div></div><div class="gchart" id="gchart"></div><div id="gpanel"></div></div>';
}
function renderGame(){
 if(!G.data)return;
 if(!G.round)newRound();
 gameShell();
 var src=document.getElementById("gsrc");
 src.innerHTML=G.src==="real"?'<i style="background:var(--grn)"></i>'+t("g_real"):'<i style="background:var(--gold)"></i>'+t("g_sim");
 drawGameChart();
 var panel=document.getElementById("gpanel");
 if(G.phase==="pick"){
  panel.innerHTML='<p class="gprompt">'+t("g_prompt")+' ('+t("g_round")+' '+G.round+' · '+G.hid+' hidden)</p><div class="gbtns"><button class="gbtn up" id="bUp">'+t("g_up")+'</button><button class="gbtn dn" id="bDn">'+t("g_dn")+'</button></div>';
  document.getElementById("bUp").addEventListener("click",function(){pick("up");});
  document.getElementById("bDn").addEventListener("click",function(){pick("dn");});
 }else if(G.phase==="reveal"){
  panel.innerHTML='<p class="gprompt mono">'+t("g_revealing")+'</p>';
 }else{
  var base=G.data[G.win+G.vis-1][3],fin=G.data[G.win+G.vis+G.hid-1][3];
  var pct=(fin-base)/base*100,dir=fin>base?"up":fin<base?"dn":"push";
  var win=dir===G.pick;
  var cls=dir==="push"?"push":win?"win":"lose";
  var msg=dir==="push"?t("g_push"):(win?t("g_win"):t("g_lose"));
  panel.innerHTML='<div class="gresult '+cls+'"><b>'+msg+'</b> '+t("g_move")+' <b>'+(pct>=0?"+":"")+pct.toFixed(2)+'%</b><button class="gnext" id="gnext">'+t("g_next")+'</button></div>';
  document.getElementById("gnext").addEventListener("click",function(){newRound();renderGame();});
 }
 updateScoreUI();
}
function drawGameChart(){
 var d=G.data.slice(G.win,G.win+G.vis+G.revealed);
 document.getElementById("gchart").innerHTML=chartSVG({c:d,w:820,h:320,pad:26,bw:22,animate:true})+(G.phase==="pick"?'<div class="chartcap">'+G.hid+' hidden candles →</div>':"");
}
function updateScoreUI(){
 var a=document.getElementById("gsc"),b=document.getElementById("gst"),c=document.getElementById("gbs");
 if(a){a.textContent=SCORE.w+"–"+SCORE.l;b.textContent=SCORE.streak;c.textContent=SCORE.best;}
}
function pick(dir){
 if(G.phase!=="pick")return;
 G.pick=dir;G.phase="reveal";renderGame();
 var iv=setInterval(function(){
  G.revealed++;drawGameChart();
  if(G.revealed>=G.hid){
   clearInterval(iv);
   var base=G.data[G.win+G.vis-1][3],fin=G.data[G.win+G.vis+G.hid-1][3];
   var win=(fin>base&&G.pick==="up")||(fin<base&&G.pick==="dn");
   var push=fin===base;
   if(!push){if(win){SCORE.w++;SCORE.streak++;SCORE.best=Math.max(SCORE.best,SCORE.streak);}else{SCORE.l++;SCORE.streak=0;}saveScore();}
   G.phase="done";renderGame();
  }
 },170);
}

/* ============================ HEADER SEARCH ============================ */
var sInput=document.getElementById("searchInput"),sDrop=document.getElementById("sdrop");
function searchTop(q){
 q=q.toLowerCase().trim();if(!q)return[];
 var res=[];
 ARTICLES.forEach(function(a){
  var ti=a.title.toLowerCase(),score=0;
  if(ti.indexOf(q)===0)score=100;else if(ti.indexOf(q)>-1)score=80;
  else if((a.al||[]).some(function(x){return x.toLowerCase().indexOf(q)>-1;}))score=60;
  else if(a.def.toLowerCase().indexOf(q)>-1)score=30;
  else if(JSON.stringify(a.b).toLowerCase().indexOf(q)>-1)score=10;
  if(score)res.push([score,a]);
 });
 res.sort(function(x,y){return y[0]-x[0];});
 return res.slice(0,8).map(function(x){return x[1];});
}
function showDrop(){
 var q=sInput.value.trim();
 if(!q){sDrop.classList.remove("open");return;}
 var rs=searchTop(q);
 var h=rs.length?rs.map(function(a){return '<a class="sres" href="#/a/'+a.id+'"><span class="c">'+catName(a.cat)+'</span><span class="t">'+a.title+'</span><div class="d">'+excerpt(a)+'</div></a>';}).join(""):'<div class="snone">'+t("no_results")+'</div>';
 h+='<a class="sall" href="#/s/'+encodeURIComponent(q)+'">'+t("see_all")+' →</a>';
 sDrop.innerHTML=h;sDrop.classList.add("open");
}
sInput.addEventListener("input",showDrop);
sInput.addEventListener("focus",showDrop);
sInput.addEventListener("keydown",function(e){
 if(e.key==="Enter"){var rs=searchTop(sInput.value);if(rs.length){location.hash="#/a/"+rs[0].id;}else if(sInput.value.trim()){location.hash="#/s/"+encodeURIComponent(sInput.value.trim());}sDrop.classList.remove("open");sInput.blur();}
 if(e.key==="Escape"){sDrop.classList.remove("open");sInput.blur();}
});
document.addEventListener("click",function(e){if(!e.target.closest(".searchbox"))sDrop.classList.remove("open");});
document.addEventListener("keydown",function(e){
 if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();sInput.focus();}
});

/* ============================ ROUTER ============================ */
function route(){
 var h=location.hash;
 if(h.indexOf("#/a/")===0)renderArticle(h.slice(4));
 else if(h.indexOf("#/s/")===0)renderSearchPage(decodeURIComponent(h.slice(4)));
 else if(h.indexOf("#/cat/")===0)renderCategory(h.slice(6));
 else if(h==="#/dictionary")renderDictionary();
 else if(h==="#/g"){if(!G.data)loadGameData();else renderGame();}
 else renderHome();
}
window.addEventListener("hashchange",route);
