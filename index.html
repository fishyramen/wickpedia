def:"A drawdown is how far your account falls from its peak. The trap is the asymmetry of recovery: losing 10% needs +11% to recover; losing 50% needs +100%. Deep holes take disproportionately long to climb out of.",
b:[["ul",["−10% → needs +11.1% to recover","−20% → needs +25%","−35% → needs +53.8%","−50% → needs +100%","−75% → needs +300%"]],
["tip","Personal circuit breaker: at −10% account drawdown, halve your risk per trade until a new equity high. This single rule has saved more accounts than any indicator ever did."]]});
A({id:"risk-of-ruin",cat:"risk",title:"Risk of ruin",al:["ruin","blown account"],lvl:"i",
def:"Risk of ruin is the probability that a losing streak wipes you out before your edge can express itself. Even a positive-expectancy system has a non-zero ruin probability if per-trade risk is big, because streaks are guaranteed.",
b:[["p","With a 45% win rate, streaks of 8–10 losses are normal over hundreds of trades. At 1% risk that is −8 to −10%: painful, survivable. At 10% risk the same streak ends the account. This is the entire mathematical case for the [[one-percent|1% rule]]."]]});
A({id:"when-not-to-trade",cat:"risk",title:"When NOT to trade",al:["no trade days","sit out"],lvl:"b",
def:"Standing down is a position — with zero risk and unlimited optionality. Skip trading during unplanned news, after hitting your daily loss cap, when tired or angry, in illiquid hours, and when your setup simply isn't there.",
b:[["p","Many losing months are actually five good trades minus three forced ones. The forced ones are the leak; sitting out is the patch. See [[overtrading|overtrading]] and [[revenge-trading|revenge trading]]."]]});

/* ---------- Psychology ---------- */
A({id:"trading-psychology",cat:"psych",title:"Trading psychology",al:["psychology","emotions","mental game"],lvl:"b",
def:"Markets are engineered to trigger you: losses hurt about twice as much as equal gains feel good, and intermittent rewards are the most addictive reinforcement schedule known. Trading psychology is system design against predictable human wiring.",
b:[["h","The four horsemen"],
["ul",["<b>[[fomo|FOMO]]</b> — chasing moves you missed.","<b>[[revenge-trading|Revenge trading]]</b> — demanding immediate payback after a loss.","<b>[[overtrading|Overtrading]]</b> — action addiction disguised as work.","<b>[[confirmation-bias|Confirmation bias]]</b> — researching only evidence that agrees with you."]],
["h","The defenses that actually work"],
["ul",["Rules decided BEFORE the trade ([[trading-plan|plan]]) — emotions don't get a vote.","Small size ([[one-percent|1% rule]]) — feelings scale with dollars at risk.","A [[journal|journal]] — you can't fix leaks you don't measure.","Process goals, not money goals — grade execution, let [[expectancy|expectancy]] pay.","Accepting randomness — any single trade can lose; that's the price of admission."]],
["tip","The market doesn't owe you anything, isn't targeting you, and doesn't know you exist. Your job is owning the statistical population of trades, not any single member of it."]]});
A({id:"fomo",cat:"psych",title:"FOMO",al:["fear of missing out","chasing"],lvl:"b",
def:"FOMO — fear of missing out — is the urge to jump into a move that already happened. You are not buying an opportunity; you are buying someone else's exit, at the worst price, with no plan and no logical stop.",
b:[["p","Antidotes that work: the market has endless setups — missing one costs nothing, chasing costs real money; if you missed it, mark the level and wait for the [[pullbacks|pullback]] or [[retest|retest]]; and a written [[trading-plan|plan]] turns should I jump? into does this match my setup? — usually no."]]});
A({id:"revenge-trading",cat:"psych",title:"Revenge trading",al:["revenge trade","tilt","getting even"],lvl:"b",
def:"Revenge trading is re-entering immediately after a loss to win it back — bigger size, no setup, pure payback motive. It is the most expensive emotion in markets because it compounds: loss → bigger loss → tilt → blown day.",
b:[["p","Circuit breakers: a hard rule of X minutes away from screens after any loss; a daily loss cap that ends the session ([[risk-management|risk rules]]); and the reframe — a correctly executed losing trade is a GOOD trade. The plan, not the outcome, is the scoreboard."]]});
A({id:"overtrading",cat:"psych",title:"Overtrading",al:["too many trades","action addiction"],lvl:"b",
def:"Overtrading = trading more than your edge appears: forced setups out of boredom, revenge entries, doubling after wins. Symptoms: trades without setup names in the journal, rising frequency with falling quality.",
b:[["p","Fix with structure: max trades per day in the [[trading-plan|plan]], sessions-only trading ([[sessions|killzones]]), and the identity shift — you are paid for waiting at the right place, not for clicking."]]});
A({id:"confirmation-bias",cat:"psych",title:"Confirmation bias",al:["bias","cherry picking"],lvl:"b",
def:"Confirmation bias is collecting only evidence that supports your position — bullish headlines when long, ignoring the resistance overhead. It turns analysis into advocacy.",
b:[["p","Counter-measures: write the bear case before every long (and vice versa); pre-define what would prove you WRONG ([[stop-losses|your stop is the answer]]); and let the higher [[timeframes|timeframe]] veto you. Honest doubt is a tool; comfortable certainty is a liability."]]});
A({id:"handling-losses",cat:"psych",title:"Handling losses",al:["losing streak","losses","drawdown emotions"],lvl:"b",
def:"Losses are the cost of goods sold in this business — even great systems lose 40–60% of the time. What hurts isn't the loss; it's losses that violate your own rules.",
b:[["p","Two clean categories: <b>good losses</b> (plan followed, stop hit — pay them proudly) and <b>bad losses</b> (plan broken — these are the only ones worth feeling guilty about). After any loss: [[journal|log it]], take the mandatory pause, and if losses stack ([[drawdown|drawdown]] territory), halve size rather than force recovery."]]});
A({id:"discipline",cat:"psych",title:"Discipline & routine",al:["discipline","routine","consistency","habits"],lvl:"b",
def:"Discipline isn't a personality trait; it's an environment you build. Professionals run routines: same pre-market checklist, same session hours, same review ritual, same risk rules — boring on purpose, because novelty is where emotions enter.",
b:[["ul",["<b>Before:</b> mark levels, check calendar, write today's scenarios.","<b>During:</b> execute or stand aside; no improvisation.","<b>After:</b> journal, screenshot, grade process A–F."]],
["tip","Motivation starts traders; routine keeps them. Design days you can repeat 1,000 times."]]});
A({id:"patience",cat:"psych",title:"Patience: sitting on your hands",al:["patience","waiting","doing nothing"],lvl:"b",
def:"The market pays for rare, high-quality moments — and charges for everything in between. Patience is holding cash (a full-size position in zero risk) until YOUR setup appears at YOUR level.",
b:[["p","Practical training: set alerts at your levels instead of staring at candles; limit sessions ([[killzones|killzones]]); and track trades not taken that followed the plan in the [[journal|journal]] — watching the chart without entry becomes visibly profitable."]]});
A({id:"process-vs-outcome",cat:"psych",title:"Process over outcome",al:["process","results","thinking in probabilities"],lvl:"i",
def:"Judge yourself on process, not on single outcomes. A perfect-setup trade can lose; a reckless gamble can win. Rewarding the gamble because it won is how traders train themselves into ruin.",
b:[["p","Operational version: grade every trade A–F on plan adherence in the [[journal|journal]], then track only two curves: adherence % and [[expectancy|expectancy]] over 50+ trades. Win the process and the money curve follows."]]});

/* ---------- Indicators & Tools ---------- */
A({id:"moving-averages",cat:"tools",title:"Moving averages (SMA & EMA)",al:["moving average","sma","ema","ma cross"],lvl:"b",
def:"A moving average smooths price into a line showing the average over N periods — a trend filter and dynamic support/resistance. The SMA weights all candles equally; the EMA weights recent candles more.",
b:[["chart",{c:[[30,42,28,40],[38,50,36,48],[44,56,42,46],[48,60,46,58],[54,66,52,64],[60,72,58,62],[58,70,54,58],[54,64,50,54],[50,62,46,52],[52,66,50,64]],paths:[[[0,36],[2,46],[4,52],[6,60],[9,57]],"gold"],cap:"A moving average (gold) smoothing the swings"}],
["p","Classic uses: trend direction (price above MA = up), dynamic S/R (pullbacks to the MA in trends), and crosses (fast MA crossing slow MA = momentum shift — e.g. 20/50, 50/200, the famous golden/death cross). Honest caveat: MAs lag by construction; in ranges they generate whipsaws. See [[indicators-honest|the truth about indicators]]."]]});
A({id:"ema-vs-sma",cat:"tools",title:"EMA vs SMA",al:["ema","sma","exponential"],lvl:"b",
def:"Same family, different reflexes. The SMA is smoother and slower (fewer fake signals); the EMA reacts faster (closer to price, more whipsaws). Neither is better — they answer at different speeds.",
b:[["p","Day traders favor EMAs (9/20/50); position traders often prefer SMAs (50/200). See [[moving-averages|moving averages]]."]]});
A({id:"rsi",cat:"tools",title:"RSI — Relative Strength Index",al:["rsi","overbought","oversold","divergence"],lvl:"b",
def:"The RSI measures the speed of recent gains vs losses on a 0–100 scale. Folklore says above 70 = overbought, below 30 = oversold. Reality: in strong trends RSI can stay overbought for weeks while price doubles.",
b:[["p","Better uses: <b>divergence</b> (price makes a new high but RSI makes a lower high = momentum fading), RSI reclaiming 50 as a trend filter, and overbought/oversold only inside [[ranges|ranges]]. Every indicator is a derivative of price — see [[indicators-honest|the truth about indicators]]."]]});
A({id:"macd",cat:"tools",title:"MACD",al:["macd","signal line","histogram"],lvl:"b",
def:"MACD tracks the gap between two EMAs (usually 12 and 26), with a 9-period signal line on top. Crosses signal momentum shifts, the histogram shows momentum building or fading, divergence warns of exhaustion.",
b:[["p","It is a smoothed momentum lens — great for trend confirmation, late by design, weak in chop. Same rule as always: context first, indicator second."]]});
A({id:"vwap",cat:"tools",title:"VWAP",al:["volume weighted average price","vwap"],lvl:"i",
def:"VWAP = average price weighted by volume, reset each day. Institutions use it as a fair-value benchmark, which makes it self-fulfilling: intraday price tends to respect VWAP as support/resistance.",
b:[["p","Extended moves far from VWAP often [[pullbacks|mean-revert]] back toward it. Primarily an intraday tool — on daily+ charts its value fades."]]});
A({id:"bollinger",cat:"tools",title:"Bollinger Bands",al:["bollinger bands","bands","std deviation"],lvl:"b",
def:"Bollinger Bands = a moving average ± 2 standard deviations. Bands widen with volatility and squeeze when it compresses. A long squeeze loads energy for an expansion breakout — direction unknown until it happens.",
b:[["p","In [[ranges|ranges]], traders fade touches of the outer bands. Walking the band is a strong trend, not overbought. See [[volatility|volatility]] and [[breakouts|breakouts]]."]]});
A({id:"fibonacci",cat:"tools",title:"Fibonacci retracements",al:["fib","fibonacci","golden ratio","retracement levels"],lvl:"b",
def:"Fibonacci retracement marks likely pullback depths of a move: 38.2%, 50%, 61.8% (the golden pocket), 78.6%. It works partly because enough traders watch these levels for orders to cluster there.",
b:[["p","Best practice: fibs alone are vague; fibs CONFLUENT with structure — a 61.8% that lands on an old high, [[fvg|FVG]] or [[order-blocks|order block]] — become real zones. Draw from swing low to swing high of the impulse. See [[confluence|confluence]]."]]});
A({id:"atr",cat:"tools",title:"ATR — Average True Range",al:["atr","volatility measure","true range"],lvl:"b",
def:"ATR measures how much an instrument moves on average per candle — pure volatility, no direction. Its killer use: volatility-based stops (1.5–2 × ATR) that adapt to the market's own noise.",
b:[["p","ATR also sizes expectations: if your target is 4× daily ATR away, you are asking for a multi-day move. Match targets to reality. See [[volatility|volatility]]."]]});
A({id:"stochastic",cat:"tools",title:"Stochastic oscillator",al:["stochastics","stoch"],lvl:"b",
def:"Stochastic shows where the close sits within the recent range (0–100). In ranges it's a decent timing aid; in trends it embeds into the extremes and misleads — same disease as RSI.",
b:[["p","Use it as a trigger on top of structure, never as the reason. See [[rsi|RSI]] and [[indicators-honest|the truth about indicators]]."]]});
A({id:"volume-profile",cat:"tools",title:"Volume profile",al:["volume profile","poc","value area","hvnlvn"],lvl:"a",
def:"Volume profile plots volume BY PRICE instead of by time, revealing where business actually happened: the POC (highest-volume price), the value area (~70% of volume), and thin zones price crosses fast.",
b:[["p","Price tends to rotate between high-volume shelves; thin zones act as highways; unvisited POCs often get revisited. It is one of the few tools that shows participation rather than just price — a natural companion to [[liquidity|liquidity]] mapping."]]});
A({id:"confluence",cat:"tools",title:"Confluence: stacking signals",al:["confluence","stacking","reasons"],lvl:"i",
def:"Confluence = multiple independent reasons pointing at the same zone: an FVG + a 61.8% retrace + a retest + a higher-timeframe trend + a session window. Each layer alone is weak; stacked, they define A+ setups.",
b:[["warn","The failure mode: counting the SAME information twice (three indicators derived from price aren't three reasons). Independent evidence = different data: structure, volume, time, levels."]]});
A({id:"indicators-honest",cat:"tools",title:"The truth about indicators",al:["do indicators work","lagging","indicator reality"],lvl:"i",
def:"Every indicator is a mathematical transform of the same four numbers: OHLC. They contain zero information that isn't already in price — they re-express it. The right question is not which indicator is best but which lens helps me read structure faster.",
b:[["p","A sane hierarchy: <b>price & structure</b> first ([[market-structure|structure]], [[support-resistance|levels]]), <b>volume</b> second ([[volume|participation]]), indicators third — as filters and timers. Professionals are structure-first with tools on a leash."]]});

/* ---------- Market Mechanics ---------- */
A({id:"order-book",cat:"mech",title:"The order book (DOM)",al:["dom","depth of market","order book","level 2"],lvl:"i",
def:"The order book lists every resting limit order: bids below, asks above, at each price — the raw material of price discovery. Big resting walls can act as temporary support/resistance (or bait — walls get pulled).",
b:[["p","Related mechanics: [[market-vs-limit-exec|how orders execute]], [[slippage|slippage]] when the book is thin, and why stops clustered beyond highs/lows matter so much ([[liquidity|liquidity]])."]]});
A({id:"market-vs-limit-exec",cat:"mech",title:"How orders actually execute",al:["execution","fill","crossing the spread"],lvl:"b",
def:"The matching engine pairs aggressors with resters. Market orders walk the book eating the best resting orders (fast, price floats). Limit orders join the queue and wait (precise, can miss the move).",
b:[["tip","Heuristic: market orders pay for urgency; limit orders pay with uncertainty. Entries can usually wait (limits); exits under threat rarely can. See [[slippage|slippage]]."]]});
A({id:"slippage",cat:"mech",title:"Slippage",al:["slippage","worse fill"],lvl:"b",
def:"Slippage = the difference between the price you wanted and the price you got. Causes: thin liquidity, news spikes, market stops triggering in a crowd. It eats strategies quietly.",
b:[["p","Mitigations: trade liquid instruments and liquid [[sessions|hours]], use limits for entries, and assume slippage in risk math — real stops cost slightly more than the chart says. See [[fees|fees]]."]]});
A({id:"volatility",cat:"mech",title:"Volatility",al:["volatility","vol","variance"],lvl:"b",
def:"Volatility is how violently price moves — the market's pulse. It clusters: quiet breeds quiet, spikes breed spikes. It is neither good nor bad: opportunity multiplied by risk.",
b:[["p","Measure it with [[atr|ATR]]; respect it in [[position-sizing|sizing]] — when vol doubles, stop distances double, so sizes must halve. Low-vol [[ranges|compression]] loads the spring for high-vol [[breakouts|expansion]]."]]});
A({id:"vix",cat:"mech",title:"VIX & fear indexes",al:["vix","fear index","volatility index"],lvl:"b",
def:"The VIX prices expected 30-day volatility of the S&P 500 — the fear gauge. Spikes in VIX usually coincide with stock market drops. It is a regime thermometer: elevated VIX = wider stops, smaller size.",
b:[["p","Crushed VIX = complacency, which has a habit of ending abruptly. See [[volatility|volatility]]."]]});
A({id:"news",cat:"mech",title:"Trading the news",al:["news trading","fundamentals","events"],lvl:"b",
def:"News moves markets by changing many people's urgency at once. Three ways to handle events: avoid (stand aside around major releases), react (trade the aftermath once structure settles), or anticipate (position before, accepting the coin-flip).",
b:[["p","Know the [[economic-calendar|calendar]]: CPI, central bank rates, NFP, earnings. And remember the classic trap: markets price EXPECTATIONS — the news can be good and price falls because it was less good than priced in."]]});
A({id:"economic-calendar",cat:"mech",title:"The economic calendar",al:["calendar","cpi","nfp","fomc","events"],lvl:"b",
def:"The economic calendar lists scheduled data releases with times and expected impact. Non-negotiable routine: check it every morning, mark high-impact events, and decide beforehand whether you're flat through them.",
b:[["p","Surprises move markets more than numbers: actual vs <b>forecast</b> is the trade. See [[news|trading the news]]."]]});
A({id:"earnings-gaps",cat:"mech",title:"Earnings & event gaps",al:["earnings","earnings gap","post-earnings"],lvl:"b",
def:"Earnings reprice stocks overnight — sometimes 10–20% — creating gaps that prior candles can't protect you from. Swing traders in stocks check earnings dates like weather before sailing.",
b:[["p","Post-earnings, gaps become structure: the gap edge and the pre-earnings level act as new [[support-resistance|support/resistance]]. See [[gaps|gaps]]."]]});
A({id:"why-traders-lose",cat:"mech",title:"Why most traders lose",al:["failure","blown account","statistics"],lvl:"b",
def:"The graveyard has a consistent autopsy: oversized risk, no plan, revenge & FOMO, method hopping during normal losing streaks, and ignoring costs. Nobody fails for lack of signals; people fail from risk, emotion and consistency.",
b:[["p","Which is exactly why this encyclopedia prioritizes [[risk-management|risk management]], [[trading-psychology|psychology]] and [[trading-plan|planning]] over magic indicators."]]});
A({id:"fees",cat:"mech",title:"Fees, spreads & hidden costs",al:["fees","commission","costs","spread cost"],lvl:"b",
def:"Every trade pays: spread + commission + swap/funding for holding + slippage. A scalper doing 20 trades/day can hand over more than half their gross edge to costs — the higher the frequency, the more costs dominate.",
b:[["tip","Do the math once: (average cost per round trip) × (trades per month) vs your average win. If costs exceed ~20% of gross edge, change style, instrument or broker."]]});
A({id:"funding-rates",cat:"mech",title:"Funding rates (crypto)",al:["funding rate","perpetual futures","perp"],lvl:"b",
def:"Perpetual futures never expire, so they use a funding rate to tether price to spot: longs pay shorts when funding is positive (market euphoric), shorts pay longs when negative (market fearful).",
b:[["p","Two uses: as a <b>cost</b> (holding against funding bleeds you slowly) and as a <b>sentiment gauge</b> — extreme positive funding = crowded longs, often swept before relief ([[liquidity|liquidity]] logic applies beautifully)."]]});
A({id:"swaps",cat:"mech",title:"Overnight swaps / rollover",al:["swap","rollover","overnight fee"],lvl:"b",
def:"In forex/CFDs, holding a position overnight earns or pays a swap — the interest-rate difference between the two currencies (plus broker markup). Small per night, meaningful over weeks.",
b:[["p","A swing trader holding months should check swap direction, because it can quietly eat a [[risk-reward|1R]] or quietly fund the trade."]]});
A({id:"myths",cat:"mech",title:"Trading myths, debunked",al:["myths","truth","misconceptions"],lvl:"b",
def:"You don't need to predict markets (you need positive expectancy). Higher win rate is not better (R:R decides). Indicators are not the edge. More trades is not more money. Leverage is not faster riches. The real secret is boredom: risk 1%, journal, repeat.",
b:[["ul",["<b>You need to predict the market.</b> No — [[expectancy|expectancy]] and risk control.","<b>Higher win rate = better.</b> [[winrate|Win rate without R:R is meaningless]].","<b>Indicators are the edge.</b> They are mirrors of price ([[indicators-honest|the truth]]).","<b>More trades = more money.</b> Usually the opposite ([[fees|costs]], [[overtrading|overtrading]]).","<b>More leverage = faster riches.</b> Leverage multiplies your decisions — including the bad ones ([[leverage-margin|leverage]])."]]]});
A({id:"market-makers",cat:"mech",title:"Market makers",al:["mm","liquidity providers","smart money"],lvl:"i",
def:"Market makers continuously quote both bid and ask, earning the spread while providing the liquidity everyone else trades against. Their problem — accumulating inventory risk — is why they seek the other side of their book, often exactly where retail stops cluster.",
b:[["p","You don't need conspiracy to see why price visits those pools; see [[sweeps|sweeps]] and [[liquidity|liquidity]]."]]});

/* ============================ GLOSSARY (~90 quick terms) ============================ */
function G(term,al,def,more,see){
 var id="g-"+term.toLowerCase().replace(/[^a-z0-9]+/g,"-");
 var b=[["p",more]];
 A({id:id,cat:"gloss",title:term,al:al,lvl:"b",def:def,b:b,see:see||[]});
}
G("Accumulation",["accumulating"],"Quietly buying an asset over time without pushing the price up much.","In chart reading, accumulation is what big players are thought to do before a markup: long sideways ranges with patient buying and rising [[volume|volume]].",["liquidity"]);
G("Airdrop",["airdrop"],"A free distribution of tokens to wallet addresses, usually for marketing or to reward early users.","If it sounds like free money, read the conditions — airdrops often come with vesting, tasks, or a tax event.",[]);
G("Algo trading",["algorithmic trading","bots","automated trading"],"Computers executing trading rules automatically — often faster than any human can click.","Most professional volume is algorithmic. For retail traders, the lesson is that speed is not your game — [[edge|edge]] and [[risk-management|risk]] are.",[]);
G("All-time high",["ath"],"The highest price an asset has ever reached.","ATHs have no overhead resistance — no trapped sellers waiting to exit — which is why breakouts there can run hard, and why [[liquidity|liquidity]] above ATHs attracts everyone.",["breakouts"]);
G("Altcoin",["alt"],"Any cryptocurrency other than Bitcoin.","Altcoins typically move with Bitcoin but with higher volatility — bigger rallies and deeper crashes.",["volatility"]);
G("Arbitrage",["arb"],"Buying an asset in one market and simultaneously selling it in another to pocket the price difference.","The classic risk-free profit — until you count transfer times and fees, which is why real arbitrage is mostly done by machines.",[]);
G("Average down",["averaging down"],"Buying more of a losing position to lower your average entry price.","Sometimes smart (planned [[scaling|scaling in]]), usually emotional: it turns one mistake into a bigger one. Never average down without a pre-written plan.",["scaling"]);
G("Bag holder",["bagholder"],"Someone left holding an asset after a big drop, usually because they refused to sell on the way down.","The bag is what's left when [[fomo|FOMO]] buys the top and hope replaces the [[stop-losses|stop loss]].",[]);
G("Bear market",["bearish market"],"A prolonged period of falling prices, conventionally a drop of 20% or more from the highs.","Bear markets reward patience and short-side skill, and punish anyone who keeps buying every dip without a plan. Opposite of a [[g-bull-market|bull market]].",["market-structure"]);
G("Bear trap",["bear trap"],"A fake breakdown below support that immediately reverses upward, trapping shorts.","Bear traps are [[liquidity|liquidity]] sweeps in disguise: the stops below the low were the fuel. See [[sweeps|sweeps]] and [[breakouts|fakeouts]].",["sweeps"]);
G("Block",["crypto block"],"A batch of transactions recorded together on a blockchain.","Blocks are why crypto confirmations take time — your deposit is waiting for blocks, not for a person.",[]);
G("Blue chip",["blue chip"],"A large, established, financially solid company (or the crypto equivalents) considered relatively safe.","Blue chips move slower and survive longer. Beginners are usually better learning on liquid blue chips than on exotic small caps.",[]);
G("Bottom",["bottoming","market bottom"],"The lowest area of a decline — the point where selling exhausts and a new uptrend begins.","Everyone wants to call the bottom. Professionals wait for [[market-structure|structure]] to turn ([[choch|CHoCH]]) instead of guessing.",[]);
G("Breakdown",["breakdown"],"Price falling through a support level — the bearish version of a breakout.","Real breakdowns close beyond the level with [[volume|volume]]; wick-only breaks are often [[bear-trap|traps]]. Wait for the [[retest|retest]] to confirm.",["breakouts"]);
G("Bull market",["bullish market"],"A prolonged period of rising prices, conventionally +20% off the lows or more.","Bull markets make geniuses out of everyone — which is why risk habits built in bull markets decide who survives the next bear one. Opposite of a [[g-bear-market|bear market]].",[]);
G("Bull trap",["bull trap"],"A fake breakout above resistance that immediately reverses downward, trapping longs.","Same mechanism as the [[g-bear-trap|bear trap]], opposite direction: the stops and breakout orders above the high were the fuel. See [[sweeps|sweeps]].",["sweeps"]);
G("Buy wall",["buy wall"],"A large cluster of buy orders sitting at one price in the order book.","Walls can act as temporary support — but walls can also be pulled (spoofing), so treat them as hints, not guarantees. See [[order-book|order book]].",["order-book"]);
G("Capitulation",["capitulation"],"The phase where the last holders give up and sell in panic — often marking the final stretch of a bottom.","Capitulation candles are huge, emotional, high-[[volume|volume]] red candles. The crowd's worst day is frequently close to the market's best entry.",[]);
G("Carry trade",["carry trade"],"Borrowing in a low-interest currency and investing in a higher-yielding one, profiting from the rate difference.","A classic macro trade that unwinds violently when volatility spikes — everyone rushes for the same exit at once.",[]);
G("CFD",["contract for difference"],"A derivative where you bet on price movement without owning the asset — common in Europe, banned in the US.","CFDs bring leverage and overnight fees into the mix, so understand [[leverage-margin|leverage]] and [[swaps|swaps]] before touching them.",["leverage-margin"]);
G("Chart",["price chart"],"A picture of price history — lines, bars or candlesticks over time.","Candlesticks won for a reason: they show who won each period at a glance. Start with [[what-is-candlestick|what is a candlestick]].",["what-is-candlestick"]);
G("Circuit breaker",["trading halt"],"An automatic pause in trading triggered when prices move too violently, designed to let panic cool.","Exchanges have them for stocks and futures; crypto largely doesn't — which is one reason crypto wicks are so savage.",[]);
G("Cold wallet",["cold storage"],"A crypto wallet kept offline (hardware device or paper), immune to online hacks.","Rule of thumb: amounts you can't afford to lose belong in cold storage, not on exchanges.",["g-hot-wallet"]);
G("Correction",["market correction"],"A moderate decline within a bigger uptrend, typically around 10%.","Corrections are healthy and normal — they shake out weak hands and reset [[risk-management|position sizes]]. Selling everything in every correction is how people miss the trend.",["pullbacks"]);
G("Counterparty",["counterparty"],"The other side of your trade — the person buying what you sell or selling what you buy.","Every trade has one. When you wonder who is on the other side of your urgent market order at the worst moment, that feeling is the lesson. See [[what-moves-price|what moves price]].",[]);
G("Currency pair",["pair","fx pair"],"Two currencies priced against each other, like EUR/USD — the first is what you buy, the second is what you pay with.","In EUR/USD going long means buying euros and selling dollars at the same time. See [[markets|forex basics]].",["markets"]);
G("Day order",["day order"],"An order that automatically expires at the end of the trading day if not filled.","The default order type on most stock platforms. If you want it to survive overnight, set it to GTC (good till cancelled).",["order-types"]);
G("Dead cat bounce",["dead cat bounce"],"A small, short-lived rebound within a larger downtrend — even a dead cat bounces if it falls from high enough.","The trap: it looks like the reversal, lures in hopeful buyers, then the downtrend continues. Structure ([[market-structure|HH/HL]]) tells you which it is.",[]);
G("Divergence",["divergence"],"When an indicator disagrees with price — for example price makes a new high but RSI makes a lower high.","Divergence is a momentum warning, not a trigger: markets can stay divergent for a long time. Use it to tighten stops, not to instantly reverse. See [[rsi|RSI]].",["rsi"]);
G("Distribution",["distribution"],"Quietly selling into strength over time — the mirror of accumulation.","Charts show it as choppy, stalling price at highs with heavy volume and lots of upper wicks. The markup phase of the cycle hands over to markdown.",["liquidity"]);
G("Dividend",["dividend"],"A share of company profits paid out to shareholders, usually quarterly.","Dividends matter for investors; for short-term traders the key detail is the ex-dividend date, which creates predictable price adjustments.",[]);
G("Dollar-cost averaging",["dca"],"Investing a fixed amount at regular intervals regardless of price.","DCA removes timing from the equation — popular for long-term investing. For active trading, entries still matter; DCA is not a substitute for a [[trading-plan|plan]].",[]);
G("Double bottom",["double bottom","w bottom"],"A reversal shape with two lows at roughly the same level, forming a W.","The textbook read: second low holds, neckline breaks, trend flips. The SMC read: the second low often sweeps the first ([[sweeps|sweeps]]) — wait for structure to confirm. See [[equal-highs|equal highs & lows]].",["equal-highs"]);
G("Double top",["double top","m top"],"A reversal shape with two highs at roughly the same level, forming an M.","Mirror of the double bottom. Equal highs are a [[liquidity|liquidity]] magnet — expect the market to raid above them before deciding. See [[equal-highs|equal highs & lows]].",["equal-highs"]);
G("Downtrend",["downtrend"],"A sequence of lower highs and lower lows.","The downtrend playbook: sell rallies, not lows. See [[market-structure|market structure]] and [[hh-hl|HH/HL]].",["market-structure"]);
G("Dump",["dumping"],"A sudden, heavy sell-off — price falling fast on strong volume.","Dumps cascade because of forced selling: stops and liquidations feeding on each other. See [[leverage-margin|liquidation]].",[]);
G("ETF",["exchange traded fund"],"A basket of assets (stocks, bonds, commodities) that trades like a single stock.","ETFs are how most people get market exposure without picking individual names — e.g. an S&P 500 ETF buys all 500 companies at once.",[]);
G("Exchange",["trading exchange"],"A marketplace where buyers and sellers meet — the NYSE for stocks, Binance or Coinbase for crypto.","Your exchange choice matters: [[broker|regulation]], fees, liquidity and withdrawal reliability are the checklist.",["broker"]);
G("Fill",["filled order"],"When your order actually executes and you get the position.","Partial fills happen in thin markets — you asked for 100, got 60 now and 40 later. See [[market-vs-limit-exec|how orders execute]].",["market-vs-limit-exec"]);
G("Floating P/L",["unrealized p/l","open pnl"],"The profit or loss of a position that is still open — it floats with every tick.","Floating profit is not your money yet; it's a proposal the market can withdraw. Only closing converts it to realized P/L. See [[take-profit|take profit]].",[]);
G("Fundamental analysis",["fundamentals"],"Estimating an asset's value from underlying drivers — earnings, growth, interest rates, supply and demand.","The counterpart of [[technical-analysis|technical analysis]]. Traders often blend both: fundamentals decide WHAT to trade, technicals decide WHEN.",["technical-analysis"]);
G("FUD",["fud"],"Fear, Uncertainty and Doubt — negative narratives pushed (or believed) during weak markets.","FUD is loudest near bottoms; euphoria is loudest near tops. Recognizing the emotional season is half of [[trading-psychology|psychology]].",[]);
G("Futures",["futures contract"],"Contracts to buy or sell an asset at a set price on a future date — used for hedging and speculation.","Futures add leverage and expiry to the mix. Crypto perpetuals are a special case with [[funding-rates|funding rates]] instead of expiry.",["leverage-margin"]);
G("Golden cross",["golden cross"],"When a faster moving average (e.g. the 50-day) crosses above a slower one (e.g. the 200-day) — a classic bullish signal.","The opposite is the death cross. Both are slow, lagging signals: useful for regime context, useless for timing exact entries. See [[moving-averages|moving averages]].",["moving-averages"]);
G("Hedge",["hedging"],"Taking an offsetting position to reduce the risk of an existing one.","Example: long a portfolio, short an index future. Hedging buys safety at the price of reduced upside — it is insurance, not a free lunch.",[]);
G("Hodl",["hold"],"Crypto slang for holding through volatility instead of panic selling — born from a famous drunk typo of HOLD.","A philosophy, not a strategy: hodling works for assets you believe in long-term and is simply bagholding for assets you don't.",[]);
G("Hot wallet",["hot wallet"],"A crypto wallet connected to the internet — convenient for trading, exposed to hacks.","Keep only trading-sized amounts hot; store the rest in a [[g-cold-wallet|cold wallet]].",["g-cold-wallet"]);
G("ICO",["initial coin offering"],"A fundraising method where a new crypto project sells tokens to early backers.","Most ICOs of the 2017 era failed or vanished ([[g-rug-pull|rug pulls]]). The modern equivalents are more regulated token sales — diligence is still mandatory.",[]);
G("Index",["indexes","indices"],"A basket representing a whole market — the S&P 500 tracks the 500 largest US companies.","You can't buy an index directly; you buy an [[g-etf|ETF]] or a futures contract that tracks it.",[]);
G("IPO",["initial public offering"],"A company's first sale of shares to the public — the day it lists on the stock exchange.","IPOs are famously volatile: hype, no chart history, and lockup expiries months later. New traders usually do better watching from outside.",[]);
G("Limit up / limit down",["limit up","limit down"],"The maximum daily move allowed on some exchanges before trading halts.","Common in futures and some stock markets. When a market is limit-locked, exits can become impossible — another reason [[position-sizing|size]] matters.",[]);
G("Liquidation",["liquidation","liquidated"],"The forced closing of a leveraged position when losses eat through the margin.","Liquidations cascade: forced sells push price further, triggering more liquidations — that is what creates candle avalanches in crypto. See [[leverage-margin|leverage]].",["leverage-margin"]);
G("Long squeeze",["long squeeze"],"A cascade of forced selling from over-leveraged longs, flushing price down quickly.","The fuel is the same as a [[sweeps|liquidity sweep]]: clustered stops and liquidations below the market. Squeezes end fast — because they're mechanical, not emotional.",["leverage-margin"]);
G("Maker / taker",["maker","taker"],"Two roles in every trade: the maker places a resting limit order (adds liquidity), the taker crosses the spread with a market order (removes it).","Exchanges usually charge takers more and pay or discount makers. High-frequency traders optimize around this. See [[fees|fees]].",["fees"]);
G("Market cap",["capitalization","market capitalization"],"The total size of an asset: price × circulating supply.","Market cap — not price — tells you how big something is. A $0.01 coin with trillions of tokens can be bigger than a $100 coin with few.",[]);
G("Momentum",["momentum"],"The speed and force of a price move — how fast, on how much volume.","Momentum is what [[displacement|displacement]] candles show, what [[macd|MACD]] measures, and what fades right before reversals ([[divergence|divergence]]).",["displacement"]);
G("Moon",["mooning","to the moon"],"Slang for a violent price rally.","The word is a tell: when moon talk peaks in the comments, the buyers are usually already in — see [[fomo|FOMO]] and [[g-fud|euphoria cycles]].",[]);
G("Open interest",["oi"],"The total number of open futures or options contracts that haven't been settled.","Rising open interest with rising price = fresh money confirming the move. Open interest collapsing = leveraged players being flushed. It is the leverage meter.",["funding-rates"]);
G("OTC",["over the counter"],"Trading directly between two parties, off the public exchange.","Whales use OTC desks to move size without moving the market price — which is why big transfers don't always show on the chart.",[]);
G("Paper hands",["paper hands"],"Selling early out of fear — hands too weak to hold through volatility.","The opposite of diamond hands. The fix isn't bravado, it's a [[trading-plan|plan]]: if your exit was pre-decided, it's discipline, not paper hands.",[]);
G("Pattern",["chart pattern","price pattern"],"A recurring, recognizable shape in price that traders use to frame probabilities.","Patterns range from single candles (the [[dictionary|dictionary]]) to big shapes like head and shoulders. Patterns frame trades; they never guarantee them.",[]);
G("Pivot",["pivot point"],"A turning point in price — a local high or low where direction changes.","Synonym of [[swing-points|swing point]]. Some systems also compute daily pivot levels from yesterday's high/low/close as intraday reference prices.",["swing-points"]);
G("Position",["holding"],"Whatever you currently have open in the market — long, short, big or small.","Your portfolio is the sum of your positions; each one should answer: where am I wrong ([[stop-losses|stop]]) and how much does being wrong cost ([[position-sizing|sizing]])?",[]);
G("Profit taking",["taking profit"],"Selling part or all of a winning position to lock in gains.","Heavy profit taking is what creates pullbacks after strong runs — winners selling into strength is normal, healthy, and tradeable ([[pullbacks|pullbacks]]).",["take-profit"]);
G("Pump",["pump"],"A sharp, fast rise in price, often driven by hype or coordinated buying.","Pumps need fuel to continue; when the fuel is borrowed money, the pump ends in a [[g-long-squeeze|squeeze]]. See [[g-pump-and-dump|pump and dump]].",[]);
G("Pump and dump",["p&d"],"A manipulation scheme: hype an asset up, then sell it into the frenzy you created.","Common in tiny, illiquid tokens. If strangers are urgently telling you to buy something obscure, you are the exit liquidity. See [[liquidity|liquidity]].",[]);
G("Realized P/L",["realized profit","closed pnl"],"Profit or loss after the position is actually closed — the only number your account cares about.","Floating profits are proposals; realized profits are facts. This distinction is why [[take-profit|exit planning]] is a skill of its own.",[]);
G("Rekt",["rekt"],"Slang for financially wrecked by the markets — usually by leverage and no stops.","Almost every rekt story contains the same ingredients: oversized [[leverage-margin|leverage]], no [[stop-losses|stop]], and [[revenge-trading|revenge]]. Prevention is boring and available in [[risk-management|risk management]].",[]);
G("Reversal",["trend reversal"],"A change in the trend's direction — uptrend becomes downtrend or vice versa.","Reversals are confirmed by [[market-structure|structure]] (broken highs/lows), not by wishes. Candle hints: [[evening-star|evening star]], [[morning-star|morning star]].",["choch"]);
G("Rug pull",["rug"],"A scam where project developers abandon a project and run with investors' funds.","The crypto version of a heist: liquidity disappears, price goes to zero, the website dies. The defense is boring: only trade liquid, vetted markets.",[]);
G("Scalp",["scalping"],"A very short trade — seconds to minutes — aiming for a small profit, repeated many times.","Scalping demands low [[fees|fees]], fast execution and iron discipline; it's the hardest style for beginners. See [[trading-styles|trading styles]].",["trading-styles"]);
G("Sell wall",["sell wall"],"A large cluster of sell orders sitting at one price in the order book.","The mirror of the [[g-buy-wall|buy wall]]: temporary resistance that can also be pulled. Context beats walls. See [[order-book|order book]].",["order-book"]);
G("Sentiment",["market sentiment"],"The crowd's overall mood — fear or greed, positioning, and what everyone expects.","Sentiment is a contrarian compass at extremes: maximum fear often marks bottoms, maximum greed marks tops. Funding rates and VIX are sentiment gauges.",["funding-rates"]);
G("Short squeeze",["short squeeze"],"A violent rally caused by shorts being forced to buy back as price rises against them.","Their forced buying fuels the move, triggering more shorts — a self-feeding spiral. The fuel is [[liquidity|liquidity]] above the market. See [[leverage-margin|leverage]].",["liquidity"]);
G("Sideways",["sideways market"],"Moving without clear direction, inside a range.","Same as a [[ranges|range]]. Most markets are sideways most of the time — the skill is recognizing it BEFORE applying trend tools.",["ranges"]);
G("Stablecoin",["stablecoin"],"A crypto token pegged to a stable asset, usually the US dollar (USDT, USDC).","Stablecoins are the cash of crypto — used to park profits between trades. Pegs can theoretically break, so diversify where you hold them.",[]);
G("Staking",["staking"],"Locking up crypto to help secure its network in exchange for rewards.","The crypto version of earning interest — with the extra risk that the asset itself can fall more than the yield pays.",[]);
G("Technical analysis",["ta"],"Studying price action — charts, patterns, volume — to estimate future probabilities.","TA doesn't predict; it frames odds and structures risk. Its alphabet: [[what-is-candlestick|candlesticks]], its grammar: [[market-structure|structure]].",["what-is-candlestick"]);
G("Ticker",["symbol"],"The short code identifying an asset: AAPL, BTC, EUR/USD.","Tickers are your search keys — on exchanges, in news, and in this encyclopedia.",[]);
G("Time in force",["tif","gtc","ioc"],"How long an order stays alive: for the day, good-till-cancelled, or immediate-or-cancel.","One setting that quietly matters: a forgotten GTC order from last week can fill at the worst possible moment.",["order-types"]);
G("Token",["token"],"A crypto asset built on top of another blockchain, rather than having its own.","Bitcoin has its own chain; most tokens live on Ethereum or Solana. A token's value depends on both its project and the chain underneath.",[]);
G("Top",["market top","topping"],"The highest area of an advance — where buying exhausts and distribution begins.","Tops are processes more than points: [[distribution|distribution]], [[equal-highs|liquidity grabs]], then [[choch|structure failure]]. Nobody rings a bell.",[]);
G("Trend",["trend"],"The general direction of price over time — up, down, or sideways.","The most profitable four words in trading: identify it, then join it. See [[market-structure|market structure]] for how trends are defined.",["market-structure"]);
G("Uptrend",["uptrend"],"A sequence of higher highs and higher lows.","The uptrend playbook: buy pullbacks at higher lows, not tops of rallies. See [[market-structure|market structure]].",["market-structure"]);
G("Wallet",["crypto wallet"],"Software or hardware that stores the keys controlling your crypto.","Not your keys, not your coins: coins left on an exchange are legally the exchange's promise. See [[g-hot-wallet|hot]] and [[g-cold-wallet|cold]] wallets.",[]);
G("Whale",["whale"],"A holder large enough to move markets with single trades.","Whales can't just click buy like you — they need [[liquidity|liquidity]], which is the mechanical reason behind sweeps, walls and strange wicks.",["liquidity"]);
G("Yield",["yield"],"The income an asset generates, expressed as a percentage — staking rewards, interest, dividends.","If a yield looks too good to be true, the missing piece is usually risk: the asset falling faster than the yield pays.",[]);
G("Wick",["wick","shadow","tail"],"The thin line above or below a candle's body, marking how far price traveled before being rejected.","Wicks are the market's fingerprints — rejections, sweeps and traps all leave them. Learn to read them in [[what-wicks-mean|what wicks tell you]].",["what-wicks-mean"]);
G("Reversal candle",["reversal pattern"],"Any candle pattern that hints the current trend may flip — hammers, engulfings, stars.","Reversal candles are hints, not orders: they need [[candle-context|location]] and confirmation. The full catalog lives in the [[dictionary|dictionary]].",[]);
G("Risk of overleveraging",["overleveraged"],"Using so much leverage that a routine wiggle can liquidate the position.","The math is unforgiving: 20× leverage means 5% against you is game over. See [[leverage-margin|leverage & margin]].",["leverage-margin"]);
G("Stop run",["stop run"],"Price briefly moving to a cluster of stop orders, triggering them, then reversing.","A stop run is the street-level name for a [[sweeps|liquidity sweep]]. If you keep getting stopped out right before the move, your stops are at the obvious place.",["sweeps"]);
G("Candle close",["close"],"The final price of a candle's period — the number everything is measured against.","Amateurs react mid-candle; professionals wait for the close. See [[ohlc|OHLC]].",["ohlc"]);
G("Range high / range low",["range high","range low"],"The ceiling and floor of a sideways market.","The edges are where trades happen and where [[liquidity|liquidity]] hides. See [[ranges|ranges]].",["ranges"]);
G("Higher timeframe",["htf"],"A longer chart period than the one you trade — the zoomed-out view.","The higher timeframe decides the regime; your timeframe just picks the entry. See [[multi-tf|top-down analysis]].",["multi-tf"]);
G("Lower timeframe",["ltf"],"A shorter chart period — used for precise entries inside a higher-timeframe idea.","LTF signals without HTF agreement are noise. See [[multi-tf|top-down analysis]].",["multi-tf"]);
G("Position trader",["position trading"],"A trader who holds for weeks to months, riding the big moves.","The slowest style: fewest trades, most patience, highest tolerance for pullbacks. See [[trading-styles|trading styles]].",["trading-styles"]);
G("Day trader",["day trading"],"A trader who opens and closes positions within the same day.","No overnight risk, but concentrated screen time. See [[trading-styles|trading styles]].",["trading-styles"]);
G("Swing trader",["swing trading"],"A trader who holds for days to weeks, catching one swing of the trend.","Usually the best starting style: real signals, manageable time, honest feedback. See [[trading-styles|trading styles]].",["trading-styles"]);
G("Scalper",["scalper"],"A trader taking dozens of very short trades per day.","The hardest style: fees, speed and discipline all against you. See [[trading-styles|trading styles]].",["trading-styles"]);
G("Green candle",["bullish candle"],"A candle that closed above its open — buyers won that period.","One green candle is a fact; green candles in sequence are a story. See [[bull-vs-bear|bullish vs bearish]].",["bull-vs-bear"]);
G("Red candle",["bearish candle"],"A candle that closed below its open — sellers won that period.","One red candle is a fact; red candles in sequence are a story. See [[bull-vs-bear|bullish vs bearish]].",["bull-vs-bear"]);
G("Body",["real body"],"The rectangle of a candle between its open and close — the conviction meter.","Big body = decision. Small body = doubt. Full anatomy in [[candle-anatomy|candle anatomy]].",["candle-anatomy"]);
G("Chart pattern",["pattern"],"A bigger price shape — triangles, flags, heads and shoulders — built from many candles.","Patterns frame probabilities, never guarantees. Combine them with [[volume|volume]] and [[support-resistance|levels]].",[]);
G("Consecutive losses",["losing streak"],"A run of losing trades in a row — guaranteed to happen in every real system.","The question isn't whether streaks happen, but whether your [[position-sizing|sizing]] survives them. See [[risk-of-ruin|risk of ruin]].",["risk-of-ruin"]);
G("Equity curve",["equity"],"The chart of your account balance over time — your real track record.","The equity curve is the final exam: smooth and rising means the process works; jagged means [[risk-management|risk]] doesn't. See [[journal|journal]].",[]);
G("Trading edge",["edge"],"Any repeatable condition that makes one outcome more likely than the market's price implies.","You don't find edges by predicting — you find them by measuring. See [[edge|what is an edge]].",["edge"]);
G("Market order",["market order"],"An order that executes immediately at the best available price.","Certainty of fill, uncertainty of price. See [[order-types|order types]].",["order-types"]);
G("Limit order",["limit order"],"An order that executes only at your price or better.","Certainty of price, uncertainty of fill. See [[order-types|order types]].",["order-types"]);
G("Stop order",["stop order"],"An order that activates when price reaches a trigger — the machinery behind stop losses.","When triggered it becomes a market order, exactly when things are chaotic — hence [[slippage|slippage]]. See [[stop-losses|stop losses]].",["stop-losses"]);
G("Take profit order",["tp order"],"An order that automatically closes your position at your target price.","Set it when you enter, while you're calm. See [[take-profit|take profit strategies]].",["take-profit"]);
G("Stop loss order",["stop loss order"],"An order that automatically closes your position when you're proven wrong.","The only honest seatbelt in markets. See [[stop-losses|stop losses]].",["stop-losses"]);
G("Spread",["spread"],"The gap between the bid and the ask — the cost of crossing from one side to the other.","See [[bid-ask-spread|bid, ask & spread]].",["bid-ask-spread"]);
G("Pip",["pip"],"Forex's standard unit of price movement: 0.0001 on most pairs.","See [[pips-points-ticks|pips, points & ticks]].",["pips-points-ticks"]);
G("Leverage",["leverage"],"Borrowed size: controlling a big position with a small deposit.","It multiplies both directions identically. Full guide: [[leverage-margin|leverage & margin]].",["leverage-margin"]);
G("Margin",["margin"],"The deposit backing a leveraged position.","Lose too much of it and you meet [[g-liquidation|liquidation]]. See [[leverage-margin|leverage & margin]].",["leverage-margin"]);
G("Drawdown",["dd"],"How far an account has fallen from its peak.","The recovery math is asymmetric — see [[drawdown|drawdown]].",["drawdown"]);
G("Win rate",["winrate","hit rate"],"The percentage of trades that win.","Meaningless without [[risk-reward|R:R]] — see [[winrate|win rate vs risk/reward]].",["winrate"]);
G("R multiple",["r","r multiple"],"A result expressed in units of the initial risk: +2R means twice the risk was gained.","The universal language of results. See [[risk-reward|risk/reward]].",["risk-reward"]);
G("Expectancy",["expected value"],"Average R earned per trade over many trades — win rate × win size minus loss rate × loss size.","The number that decides careers. See [[expectancy|expectancy]].",["expectancy"]);
G("Backtest",["backtesting"],"Replaying your rules against history to measure what would have happened.","Garbage in, garbage out: honest backtests include every rule and every cost. See [[backtesting|backtesting]].",["backtesting"]);
G("Demo account",["demo","paper trading"],"A practice account trading real charts with fake money.","Your first 30 sessions should happen here. See [[demo|demo trading]].",["demo"]);
G("Trading journal",["journal"],"The log of every trade and its context — the tool that turns experience into improvement.","See [[journal|the trading journal]].",["journal"]);
G("Trading plan",["plan"],"Your written rules: setups, entries, stops, targets, risk, and review rituals.","See [[trading-plan|building a trading plan]].",["trading-plan"]);
G("Killzone",["killzone"],"A high-volume session window where the day's real moves tend to happen.","See [[killzones|killzones & session liquidity]].",["killzones"]);
G("FVG",["fair value gap"],"A three-candle imbalance that price often returns to fill.","The full guide lives at [[fvg|Fair Value Gaps]].",["fvg"]);
G("Order block",["ob"],"The last opposite candle before a strong impulsive move — a zone price often revisits.","Full guide: [[order-blocks|order blocks]].",["order-blocks"]);
G("Liquidity sweep",["sweep","stop hunt"],"A quick raid beyond an obvious high/low that triggers stops and reverses.","Full guide: [[sweeps|liquidity sweeps]].",["sweeps"]);
G("BOS",["break of structure"],"Structure breaking in the direction of the trend — continuation.","See [[bos|Break of Structure]].",["bos"]);
G("CHoCH",["change of character"],"Structure breaking against the trend — the first sign of reversal.","See [[choch|Change of Character]].",["choch"]);
G("Premium zone",["premium"],"The upper half of a dealing range — expensive, look to sell.","See [[premium-discount|premium & discount]].",["premium-discount"]);
G("Discount zone",["discount"],"The lower half of a dealing range — cheap, look to buy.","See [[premium-discount|premium & discount]].",["premium-discount"]);
G("Doji",["doji"],"A candle whose open and close are (almost) identical — a draw.","Meet the whole family: [[doji-family|the doji family]].",["doji-family"]);
G("Hammer",["hammer"],"Small body, long lower wick, after a decline — the classic bottom hint.","Full article: [[hammer|Hammer]].",["hammer"]);
G("Shooting star",["shooting star"],"Small body, long upper wick, after a rally — the classic top hint.","Full article: [[shooting-star|Shooting Star]].",["shooting-star"]);
G("Engulfing",["engulfing pattern"],"A candle whose body completely swallows the previous body.","[[bullish-engulfing|Bullish]] and [[bearish-engulfing|bearish]] versions.",["bullish-engulfing"]);
G("Marubozu",["marubozu"],"A full body with no wicks — one side owned the entire session.","See [[marubozu-family|marubozu explained]].",["marubozu-family"]);
G("Gap",["gap","window"],"Price opening away from the previous close, leaving empty chart space.","See [[gaps|gaps (windows)]].",["gaps"]);
G("Support",["support"],"A zone where buying repeatedly appears — the floor.","See [[support-resistance|support & resistance]].",["support-resistance"]);
G("Resistance",["resistance"],"A zone where selling repeatedly appears — the ceiling.","See [[support-resistance|support & resistance]].",["support-resistance"]);
G("Breakout",["breakout"],"Price leaving a range or level with force.","See [[breakouts|breakouts & fakeouts]].",["breakouts"]);
G("Fakeout",["fakeout","false breakout"],"A breakout that immediately fails, trapping the chasers.","See [[breakouts|breakouts & fakeouts]] and [[sweeps|sweeps]].",["breakouts"]);
G("Pullback",["pullback","retracement"],"A temporary move against the trend.","See [[pullbacks|pullbacks & retracements]].",["pullbacks"]);
G("Volume",["volume"],"How much traded during a candle — the lie detector.","See [[volume|volume]].",["volume"]);
G("Volatility",["volatility"],"How violently price moves.","See [[volatility|volatility]].",["volatility"]);
G("Trendline",["trendline"],"A diagonal line connecting swings — dynamic support/resistance.","See [[trendlines|trendlines & channels]].",["trendlines"]);
G("RSI",["rsi"],"Relative Strength Index — momentum on a 0–100 scale.","See [[rsi|RSI]].",["rsi"]);
G("Moving average",["ma","sma","ema"],"Smoothed average price over N periods.","See [[moving-averages|moving averages]].",["moving-averages"]);
G("Airdrop farmer",["airdrop farming"],"Someone who interacts with protocols hoping to qualify for future free token distributions.","A grind with uncertain payoff — treat time as the invested capital.",[]);
G("Rekt city",["rekt city"],"Humorous slang for where overleveraged traders end up.","See [[g-rekt|rekt]] — and take the [[risk-management|risk management]] exit before arriving.",[]);
G("Diamond hands",["diamond hands"],"Holding a position through extreme volatility without selling.","Admirable with a plan and a thesis; bagholding with extra branding without one. See [[g-paper-hands|paper hands]].",[]);
G("Exit liquidity",["exit liquidity"],"The buyers that allow big holders to sell their positions.","When a pump needs a crowd to work, the crowd is the exit liquidity. See [[liquidity|liquidity]].",["liquidity"]);
G("Stacking sats",["stacking"],"Gradually accumulating bitcoin in small amounts over time.","The bitcoin flavor of [[g-dollar-cost-averaging|DCA]].",[]);
G("Fiat",["fiat currency"],"Government-issued money not backed by a physical commodity — dollars, euros, yen.","The baseline crypto trades against; most pairs are crypto/fiat or crypto/stablecoin.",[]);
G("Order flow",["order flow"],"The real-time stream of buys and sells hitting the market.","Reading order flow means watching [[what-moves-price|aggression vs resting orders]] directly, instead of through indicators.",["order-book"]);
G("Tape reading",["tape"],"The old-school art of reading raw prints and order flow to sense pressure.","The ancestor of modern [[order-book|order book]] tools — still alive in futures pits and DOM trading.",["order-book"]);
G("DOM",["depth of market"],"The ladder view of the [[order-book|order book]] used by futures scalpers.","See [[order-book|order book]].",["order-book"]);
G("Footprint chart",["footprint"],"A candle that shows the volume traded at each price inside it.","X-ray vision for candles: you see where buyers and sellers actually fought. Advanced cousin of [[volume-profile|volume profile]].",["volume-profile"]);
G("VWAP band",["vwap bands"],"Standard-deviation bands around VWAP, like Bollinger Bands for intraday.","Used for intraday overextension: far from VWAP = stretched. See [[vwap|VWAP]].",["vwap"]);
G("Anchored VWAP",["anchored vwap","avwap"],"A VWAP started from a chosen event — earnings, a swing low, a news spike.","It answers: what's the average price of everyone who entered since THIS moment? Powerful institutional reference. See [[vwap|VWAP]].",["vwap"]);
G("Relative volume",["rvol"],"Current volume compared to its usual level for this time of day.","RVOL > 2 means real participation — moves with RVOL deserve attention. See [[volume|volume]].",["volume"]);
G("Opening range",["opening range breakout","orb"],"The high and low of the first minutes of the session — a reference box for the day.","Breaks of the opening range often set the day's direction; a classic day-trading playbook. See [[sessions|sessions]].",["sessions"]);
G("Midnight open",["midnight price","daily open"],"The day's opening price — a key reference many algorithms defend.","Price above the daily open = intraday strength; below = weakness. A free level every chart gives you.",[]);
G("Mean reversion",["mean reversion"],"The tendency of price to return toward its average after stretching too far.","The logic behind fading extremes with [[bollinger|Bollinger Bands]] or far-from-VWAP trades.",["vwap"]);
G("Trend following",["trend following"],"The strategy family of joining established trends and riding them.","The opposite philosophy of [[g-mean-reversion|mean reversion]]. Both work; neither works everywhere — regimes decide.",["market-structure"]);
G("Breaker",["breaker block"],"A failed order block that flips its role.","See [[breaker|breaker blocks]].",["breaker"]);
G("Mitigation",["mitigation block"],"A softer failed order block used to exit at breakeven.","See [[mitigation|mitigation blocks]].",["mitigation"]);
G("Inducement",["inducement"],"A fake early level that lures premature entries before the real move.","See [[inducement|inducement]].",["inducement"]);
G("Displacement",["displacement"],"A sudden energetic move revealing real intent.","See [[displacement|displacement]].",["displacement"]);
G("Imbalance",["imbalance"],"Price moving so fast one side never got filled — the idea behind FVGs.","See [[imbalance|imbalance]] and [[fvg|FVG]].",["fvg"]);
G("Consequent encroachment",["ce"],"The exact midpoint of a Fair Value Gap — often the reaction point.","See [[fvg|Fair Value Gaps]].",["fvg"]);
G("Golden pocket",["golden pocket"],"The 61.8–65% Fibonacci retracement zone — the most-watched pullback area.","See [[fibonacci|Fibonacci retracements]].",["fibonacci"]);
G("Death cross",["death cross"],"The 50-day average crossing below the 200-day — the bearish cousin of the golden cross.","Slow, lagging, regime-level information. See [[moving-averages|moving averages]].",["moving-averages"]);
G("Squeeze",["band squeeze"],"A long low-volatility compression that loads energy for an expansion.","See [[bollinger|Bollinger Bands]] and [[volatility|volatility]].",["bollinger"]);
G("Whipsaw",["whipsaw"],"Getting stopped out by violent two-way chop — sliced on both sides.","The tax of ranging markets: whipsaws cluster where traders apply trend tools to [[ranges|chop]].",["ranges"]);
G("Chop",["choppy"],"Messy, directionless price action full of fake moves.","Same family as [[ranges|ranges]] — the cure is standing aside or switching playbooks.",["ranges"]);
G("Round number",["round number","psych level"],"A memorable price like 100 or 50,000 where orders naturally cluster.","See [[round-numbers|round numbers]].",["round-numbers"]);
G("Liquidity grab",["grab"],"Synonym of a [[sweeps|liquidity sweep]]: a quick raid on stops.","See [[sweeps|sweeps]].",["sweeps"]);
G("Stop hunt",["stop hunt"],"Deliberate-sounding name for a [[sweeps|sweep]] — stops getting triggered before reversal.","See [[sweeps|liquidity sweeps]].",["sweeps"]);
G("Smart money",["smart money"],"A loose term for institutions and large professional flow.","Useful model, dangerous religion: see [[liquidity|liquidity]] for the mechanics without the mysticism.",["liquidity"]);
G("Retail trader",["retail"],"Individual traders like you and me, trading personal accounts.","The other side of the 'smart money' story — and the reason obvious levels get hunted. Knowledge is how retail stops being liquidity.",["liquidity"]);
G("Institutional trader",["institutional","institutions"],"Traders moving bank or fund size — the whales of the order flow.","Their problem is size: they can't enter where you do, which is the entire premise of [[order-blocks|order blocks]].",["order-blocks"]);
G("Fill or kill",["fok"],"An order that must be filled completely and immediately, or cancelled entirely.","One of the [[g-time-in-force|time-in-force]] flavors used by algorithms.",["order-types"]);
G("Iceberg order",["iceberg"],"A large order split into small visible slices so the market doesn't see its full size.","What you see in the [[order-book|book]] is rarely everything — icebergs are why walls sometimes absorb enormous volume.",["order-book"]);
G("Spoofing",["spoofing"],"Placing fake big orders to manipulate perception, then pulling them before execution.","Illegal on regulated markets, common everywhere. It is why you never fully trust a [[g-buy-wall|wall]].",["order-book"]);
G("Slippage tolerance",["slippage tolerance"],"The maximum price drift you accept on a market order — common setting in crypto swaps.","Set it too tight and orders fail; too wide and you donate. See [[slippage|slippage]].",["slippage"]);
G("Candlestick",["candle"],"One period of price drawn as body + wicks: open, high, low, close.","The whole encyclopedia starts here: [[what-is-candlestick|what is a candlestick]].",["what-is-candlestick"]);
G("Heikin-Ashi",["heikin ashi"],"Smoothed candles that make trends easier to see but distort real prices.","Great lenses, bad for exact entries — they don't show the true OHLC. See [[chart-types|chart types]].",["chart-types"]);
G("Renko",["renko"],"A chart type that draws bricks only when price moves a fixed amount, ignoring time.","Filters noise brutally; hides timing. Exotic cousin of [[chart-types|candle charts]].",["chart-types"]);
G("Line chart",["line chart"],"A chart connecting closing prices only.","Clean, but hides everything inside the period. See [[chart-types|chart types]].",["chart-types"]);
G("Bar chart",["ohlc chart","bar chart"],"OHLC drawn with ticks instead of bodies.","Same data as candles, less readable. See [[chart-types|chart types]].",["chart-types"]);
G("Multi-timeframe",["mtf"],"Using several timeframes together: higher for direction, lower for entries.","See [[multi-tf|top-down analysis]].",["multi-tf"]);
G("Swing high",["swing high"],"A local peak in price.","See [[swing-points|swing points]].",["swing-points"]);
G("Swing low",["swing low"],"A local valley in price.","See [[swing-points|swing points]].",["swing-points"]);
G("Higher high",["hh"],"A peak above the previous peak — a brick of uptrends.","See [[hh-hl|higher highs & lower lows]].",["hh-hl"]);
G("Lower low",["ll"],"A valley below the previous valley — a brick of downtrends.","See [[hh-hl|higher highs & lower lows]].",["hh-hl"]);
G("Trend change",["trend flip"],"When the staircase of highs and lows breaks.","See [[choch|CHoCH]] and [[market-structure|market structure]].",["choch"]);
G("Regime",["market regime"],"The current personality of the market: trending, ranging, volatile, quiet.","The first job every session: name the regime, then pick the playbook that fits it.",["ranges"]);
G("Edge case",["edge case"],"A rare situation where your rules meet unusual conditions.","Plan for news days, gaps and halts BEFORE they happen — see [[when-not-to-trade|when not to trade]].",[]);
G("Risk per trade",["risk %"],"The percentage of your account lost if the stop hits — the core dial of survival.","Standard: 1% or less. See [[one-percent|the 1% rule]].",["one-percent"]);
G("Max daily loss",["daily stop","kill switch"],"The loss amount that ends your trading day, no exceptions.","The circuit breaker that turns a bad day into a small day. See [[risk-management|risk management]].",["risk-management"]);
G("Breakeven stop",["be stop"],"Your stop moved to entry after the trade moves in your favor.","See [[breakeven|moving stop to breakeven]].",["breakeven"]);
G("Trailing stop",["trailing stop"],"A stop that follows price at a set distance, locking in gains as the move grows.","See [[stop-losses|stop losses]] and [[take-profit|take profit]].",["stop-losses"]);
G("Hard stop",["hard stop"],"A real stop order sitting in the market — as opposed to a mental promise.","Mental stops fail precisely when you need them most. See [[stop-losses|stop losses]].",["stop-losses"]);
G("Soft stop",["mental stop"],"A stop you plan to trigger manually.","Convenient, fragile, and famous for becoming 'just one more candle'. Upgrade to a [[g-hard-stop|hard stop]].",["stop-losses"]);
G("Overnight risk",["overnight risk"],"The risk you carry while markets move without you (gaps, news, crypto weekends).","Swing traders accept it; day traders avoid it; everyone should size for it. See [[gaps|gaps]].",["gaps"]);
G("Gap risk",["gap risk"],"The chance price opens far from your stop, skipping it entirely.","Why [[g-overnight-risk|overnight]] and news positions need smaller size. See [[gaps|gaps]].",["gaps"]);
G("Slippage cost",["slippage"],"The hidden tax of urgent orders.","See [[slippage|slippage]].",["slippage"]);
G("Commission",["commission"],"The broker's per-trade fee.","One of the [[fees|costs]] — small alone, deadly at high frequency.",["fees"]);
G("Swap fee",["swap"],"The overnight interest paid or earned on held positions.","See [[swaps|swaps]].",["swaps"]);
G("Funding",["funding"],"The periodic payment between longs and shorts in perpetual futures.","See [[funding-rates|funding rates]].",["funding-rates"]);
G("Open outcry",["open outcry"],"The old pit-trading system of shouted bids and hand signals.","The ancestor of today's [[order-book|electronic books]] — and the origin of half of trading's vocabulary.",[]);
G("Pit trader",["pit trader"],"A trader who worked the physical exchange pits.","Their fast-twitch style is the great-grandfather of modern [[trading-styles|scalping]].",["trading-styles"]);
G("Market maker",["mm"],"A firm continuously quoting both sides, earning the spread.","See [[market-makers|market makers]].",["market-makers"]);
G("High-frequency trading",["hft"],"Algorithmic trading at microsecond speeds, usually around spreads and order flow.","You can't beat HFT at speed — and you don't need to. Your game is hours and days, not microseconds.",["g-algo-trading"]);
G("Dark pool",["dark pool"],"A private venue where large orders trade away from public books.","Why big volume sometimes appears without moving price — another reason charts don't show everything.",["order-book"]);
G("Print",["trade print"],"A single executed transaction recorded by the exchange.","The raw atoms of [[g-order-flow|order flow]].",["g-order-flow"]);
G("Bid-ask bounce",["bid ask bounce"],"Price ticking between the bid and the ask without real direction.","Micro-noise that fools scalpers on tiny timeframes — the spread itself breathing.",["bid-ask-spread"]);
G("Crossing the spread",["cross"],"Taking liquidity immediately with a market order — paying the spread.","See [[bid-ask-spread|bid, ask & spread]].",["bid-ask-spread"]);
G("Queue position",["queue"],"Your place in line among resting limit orders at the same price.","First come, first served — being early at a level matters for [[g-fill|fills]].",["market-vs-limit-exec"]);
G("Laddering",["laddering"],"Placing entries or exits in several layers instead of one block.","A form of [[scaling|scaling]] — better average, more management.",["scaling"]);
G("Twap",["twap"],"Time-weighted average price — executing a big order in equal slices over time.","The patient cousin of [[g-vwap-benchmark|VWAP execution]], used by institutions to hide size.",[]);
G("Vwap benchmark",["vwap execution"],"The institutional yardstick: did we fill better than the day's average price?","The reason [[vwap|VWAP]] acts as a magnet — desks are graded against it.",["vwap"]);
G("Alpha",["alpha"],"Return above the market benchmark — the true measure of skill.","Buying one asset that rises with everything isn't alpha; it's beta with extra steps.",[]);
G("Beta",["beta"],"Return that comes from just riding the market.","Know which one you're earning before calling yourself a trader.",[]);
G("Sharpe ratio",["sharpe"],"Return divided by volatility — how smooth the road to profit is.","Two traders can make 20% a year; the one with fewer heart attacks has the better [[g-sharpe-ratio|Sharpe]].",[]);
G("Profit factor",["profit factor"],"Gross profit ÷ gross loss — above 1.5 is solid, above 2 is strong.","A quick health check from your [[journal|journal]], alongside [[expectancy|expectancy]].",["expectancy"]);
G("Maximum adverse excursion",["mae"],"How far a trade ever moved against you before the outcome.","The audit of your stops: if winners never needed that much room, your stops are paying for nothing. See [[stop-losses|stops]].",["stop-losses"]);
G("Win/loss ratio",["win loss"],"Wins divided by losses — a cousin of win rate.","Pair it with average win/loss size ([[risk-reward|R:R]]) or it tells you nothing.",["winrate"]);
G("Consistency",["consistency"],"Producing the same process under different market conditions and emotions.","The boring superpower: consistency of process first, consistency of profits second. See [[discipline|discipline]].",["discipline"]);
G("Discipline",["discipline"],"Executing your rules when feelings vote otherwise.","See [[discipline|discipline & routine]].",["discipline"]);
G("Tilt",["tilt"],"Emotional freefall after losses — the poker term trading borrowed.","The antidote is mechanical: loss caps, forced breaks, and a [[journal|journal]] that names the feeling. See [[revenge-trading|revenge trading]].",["revenge-trading"]);
G("Patience",["patience"],"The skill of holding cash until your setup appears.","See [[patience|patience]].",["patience"]);
G("FOMO",["fomo"],"Fear of missing out — chasing moves that already happened.","See [[fomo|FOMO]].",["fomo"]);
G("Revenge trade",["revenge trade"],"Re-entering immediately after a loss to win it back.","See [[revenge-trading|revenge trading]].",["revenge-trading"]);
G("Overtrading",["overtrading"],"More trades than your edge appears.","See [[overtrading|overtrading]].",["overtrading"]);
G("Analysis paralysis",["paralysis"],"Overthinking until no trade ever happens.","The fix is mechanical rules: if A and B then C — decisions pre-made by the [[trading-plan|plan]].",["trading-plan"]);
G("Confirmation bias",["confirmation bias"],"Collecting only evidence that supports your position.","See [[confirmation-bias|confirmation bias]].",["confirmation-bias"]);
G("Recency bias",["recency bias"],"Giving the last few trades too much weight over the whole sample.","One bad week doesn't kill a good system; ten losing trades in a 200-trade sample is math, not misfortune. See [[expectancy|expectancy]].",["expectancy"]);
G("Sunk cost",["sunk cost fallacy"],"Holding losers because of what they already cost you.","The market doesn't know your entry price. Decisions belong to the present: keep or exit based on what price does next, not what you paid. See [[handling-losses|handling losses]].",["handling-losses"]);
G("Hope trade",["hopium"],"Holding a losing position on hope instead of a plan.","Hope is a feeling, not a strategy — the stop is the strategy. See [[stop-losses|stop losses]].",["stop-losses"]);
G("Catching a falling knife",["falling knife"],"Buying aggressively while price is collapsing.","Sometimes brilliant, usually bloody — the difference is [[choch|structure confirming]] vs guessing. See [[candle-context|context]].",["choch"]);
G("Buying the dip",["buy the dip"],"Buying pullbacks in an ongoing uptrend.","The healthy version of the meme — with [[support-resistance|levels]], [[risk-management|stops]], and trend agreement. See [[pullbacks|pullbacks]].",["pullbacks"]);
G("Selling the rip",["sell the rip"],"Shorting bounces in an ongoing downtrend.","The bearish twin of buying the dip: rallies become entries, not celebrations.",["market-structure"]);
G("Rotation",["sector rotation"],"Money moving from one group of assets to another — e.g. tech into energy.","Rotation explains why your asset can be fine and still lag: the tide moved elsewhere.",[]);
G("Risk-on",["risk on"],"A market mood where money chases growth and volatility.","Crypto and small caps lead risk-on; the opposite regime is risk-off.",[]);
G("Risk-off",["risk off"],"A market mood where money hides in safety — bonds, gold, cash.","Risk-off is when correlations go to one and everything falls together. Regime first, trades second.",[]);
G("Flight to safety",["flight to quality"],"Investors rushing into safe assets during fear.","The macro version of [[g-risk-off|risk-off]] — visible in gold, bonds and the dollar.",[]);
G("Dead market",["dead market"],"A market with almost no volume or movement.","Nothing to trade, everything to lose in fees — see [[when-not-to-trade|when not to trade]].",["when-not-to-trade"]);
G("Liquidity desert",["thin market"],"A price zone with almost no resting orders.","Price teleports through deserts — that's where [[slippage|slippage]] and giant wicks are born. See [[order-book|order book]].",["slippage"]);
G("Thin book",["thin order book"],"Few resting orders available — the precondition for violent moves.","Same volume, thinner book, bigger candle. See [[order-book|order book]].",["order-book"]);
G("Deep market",["deep liquidity"],"Large resting orders at every level — big trades barely move price.","Deep markets are where beginners should learn: spreads are tight and surprises are smaller. See [[markets|choosing a market]].",["markets"]);
G("Circuit breaker",["circuit breaker"],"An automatic trading halt when moves get too extreme.","See [[g-circuit-breaker|circuit breaker]].",[]);
